      - "Léon Bottou"
      - "Francis Bach"
    venue: ""
    code_url: "https://github.com/facebookresearch/demucs"
    project_url: ""
    abstract: "Introduces Demucs, a waveform-domain U-Net for music source separation that isolates stems such as voice, bass and drums directly from raw audio. Shows that waveform-domain architectures with the right training strategy outperform spectrogram-based approaches on the MUSDB benchmark, with a time-domain modeling philosophy contrasting common audio synthesis pipelines."
