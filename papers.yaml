    project_url: ""
    abstract: "Introduces MusicLayout, an explicit intermediate representation describing a musical piece as a time-aligned layout of sections, textures, repetitions, variations and instrument-level arrangements — an interpretable planning layer between textual intent and generated audio. Integrated into a unified autoregressive framework where the model first generates the layout, then audio tokens, it enables inspectable, modifiable layout-level structural control and improves long-range organization."
