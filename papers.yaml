    abstract: "Music Flamingo is a large audio-language model advancing music and song understanding, trained on MF-Skills, a large-scale dataset with rich captions and QA pairs covering harmony, structure, timbre, lyrics and cultural context. A post-training recipe combining music-theory chain-of-thought data with GRPO-based reinforcement learning yields state-of-the-art results across 10+ music understanding and reasoning benchmarks."
    tags: ["audio-language model", "understanding", "GRPO"]
  - title: "Musical Training, but not Mere Exposure to Music, Drives the Emergence of Chroma Equivalence in Artificial Neural Networks"
    date: "2026-02"
    url: "https://arxiv.org/abs/2602.18635"
    category: "cognition"
    subcategory: "multimodal"
    authors:
      - "Lukas Grasse"
      - "Matthew S. Tata"
    venue: ""
    code_url: ""
    project_url: ""
    abstract: "Uses representational similarity analysis of auditory ANNs to test whether chroma equivalence — the cyclical octave similarity of pitch — is learned or innate. All models showed pitch height representation, but only models trained on a supervised music transcription task exhibited chroma equivalence; self-supervised exposure to music was insufficient, supporting chroma equivalence as a higher-order cognitive computation specific to music perception."
    tags: ["cognition", "pitch perception", "chroma", "ANN"]
  - title: "The MUSE Benchmark: Probing Music Perception and Auditory Relational Reasoning in Audio LLMs"
    date: "2025-10"
    url: "https://arxiv.org/abs/2510.19055"
    category: "cognition"
    subcategory: "agentic"
    authors:
      - "Brandon James Carone"
      - "Iran R. Roman"
      - "Pablo Ripollés"
    venue: ""
    code_url: ""
    project_url: ""
    abstract: "The Music Understanding and Structural Evaluation (MUSE) benchmark probes fundamental music perception skills with 10 tasks across four state-of-the-art multimodal LLMs versus a large human baseline (N=200). Reveals wide variance in capabilities and a persistent gap with human experts — some models perform at or near chance — and finds chain-of-thought prompting inconsistent, often detrimental."
    tags: ["benchmark", "perception", "MLLM"]
  - title: "WeaveMuse: An Open Agentic System for Multimodal Music Understanding and Generation"
    date: "2025-09"
    url: "https://arxiv.org/abs/2509.11183"
    category: "systems"
    subcategory: "agentic"
    authors:
      - "Emmanouil Karystinaios"
    venue: ""
    code_url: ""
    project_url: ""
    abstract: "WeaveMuse is a multi-agent system for music understanding, symbolic composition and audio synthesis: specialist agents interpret user requests and validate outputs while a manager agent selects tools and maintains state across turns. Supports local or API deployment, constraint schemas, structured decoding and parameter-efficient adapters, aiming to democratize MIR tools with interchangeable open models."
    tags: ["agents", "multimodal", "MIR"]
  - title: "MuseAgent-1: Interactive Grounded Multimodal Understanding of Music Scores and Performance Audio"
    date: "2026-01"
    url: "https://arxiv.org/abs/2601.11968"
