- title: 'MusPyExpress: Extending MusPy with Enhanced Expression Text Support'
  date: 2026-08
  url: https://arxiv.org/abs/2608.21678
  category: generation
  subcategory: audio
  authors:
  - Phillip Long
  - Hao-Wen Dong
  - Julian McAuley
  - Zachary Novack
  venue: NeurIPS 2025 Workshop on AI for Music
  code_url: ''
  project_url: ''
  abstract: Current work in modeling symbolic music primarily relies on representations
    extracted from MIDI-like data. While such formats allow for modeling symbolic
    music as sequences of notes, they omit the large space of symbolic annotations
    common in western sheet music broadly known as expression text, such as tempo
    or dynamics, which specify time- and velocity-dependent controls on the musical
    composition and performance. To alleviate this gap, we present MusPyExpress, an
    extension to the popular symbolic music processing library MusPy that enables
    the extraction of expression text along with symbolic music for downstream modeling.
    Utilizing this extension, we parse the PDMX dataset to illustrate the wealth of
    expression text available in MusicXML datasets. Additionally, we introduce multiple
    generative tasks, including joint expression-note generation, expression-conditioned
    music generation, and expression tagging, that take advantage of this additional
    notational information.
- title: 'MRMAD: A Multi-Round Multi-Audio Benchmark for Evaluating Acoustic Degradation
    Perception in Large Audio-Language Models'
  date: 2026-08
  url: https://arxiv.org/abs/2608.22236
  category: evaluation
  subcategory: audio
  authors:
  - Yize Li
  - Ningyuan Yang
  - Sile Yin
  - Sindhuja Thogarrati
  - Sung-En Chang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large audio-language models (LALMs) have shown promising progress in
    understanding speech, music, and general sound events, yet their ability to reason
    about how audio signals are degraded remains underexplored. Existing benchmarks
    primarily evaluate semantic understanding, event recognition, or high-level audio
    reasoning, leaving a basic question unanswered: Do LALMs understand the differences
    in audio quality? We introduce MRMAD, a Multi-Round Multi-Audio Degradation benchmark
    for evaluating audio degradation perception and understanding in LALMs. MRMAD
    spans speech, music, and sound, and frames evaluation as multi-turn dialogues
    over multiple audio inputs, requiring models to identify degradation types, compare
    severity, and perceive corruption changes across turns. Unlike current single-turn
    audio-language benchmarks, MRMAD evaluates whether LALMs can maintain consistent
    degradation hypotheses with new evidence and explain low-level acoustic phenomena
    in natural language. Through a systematic evaluation of 18 representative LALMs
    from non-thinking to reasoning and Omni models, we find that current models often
    recognize coarse content while failing to diagnose, compare, or reason about degradations
    reliably. MRMAD reveals an important yet overlooked aspect of audio-language understanding
    and provides a diagnostic foundation for building future LALMs that are robust
    to real-world acoustic conditions.'
- title: 'EXAM^2: \underline{Ex}tending \underline{A}udio Understanding in \underline{M}ultilingual
    and \underline{M}ultimodal Analysis'
  date: 2026-08
  url: https://arxiv.org/abs/2608.23758
  category: evaluation
  subcategory: audio
  authors:
  - Jiawen Wang
  - Xiaoxue Gao
  - Zi Haur Pang
  - Nancy F. Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Recent large audio language models (LALMs) have achieved impressive progress
    in audio understanding. However, existing evaluations remain largely constrained
    to English and narrow audio domains. Prior benchmarks typically focus on a single
    audio modality, i.e., speech, sound, or music, limiting the systematic investigation
    into how these models generalize across diverse visual scenarios. In this paper,
    we introduce EXAM^2, a benchmark for multilingual and multimodal audio understanding
    spanning six languages and multiple modalities, including speech, sound, music,
    mixed-audio settings, and visual images. By incorporating visual information alongside
    heterogeneous audio inputs, EXAM^2 enables more realistic evaluation of scene-aware
    audio reasoning and cross-modal comprehension. EXAM^2 comprises 5,667 multiple-choice
    questions, 22,614 image instances, and 135,684 multilingual translations. We evaluate
    state-of-the-art open-source and proprietary LALMs as well as multimodal LLMs,
    revealing substantial performance gaps in multilingual and cross-modal understanding.
    Furthermore, we propose Gemma3n-EXAM^2, a lightweight fusion-model fine-tuned
    on EXAM^2-train, achieves up to 12.4\% improvement in multilingual settings and
    21.7\% gains in multimodal evaluation over a strong baseline. Empirical results
    establish EXAM^2 as a challenging benchmark and pioneer future multilingual and
    multimodal audio intelligence research.
- title: 'AT-ADD: A Benchmark and Challenge for Robust and All-Type Audio Deepfake
    Detection'
  date: 2026-08
  url: https://arxiv.org/abs/2608.23437
  category: evaluation
  subcategory: audio
  authors:
  - Yuankun Xie
  - Haonan Cheng
  - Jiayi Zhou
  - Xiaoxuan Guo
  - Tao Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Recent audio generation models can synthesize high-fidelity speech, environmental
    sound, singing voice, and music, creating new risks for multimedia trust. Existing
    audio deepfake detection (ADD) benchmarks remain predominantly speech-centric
    and often underrepresent realistic channel variation and diverse audio types.
    This paper presents AT-ADD, a large-scale benchmark and challenge designed to
    evaluate both robust speech deepfake detection and all-type audio deepfake detection.
    Track 1 evaluates binary speech detection under unseen generators, diverse recording
    conditions, signal perturbations, and replay effects. Track 2 evaluates type-agnostic
    real/fake detection over speech, sound, singing, and music when the audio type
    is unknown at test time. We detail the dataset construction, evaluation protocol,
    and reproducible baselines, and analyze the final systems submitted to the ACM
    Multimedia 2026 Grand Challenge. The strongest official baseline obtains 76.73%
    and 79.47% Macro-F1 on the Track 1 and Track 2 evaluation sets, respectively,
    whereas the winning challenge systems reach 90.71% and 96.10%. Beyond aggregate
    rankings, sample-level analysis of the top five submissions examines generator-
    and type-level difficulty, cross-system error complementarity, and ranking stability.
    The results show that large-scale self-supervised representations, condition-aware
    augmentation, multi-crop inference, and structured fusion or routing are central
    to generalization, while generator-specific robustness and consistent performance
    across diverse audio types remain unresolved.
