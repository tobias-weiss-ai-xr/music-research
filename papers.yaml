  # ── Systems · Agentic ───────────────────────────────────────────────────────
  - title: "Libretto: Giving LLM Agents a Sense of Musical Structure"
    date: "2026-06"
    url: "https://arxiv.org/abs/2606.22708"
    category: "systems"
    subcategory: "agentic"
    authors:
