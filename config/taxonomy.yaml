topic:
  name: Music Research
  short: music-research
  description: 'Open, agentic literature review of music research: AI music generation,
    music information retrieval (MIR), music understanding, perception & cognition,
    evaluation, and surveys — symbolic, audio, multimodal, and agentic systems.'
taxonomy:
  categories:
  - id: generation
    display: Music Generation & Composition
  - id: analysis
    display: Music Analysis & Understanding
  - id: cognition
    display: Music Perception & Cognition
  - id: systems
    display: AI Music Systems & Agents
  - id: evaluation
    display: Evaluation & Benchmarks
  - id: survey
    display: Surveys & Taxonomies
  subcategories:
  - id: audio
    display: Audio
  - id: symbolic
    display: Symbolic
  - id: multimodal
    display: Multimodal & Text
  - id: agentic
    display: Agentic & LLM
arxiv_queries:
- query: cat:cs.SD AND (abs:"music generation" OR abs:"text-to-music" OR abs:"symbolic
    music generation")
  category: generation
- query: cat:cs.SD AND (abs:"music information retrieval" OR abs:"music transcription"
    OR abs:"music source separation")
  category: analysis
- query: cat:eess.AS AND (abs:"music" AND (abs:"music understanding" OR abs:"music
    foundation model"))
  category: analysis
- query: cat:cs.AI AND (abs:"music" AND (abs:"music agent" OR abs:"LLM agent"))
  category: systems
- query: cat:cs.SD AND (abs:"music" AND (abs:"benchmark" OR abs:"evaluation metric"))
  category: evaluation
other_sources_queries:
- source: dblp
  query: music generation transformer
  category: generation
  subcategory_hint: symbolic
- source: crossref
  query: music information retrieval survey
  category: survey
  subcategory_hint: audio
- source: semantic_scholar
  query: LLM music understanding agent
  category: systems
  subcategory_hint: agentic
openalex_queries:
- category: generation
  query: music generation deep learning transformer diffusion
- category: analysis
  query: music information retrieval transcription source separation
- category: cognition
  query: music perception cognition neuroscience
- category: systems
  query: music AI agents large language models
- category: evaluation
  query: music generation evaluation benchmark dataset
github_queries:
- query: topic:music-generation+stars:>100
  category: generation
- query: topic:music-information-retrieval+stars:>50
  category: analysis
- query: topic:music-source-separation+stars:>100
  category: analysis
- query: music+LLM+stars:>100
  category: systems
  subcategory_hint: agentic
- query: awesome-music+stars:>100
  category: survey
gitlab_queries:
- query: music generation
  category: generation
  min_stars: 10
- query: music information retrieval
  category: analysis
  min_stars: 5
codeberg_queries:
- query: music
  category: generation
  min_stars: 5
repo_signals:
- music generation
- music information retrieval
- music understanding
- music source separation
- symbolic music
