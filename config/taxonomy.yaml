# ⚙️ Research Taxonomy & Discovery Config
#
# This is the ONLY file you need to adapt for your own research topic.
# Edit categories/subcategories + discovery queries, then re-run the pipeline.
#
# Pipeline:  config/taxonomy.yaml → papers.yaml → validate → README → reports

# ── Topic ────────────────────────────────────────────────────────────────────
topic:
  name: "Music Research"             # shown in README header
  short: "music-research"            # used in URLs, badges, docs paths
  description: "Open, agentic literature review of music research: AI music generation, music information retrieval (MIR), music understanding, perception & cognition, evaluation, and surveys — symbolic, audio, multimodal, and agentic systems."

# ── Taxonomy ─────────────────────────────────────────────────────────────────
# Categories = the main axis of your review (e.g. methods, applications, …).
# Subcategories = the secondary axis (e.g. architectures, benchmarks, …).
# Every paper in papers.yaml must carry one category + one subcategory.
taxonomy:
  categories:                           # ordered list
    - id: generation
      display: "Music Generation & Composition"
    - id: analysis
      display: "Music Analysis & Understanding"
    - id: cognition
      display: "Music Perception & Cognition"
    - id: systems
      display: "AI Music Systems & Agents"
    - id: evaluation
      display: "Evaluation & Benchmarks"
    - id: survey
      display: "Surveys & Taxonomies"
  subcategories:
    - id: audio
      display: "Audio"
    - id: symbolic
      display: "Symbolic"
    - id: multimodal
      display: "Multimodal & Text"
    - id: agentic
      display: "Agentic & LLM"

# ── Discovery: arXiv queries (fetch_new_papers.py) ───────────────────────────
# Each entry is an arXiv API query string (cat: + abs:/ti: operators).
# Keep them topic-specific; the script deduplicates automatically.
arxiv_queries:
  - 'cat:cs.SD AND (abs:"music generation" OR abs:"text-to-music" OR abs:"symbolic music generation")'
  - 'cat:cs.SD AND (abs:"music information retrieval" OR abs:"music transcription" OR abs:"music source separation")'
  - 'cat:eess.AS AND (abs:"music" AND (abs:"music understanding" OR abs:"music foundation model"))'
  - 'cat:cs.AI AND (abs:"music" AND (abs:"music agent" OR abs:"LLM agent"))'
  - 'cat:cs.SD AND (abs:"music" AND (abs:"benchmark" OR abs:"evaluation metric"))'

# ── Discovery: multi-source queries (fetch_other_sources.py) ─────────────────
# Each entry defines one query against a source (dblp, crossref, europepmc, …).
# NOTE: the canonical file for these is config/other_sources_queries.yaml.
other_sources_queries:
  - source: dblp
    query: music generation transformer
    category: generation
    subcategory_hint: symbolic
  - source: crossref
    query: music information retrieval survey
    category: survey
    subcategory_hint: audio
  - source: semantic_scholar
    query: LLM music understanding agent
    category: systems
    subcategory_hint: agentic

# ── OpenAlex bulk fetch (fetch_openalex_bulk.py) ─────────────────────────────
# Per-category OpenAlex search phrases.
openalex_queries:
  - category: generation
    query: "music generation deep learning transformer diffusion"
  - category: analysis
    query: "music information retrieval transcription source separation"
  - category: cognition
    query: "music perception cognition neuroscience"
  - category: systems
    query: "music AI agents large language models"
  - category: evaluation
    query: "music generation evaluation benchmark dataset"

# ── GitHub repository discovery (fetch_github_repos.py) ─────────────────────
# Each entry is a GitHub search query (topic:, keyword combos, stars:>N).
# Optional keys: category, subcategory_hint, min_stars (per-query override).
# See: https://docs.github.com/en/search-github/searching-on-github/searching-for-repositories
github_queries:
  - query: "topic:music-generation+stars:>100"
    category: generation
  - query: "topic:music-information-retrieval+stars:>50"
    category: analysis
  - query: "topic:music-source-separation+stars:>100"
    category: analysis
  - query: "music+LLM+stars:>100"
    category: systems
    subcategory_hint: agentic
  - query: "awesome-music+stars:>100"
    category: survey

# ── GitLab repository discovery (fetch_gitlab_repos.py) ──────────────────────
# GitLab public API — no CLI required.  Optional keys: category,
# subcategory_hint, min_stars, topics (list), language.
gitlab_queries:
  - query: "music generation"
    category: generation
    min_stars: 10
  - query: "music information retrieval"
    category: analysis
    min_stars: 5

# ── Codeberg repository discovery (fetch_codeberg_repos.py) ──────────────────
# Gitea-compatible API.  Optional keys: category, subcategory_hint,
# min_stars, language, owner (restrict to org/user).
codeberg_queries:
  - query: "music"
    category: generation
    min_stars: 5

# ── Relevance signals for repo fetchers (optional) ──────────────────────────
# Extra keyword tokens shared by ALL repo fetchers (github, gitlab, codeberg)
# to filter out irrelevant repos from broad searches.
# Auto-extracted from: topic.name, topic.description, taxonomy IDs.
repo_signals:
  - "music generation"
  - "music information retrieval"
  - "music understanding"
  - "music source separation"
  - "symbolic music"
