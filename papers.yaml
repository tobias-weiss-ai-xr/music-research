  - title: "Pushing the Frontier of Full-Song Generation: Hierarchical Autoregressive Planning Meets Flow-Matching Rendering"
    date: "2026-07"
    url: "https://arxiv.org/abs/2607.20253"
    category: "generation"
    subcategory: "audio"
    authors:
      - "Junyu Dai"
      - "Xinyue Fan"
      - "Weiqin Li"
      - "Xiangang Li"
      - "Yunjia Li"
      - "Bin Ma"
      - "Yukun Ma"
      - "Chongjia Ni"
    venue: ""
    code_url: ""
    project_url: ""
    abstract: "A unified full-song generation framework supporting lyrics-to-song, instrumental and cover-song generation: a semantic-aware tokenizer encodes audio into 8-codebook RVQ tokens, a hybrid LM performs hierarchical autoregressive planning, and FullDiT renders via full-song flow matching in a continuous VAE latent space conditioned on codec tokens, lyrics and captions. Explores DPO, GRPO and OPD reward-based post-training to improve musicality."
