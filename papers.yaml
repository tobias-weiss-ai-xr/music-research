    code_url: ""
    project_url: ""
    abstract: "ABC-Eval is the first open-source benchmark for LLM understanding and instruction following on text-based ABC notation scores: 1,086 test samples across 10 sub-tasks from basic syntax comprehension to sequence-level reasoning. Evaluations of seven state-of-the-art LLMs reveal notable limitations in symbolic music processing capabilities."
