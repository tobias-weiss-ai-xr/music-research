papers:
- title: 'MusicLM: Generating Music From Text'
  date: 2023-01
  url: https://arxiv.org/abs/2301.11325
  category: generation
  subcategory: audio
  authors:
  - Andrea Agostinelli
  - Timo I. Denk
  - Zalán Borsos
  - Jesse Engel
  - Mauro Verzetti
  - Antoine Caillon
  - Qingqing Huang
  - Aren Jansen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Introduces MusicLM, a model generating high-fidelity music from text descriptions
    such as 'a calming violin melody backed by a distorted guitar riff'. Casts conditional
    music generation as a hierarchical sequence-to-sequence task and produces 24 kHz
    music coherent over minutes, with new capabilities such as story-mode generation
    and text-conditioned melody control.
  tags:
  - text-to-music
  - hierarchical
  - AudioLM
- title: Simple and Controllable Music Generation
  date: 2023-06
  url: https://arxiv.org/abs/2306.05284
  category: generation
  subcategory: audio
  authors:
  - Jade Copet
  - Felix Kreuk
  - Itai Gat
  - Tal Remez
  - David Kant
  - Gabriel Synnaeve
  - Yossi Adi
  - Alexandre Défossez
  venue: NeurIPS 2023
  code_url: https://github.com/facebookresearch/audiocraft
  project_url: ''
  abstract: Introduces MusicGen, a single language model operating over several streams
    of compressed discrete music representation (tokens). Unlike prior work, MusicGen
    uses a single-stage transformer LM with efficient token interleaving, supporting
    text- and melody-conditioned generation with state-of-the-art results and a small,
    open-sourced model.
  tags:
  - text-to-music
  - language model
  - EnCodec
- title: Music Transformer
  date: 2018-09
  url: https://arxiv.org/abs/1809.04281
  category: generation
  subcategory: symbolic
  authors:
  - Cheng-Zhi Anna Huang
  - Ashish Vaswani
  - Jakob Uszkoreit
  - Noam Shazeer
  - Ian Simon
  - Curtis Hawthorne
  - Andrew M. Dai
  - Matthew D. Hoffman
  venue: ICLR 2019
  code_url: https://github.com/magenta/music-transformer
  project_url: ''
  abstract: Adapts the Transformer to symbolic music by introducing relative attention,
    which lets the model exploit musical repetition and self-reference across timescales
    from motifs to full ABA sections. Demonstrates long, coherent generation of piano
    performance, addressing the quadratic memory cost of full attention for long sequences.
  tags:
  - symbolic
  - transformer
  - relative attention
- title: 'Pop Music Transformer: Beat-based Modeling and Generation of Expressive
    Pop Piano Compositions'
  date: 2020-02
  url: https://arxiv.org/abs/2002.00212
  category: generation
  subcategory: symbolic
  authors:
  - Yu-Siang Huang
  - Yi-Hsuan Yang
  venue: ACM Multimedia 2020
  code_url: https://github.com/sander-wood/pop-music-transformer
  project_url: ''
  abstract: Proposes the Compound Word Transformer for pop piano generation. By encoding
    musical events in a beat-based 'compound word' representation and training with
    masking on a large pop piano dataset, the model generates expressive compositions
    with consistent structure, surpassing prior Transformer and RNN baselines in both
    objective and human evaluations.
  tags:
  - symbolic
  - pop music
  - compound word
- title: 'Museformer: Transformer with Fine- and Coarse-Grained Attention for Music
    Generation'
  date: 2022-10
  url: https://arxiv.org/abs/2210.10349
  category: generation
  subcategory: symbolic
  authors:
  - Botao Yu
  - Peiling Lu
  - Rui Wang
  - Wei Hu
  - Xu Tan
  - Wei Ye
  - Shikun Zhang
  - Tao Qin
  venue: NeurIPS 2022
  code_url: https://github.com/microsoft/muzic/tree/main/museformer
  project_url: ''
  abstract: Presents Museformer, a Transformer with fine- and coarse-grained attention
    for symbolic music generation. The coarse-grained attention reduces complexity
    while preserving global structure, and an automatic pattern learning mechanism
    discovers which tokens benefit from which granularity, enabling efficient generation
    of sequences over 10,000 tokens with strong structure.
  tags:
  - symbolic
  - efficient attention
  - long sequence
- title: Music Source Separation in the Waveform Domain
  date: 2019-11
  url: https://arxiv.org/abs/1911.13254
  category: analysis
  subcategory: audio
  authors:
  - Alexandre Défossez
  - Nicolas Usunier
  - Léon Bottou
  - Francis Bach
  venue: ''
  code_url: https://github.com/facebookresearch/demucs
  project_url: ''
  abstract: Introduces Demucs, a waveform-domain U-Net for music source separation
    that isolates stems such as voice, bass and drums directly from raw audio. Shows
    that waveform-domain architectures with the right training strategy outperform
    spectrogram-based approaches on the MUSDB benchmark, with a time-domain modeling
    philosophy contrasting common audio synthesis pipelines.
  tags:
  - source separation
  - waveform
  - U-Net
- title: 'MT3: Multi-Task Multitrack Music Transcription'
  date: 2021-11
  url: https://arxiv.org/abs/2111.03017
  category: analysis
  subcategory: audio
  authors:
  - Josh Gardner
  - Ian Simon
  - Ethan Manilow
  - Curtis Hawthorne
  - Jesse Engel
  venue: ICLR 2022
  code_url: https://github.com/magenta/mt3
  project_url: ''
  abstract: 'Frames automatic music transcription as a sequence-to-sequence task:
    audio spectrograms are transcribed into token sequences representing multiple
    instruments and pitches simultaneously. MT3 achieves state-of-the-art results
    on MAESTRO and, via multi-task training, generalizes to unseen instruments in
    Slakh2100.'
  tags:
  - transcription
  - multitrack
  - sequence-to-sequence
- title: 'MERT: Acoustic Music Understanding Model with Large-Scale Self-supervised
    Training'
  date: 2023-05
  url: https://arxiv.org/abs/2306.00107
  category: analysis
  subcategory: audio
  authors:
  - Yizhi Li
  - Ruibin Yuan
  - Ge Zhang
  - Yinghao Ma
  - Xingran Chen
  - Hanzhi Yin
  - Chenghao Xiao
  - Chenghua Lin
  venue: IJCNN 2024
  code_url: https://github.com/yizhilll/MERT
  project_url: ''
  abstract: MERT is an acoustic music understanding model trained with large-scale
    self-supervised learning, combining teacher models from music and general audio
    domains with a multi-level musical supervision objective. It achieves state-of-the-art
    results on music classification, tagging, and emotion recognition while keeping
    strong transfer to downstream MIR tasks.
  tags:
  - self-supervised
  - music embeddings
  - MIR
- title: 'LP-MusicCaps: LLM-Based Pseudo Music Captioning'
  date: 2023-07
  url: https://arxiv.org/abs/2307.16372
  category: analysis
  subcategory: multimodal
  authors:
  - SeungHeon Doh
  - Keunwoo Choi
  - Jongpil Lee
  - Juhan Nam
  venue: ISMIR 2023
  code_url: https://github.com/seungheondoh/LP-MusicCaps
  project_url: ''
  abstract: Addresses the cost of music captioning data by generating pseudo captions
    with a large language model from structured tags. The resulting LP-MusicCaps dataset
    enables music captioning models and a text-to-music retrieval model to reach performance
    comparable to training on human-annotated captions.
  tags:
  - captioning
  - LLM
  - dataset
- title: 'ChatMusician: Understanding and Generating Music Intrinsically with LLM'
  date: 2024-02
  url: https://arxiv.org/abs/2402.16153
  category: systems
  subcategory: multimodal
  authors:
  - Ruibin Yuan
  - Hanfeng Lin
  - Yi Wang
  - Zeyue Tian
  - Shangda Wu
  - Tianhao Shen
  - Ge Zhang
  - Yuhang Wu
  venue: ACL 2024
  code_url: https://github.com/microsoft/muzic/tree/main/chatmusician
  project_url: ''
  abstract: 'ChatMusician is an open-source LLM with intrinsic musical abilities:
    it understands and generates music using an ABC notation-based tokenizer, without
    external tools, and even composes continuations of given pieces. It outperforms
    GPT-4 on a music understanding benchmark while retaining strong text capabilities.'
  tags:
  - LLM
  - ABC notation
  - music understanding
- title: 'Libretto: Giving LLM Agents a Sense of Musical Structure'
  date: 2026-06
  url: https://arxiv.org/abs/2606.22708
  category: systems
  subcategory: agentic
  authors:
  - Yichen Xu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Generative music systems produce impressive audio from text prompts, but
    audio output is hard to inspect, edit and diagnose structurally. Libretto is an
    agent-facing framework for symbolic music generation and revision built on an
    LLM-native grammar with explicit onset slots, voices and bar-level organization,
    giving agents a manipulable representation of musical structure.
  tags:
  - agents
  - symbolic
  - LLM grammar
- title: 'Music I Care About: Automated Multimodal Benchmarking of LLM Music Perception
    Skills on (Almost) Any Music'
  date: 2026-07
  url: https://arxiv.org/abs/2607.06015
  category: evaluation
  subcategory: agentic
  authors:
  - Tomáš Sourada
  - Katia Vendrame
  - Jan Hajič
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Challenges static music benchmarks for multimodal LLMs: they are expensive
    to evaluate and quickly become outdated. The paper proposes automated benchmarking
    of LLM music perception skills on (almost) any music, covering audio, symbolic
    encodings (MIDI, MusicXML) and sheet music modalities, to keep evaluation cheap,
    current and comprehensive.'
  tags:
  - benchmark
  - MLLM
  - perception
- title: A Survey on Music Generation from Single-Modal, Cross-Modal, and Multi-Modal
    Perspectives
  date: 2025-04
  url: https://arxiv.org/abs/2504.00837
  category: survey
  subcategory: multimodal
  authors:
  - Shuyu Li
  - Shulei Ji
  - Zihao Wang
  - Songruoyao Wu
  - Jiaxing Yu
  - Kejun Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Reviews music generation systems from the perspective of modalities, categorizing
    approaches as single-modal (score- or audio-only), cross-modal (text/image/video
    guidance) and multi-modal. Discusses datasets, methodologies and future directions
    for multimodal music generation, a fast-growing area with applications from film
    scoring to interactive creation.
  tags:
  - survey
  - multimodal
  - generation
- title: 'Vision-to-Music Generation: A Survey'
  date: 2025-03
  url: https://arxiv.org/abs/2503.21254
  category: survey
  subcategory: multimodal
  authors:
  - Zhaokai Wang
  - Chenxi Bao
  - Le Zhuo
  - Jingrui Han
  - Yang Yue
  - Yihong Tang
  - Victor Shea-Jay Huang
  - Yue Liao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: A survey of vision-to-music generation (video-to-music and image-to-music),
    a significant branch of multimodal AI with applications in film scoring, short-video
    creation and dance music synthesis. Systematizes methods, datasets and evaluation
    protocols, and outlines open challenges for aligning visual content with music
    generation.
  tags:
  - survey
  - vision-to-music
  - multimodal
- title: A Survey on Multimodal Music Emotion Recognition
  date: 2025-04
  url: https://arxiv.org/abs/2504.18799
  category: survey
  subcategory: multimodal
  authors:
  - Rashini Liyanarachchi
  - Aditya Joshi
  - Erik Meijering
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Comprehensive overview of multimodal music emotion recognition (MMER),
    an emerging discipline in music information retrieval. Discusses approaches combining
    audio, lyrics, video and contextual signals, datasets, feature representations,
    fusion strategies and open challenges toward robust, culturally-aware music emotion
    understanding.
  tags:
  - survey
  - emotion
  - MIR
- title: A Survey on Evaluation Metrics for Music Generation
  date: 2025-08
  url: https://arxiv.org/abs/2509.00051
  category: survey
  subcategory: audio
  authors:
  - Faria Binte Kader
  - Santu Karmaker
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Sheds light on the evaluation of generated music, which lags behind generation
    capabilities due to music's complex structure, coherence, creativity and emotional
    expressiveness. Reviews existing objective and subjective evaluation metrics,
    identifies gaps and offers directions for more comprehensive evaluation of music
    generation systems.
  tags:
  - survey
  - evaluation
  - generation
- title: 'SAGE-Music: Low-Latency Symbolic Music Generation via Attribute-Specialized
    Key-Value Head Sharing'
  date: 2025-10
  url: https://arxiv.org/abs/2510.00395
  category: generation
  subcategory: symbolic
  authors:
  - Jiaye Tan
  - Haonan Luo
  - Linfeng Song
  - Shuaiqi Chen
  - Yishan Lyu
  - Zian Zhong
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Proposes Attribute-Specialized Key-Value Head Sharing (AS-KVHS), adapted
    to music's structured symbolic representation, achieving about 30% inference speedup
    with negligible quality drop for low-latency symbolic music generation. Includes
    the first systematic study of BPE tokenization's generalizability in multi-track
    symbolic music and releases SAGE-Music, an open-source benchmark matching or surpassing
    state-of-the-art generation quality.
  tags:
  - symbolic
  - low-latency
  - tokenization
- title: 'CompLex: Music Theory Lexicon Constructed by Autonomous Agents for Automatic
    Music Generation'
  date: 2025-08
  url: https://arxiv.org/abs/2508.19603
  category: systems
  subcategory: agentic
  authors:
  - Zhejing Hu
  - Yan Liu
  - Gong Chen
  - Bruce X. B. Yu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Introduces CompLex, an automatically constructed music-theory lexicon
    of 37,432 items derived from only 9 category keywords and 5 prompt templates,
    built by a multi-agent algorithm that detects and mitigates hallucinations. Demonstrates
    consistent improvements across three state-of-the-art text-to-music generation
    models (symbolic and audio) and evaluates the lexicon for completeness, accuracy,
    non-redundancy and executability.
  tags:
  - agents
  - music theory
  - lexicon
- title: 'BeatEdit: Symbolic Music Generation as Explicit Editing'
  date: 2026-07
  url: https://arxiv.org/abs/2607.11124
  category: generation
  subcategory: symbolic
  authors:
  - Haoyu Gu
  - Lekai Qian
  - Haowu Zhou
  - Qi Liu
  - Shuai Wang
  venue: ''
  code_url: https://github.com/Haoyu-Gu/BeatEdit-code
  project_url: ''
  abstract: First framework for symbolic music generation based on explicit edit operations,
    recasting generation as editing a draft rather than synthesizing from scratch.
    Built on the beat-grid-anchored BEAT encoding, BeatEdit combines per-token sequence
    tagging, iterative refinement and tag-then-fill mechanisms sharing a single pre-trained
    backbone, achieving higher precision and perceptual quality than autoregressive
    and diffusion baselines with single-pass inference under 100 ms.
  tags:
  - symbolic
  - editing
  - BEAT encoding
- title: 'Diff-Symbo: Text-Controlled Long-Duration Symbolic Music Generation Using
    Autoregressive Latent Diffusion Model'
  date: 2026-08
  url: https://arxiv.org/abs/2608.05222
  category: generation
  subcategory: symbolic
  authors:
  - Zhiwei Lin
  - Jun Chen
  - Boshi Tang
  - Weihao Wu
  - Yang Jing
  - Yaolong Ju
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Presents Diff-Symbo, a latent diffusion model for text-controlled symbolic
    music generation with high quality, diversity and long duration, supported by
    a new dataset of 19,345 text templates built with a large language model and a
    music information encoder for efficient control. Shows significant gains in text
    controllability, duration and quality over baselines such as GPT-4, MuseCoco and
    the Multitrack Music Transformer.
  tags:
  - symbolic
  - latent diffusion
  - text-to-music
- title: 'MuseCPBench: an Empirical Study of Music Editing Methods through Music Context
    Preservation'
  date: 2025-12
  url: https://arxiv.org/abs/2512.14629
  category: evaluation
  subcategory: audio
  authors:
  - Yash Vishe
  - Eric Xue
  - Xunyi Jiang
  - Zachary Novack
  - Junda Wu
  - Julian McAuley
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Introduces the first benchmark for Music Context Preservation (MCP) in
    music editing, covering four categories of musical facets that should remain unchanged
    during editing (e.g., timbre transfer, instrument substitution, genre transformation).
    Enables comprehensive comparisons across five representative music editing baselines
    and identifies consistent preservation gaps, offering practical guidance for more
    reliable music editing.
  tags:
  - benchmark
  - editing
  - evaluation
- title: 'Shao: Scaling Acoustic Token Language Models Toward High-Fidelity Music
    Generation'
  date: 2026-05
  url: https://arxiv.org/abs/2605.01790
  category: generation
  subcategory: audio
  authors:
  - Jiafeng Liu
  - Yuanliang Dong
  - Hongjia Liu
  - Yuqing Cheng
  - Zhancheng Guo
  - Huijing Liang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Explores modeling music structure and fidelity progressively within a
    single deep acoustic-token hierarchy: a 64-layer residual vector quantization
    (RVQ) representation with a two-stage coarse-to-fine generation framework. The
    backbone generates coarse tokens for the full track, then a super-resolution model
    refines finer tokens with hybrid-attention training, showing that text-vocal alignment
    can emerge in pure acoustic-token language modeling without a separate semantic
    stage.'
  tags:
  - audio
  - RVQ
  - language model
- title: 'Aligning Generative Music AI with Human Preferences: Methods and Challenges'
  date: 2025-11
  url: https://arxiv.org/abs/2511.15038
  category: survey
  subcategory: audio
  authors:
  - Dorien Herremans
  - Abhinaba Roy
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Advocates for systematic preference alignment in music generation, bridging
    computational optimization and human musical appreciation. Reviews recent breakthroughs
    (MusicRL, diffusion-based preference optimization, inference-time optimization)
    and identifies music-specific challenges such as temporal coherence, harmonic
    consistency, subjective quality assessment and scalability to long-form compositions,
    calling for interdisciplinary research toward personalized music AI.
  tags:
  - survey
  - preference alignment
  - RLHF
- title: Can LLMs understand LilyPond? A benchmark for symbolic music generation and
    understanding
  date: 2026-06
  url: https://arxiv.org/abs/2606.08722
  category: evaluation
  subcategory: agentic
  authors:
  - Matteo Spanio
  - Mohammad Torabi
  - Andrea Poltronieri
  - Antonio Rodà
  venue: ''
  code_url: https://github.com/CSCPadova/lilybench
  project_url: ''
  abstract: 'Introduces LilyBench, a LilyPond-based benchmark jointly evaluating symbolic
    music generation and understanding in open-weight LLMs: a 200-prompt generation
    suite plus ten understanding tasks adapted from ABC-Eval. Generation quality is
    scored via compile rate, MusPy descriptor distributions and LilyBERT-based Fréchet
    Music Distance; results show executable LilyPond generation is feasible zero-shot
    while structural understanding remains challenging, and metric triangulation beats
    single-score ranking.'
  tags:
  - benchmark
  - LLM
  - LilyPond
- title: Enhancing Automatic Chord Recognition through LLM Chain-of-Thought Reasoning
  date: 2025-09
  url: https://arxiv.org/abs/2509.18700
  category: analysis
  subcategory: multimodal
  authors:
  - Chih-Cheng Chang
  - Bo-Yu Chen
  - Lu-Rong Chen
  - Li Su
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Positions text-based LLMs as intelligent coordinators that integrate outputs
    from diverse MIR tools (source separation, key detection, chord recognition, beat
    tracking) via a 5-stage chain-of-thought framework, converting audio-derived musical
    information into textual representations for reasoning and correction. Achieves
    consistent accuracy gains of 1-2.77% on the MIREX metric across three datasets,
    opening directions for multi-tool coordination in MIR.
  tags:
  - MIR
  - chord recognition
  - LLM
  - chain-of-thought
- title: 'MindMelody: A Closed-Loop EEG-Driven System for Personalized Music Intervention'
  date: 2026-05
  url: https://arxiv.org/abs/2605.01235
  category: cognition
  subcategory: audio
  authors:
  - Yimeng Zhang
  - Yueru Sun
  - Haoyu Gu
  - Zhanpeng Jin
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'MindMelody is a closed-loop real-time system for EEG-driven personalized
    music intervention: a hybrid Transformer-GNN decodes EEG into Valence-Arousal
    states, a RAG-equipped LLM formulates intervention plans, and a hierarchical EEG
    controller injects affect prefixes and temporal guidance into a pretrained music
    backbone. A continuous feedback loop adapts generation to evolving EEG dynamics,
    improving control adherence and emotional alignment.'
  tags:
  - EEG
  - brain-computer interface
  - emotion
  - intervention
- title: 'MusicLayout: Explicit Structural Planning for Controllable Text-to-Music
    Generation'
  date: 2026-08
  url: https://arxiv.org/abs/2608.09035
  category: generation
  subcategory: audio
  authors:
  - Shuyu Li
  - Kejun Zhang
  - Jiahe Lei
  - Shulei Ji
  - Zihao Wang
  - Jiaxing Yu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Introduces MusicLayout, an explicit intermediate representation describing
    a musical piece as a time-aligned layout of sections, textures, repetitions, variations
    and instrument-level arrangements — an interpretable planning layer between textual
    intent and generated audio. Integrated into a unified autoregressive framework
    where the model first generates the layout, then audio tokens, it enables inspectable,
    modifiable layout-level structural control and improves long-range organization.
  tags:
  - text-to-music
  - structure
  - controllability
- title: 'MuScriptor: An Open Model for Multi-Instrument Music Transcription'
  date: 2026-07
  url: https://arxiv.org/abs/2607.08168
  category: analysis
  subcategory: audio
  authors:
  - Simon Rouard
  - Michael Krause
  - Axel Roebel
  - Carl-Johann Simon-Gabriel
  - Alexandre Défossez
  venue: ''
  code_url: ''
  project_url: ''
  abstract: MuScriptor is an open-weight multi-instrument automatic music transcription
    model that works on real-world recordings across diverse genres. Analyzes the
    effectiveness of synthetic data pre-training combined with fine-tuning on real
    music audio and reinforcement-learning post-training, and introduces instrument-presence
    conditioning to customize transcriptions, addressing the poor generalization of
    prior methods on realistic multi-instrument mixes.
  tags:
  - transcription
  - multi-instrument
  - open model
- title: 'Music-Source-Separation-Training (MSST): A Unified Framework for Training
    and Evaluating Music Demixing Models'
  date: 2026-07
  url: https://arxiv.org/abs/2607.23395
  category: analysis
  subcategory: audio
  authors:
  - Roman Solovyev
  - Ilya Kiselev
  - Alexander Stempkovskiy
  - Tatiana Gabruseva
  venue: ''
  code_url: ''
  project_url: ''
  abstract: MSST is a universal open-source framework for music source separation
    that unifies training, validation and inference for a broad range of demixing
    model families under a single YAML-configurable interface. Supports multiple architectures,
    augmentations, losses and metrics plus practical techniques (sliding-window cross-fading
    inference, test-time augmentation, ensembling, LoRA fine-tuning), with ablations
    showing quality improvements across the pipeline.
  tags:
  - source separation
  - framework
  - demixing
- title: 'Music Flamingo: Scaling Music Understanding in Audio Language Models'
  date: 2025-11
  url: https://arxiv.org/abs/2511.10289
  category: analysis
  subcategory: multimodal
  authors:
  - Sreyan Ghosh
  - Arushi Goel
  - Lasha Koroshinadze
  - Sang-gil Lee
  - Zhifeng Kong
  - Joao Felipe Santos
  - Ramani Duraiswami
  - Dinesh Manocha
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Music Flamingo is a large audio-language model advancing music and song
    understanding, trained on MF-Skills, a large-scale dataset with rich captions
    and QA pairs covering harmony, structure, timbre, lyrics and cultural context.
    A post-training recipe combining music-theory chain-of-thought data with GRPO-based
    reinforcement learning yields state-of-the-art results across 10+ music understanding
    and reasoning benchmarks.
  tags:
  - audio-language model
  - understanding
  - GRPO
- title: Musical Training, but not Mere Exposure to Music, Drives the Emergence of
    Chroma Equivalence in Artificial Neural Networks
  date: 2026-02
  url: https://arxiv.org/abs/2602.18635
  category: cognition
  subcategory: multimodal
  authors:
  - Lukas Grasse
  - Matthew S. Tata
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Uses representational similarity analysis of auditory ANNs to test whether
    chroma equivalence — the cyclical octave similarity of pitch — is learned or innate.
    All models showed pitch height representation, but only models trained on a supervised
    music transcription task exhibited chroma equivalence; self-supervised exposure
    to music was insufficient, supporting chroma equivalence as a higher-order cognitive
    computation specific to music perception.
  tags:
  - cognition
  - pitch perception
  - chroma
  - ANN
- title: 'The MUSE Benchmark: Probing Music Perception and Auditory Relational Reasoning
    in Audio LLMs'
  date: 2025-10
  url: https://arxiv.org/abs/2510.19055
  category: cognition
  subcategory: agentic
  authors:
  - Brandon James Carone
  - Iran R. Roman
  - Pablo Ripollés
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The Music Understanding and Structural Evaluation (MUSE) benchmark probes
    fundamental music perception skills with 10 tasks across four state-of-the-art
    multimodal LLMs versus a large human baseline (N=200). Reveals wide variance in
    capabilities and a persistent gap with human experts — some models perform at
