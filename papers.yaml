    code_url: "https://github.com/facebookresearch/audiocraft"
    project_url: ""
    abstract: "Introduces MusicGen, a single language model operating over several streams of compressed discrete music representation (tokens). Unlike prior work, MusicGen uses a single-stage transformer LM with efficient token interleaving, supporting text- and melody-conditioned generation with state-of-the-art results and a small, open-sourced model."
