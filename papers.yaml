    venue: ""
    code_url: ""
    project_url: ""
    abstract: "SongBench is a framework for fine-grained song quality assessment across seven dimensions — Vocal, Instrument, Melody, Structure, Arrangement, Mixing, Musicality — with an expert-annotated database of 11,717 samples labeled by music professionals. Achieves high correlation with expert ratings and serves as a diagnostic benchmark revealing performance gaps in state-of-the-art text-to-song models."
