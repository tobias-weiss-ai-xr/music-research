- title: 'Composer Vector: Style-steering Symbolic Music Generation in a Latent Space'
  date: 2026-04
  url: https://arxiv.org/abs/2604.03333
  category: generation
  subcategory: symbolic
  abstract: 'Symbolic music generation has made significant progress, yet achieving
    fine-grained and flexible control over composer style remains challenging. Existing
    training-based methods for composer style conditioning depend on large labeled
    datasets. Besides, these methods typically support only single-composer generation
    at a time, limiting their applicability to more creative or blended scenarios.
    In this work, we propose Composer Vector, an inference-time steering method that
    operates directly in the model''s latent space to control composer style without
    retraining. Through experiments on multiple symbolic music generation models,
    we show that Composer Vector effectively guides generations toward target composer
    styles, enabling smooth and interpretable control through a continuous steering
    coefficient. It also enables seamless fusion of multiple styles within a unified
    latent space framework. Overall, our work demonstrates that simple latent space
    steering provides a practical and general mechanism for controllable symbolic
    music generation, enabling more flexible and interactive creative workflows. Code
    and Demo are available here: https://github.com/JiangXunyi/Composer-Vector and
    https://jiangxunyi.github.io/composervector.github.io/'
- title: 'Calliphony: A Calligraphy-Driven Interface for Real-Time Generative Music
    Performance'
  date: 2026-08
  url: https://arxiv.org/abs/2608.03040
  category: generation
  subcategory: symbolic
  abstract: 'While music generative models have recently gained significant attention,
    how they can be effectively integrated into live music performances still requires
    further exploration. This paper presents Calliphony, a calligraphy-driven interface
    for real-time generative music performance. Specifically, we build a low-latency
    pipeline that captures brush motion with an attachable sensor and maps it to control
    signals for real-time symbolic music generation. Using a generative model, the
    system produces multi-track MIDI in performance settings, while brush-derived
    control signals constrain event timing and activate additional musical layers.
    The generated melody is then extended with real-time harmony and additional voices,
    and finally rendered through a DAW for live staging. Calliphony contributes: (1)
    a performance-oriented prototype that uses calligraphic motion as an external
    control layer for a real-time symbolic music generation model, controlling note
    density, pitch constraints, and accompaniment-layer activation; and (2) a cross-modal
    performance scenario that extends calligraphy beyond a primarily visual practice
    into an audiovisual, AI-assisted setting.'
- title: 'Anchored Cyclic Generation: A Novel Paradigm for Long-Sequence Symbolic
    Music Generation'
  date: 2026-04
  url: https://arxiv.org/abs/2604.05343
  category: generation
  subcategory: symbolic
  abstract: Generating long sequences with structural coherence remains a fundamental
    challenge for autoregressive models across sequential generation tasks. In symbolic
    music generation, this challenge is particularly pronounced, as existing methods
    are constrained by the inherent severe error accumulation problem of autoregressive
    models, leading to poor performance in music quality and structural integrity.
    In this paper, we propose the Anchored Cyclic Generation (ACG) paradigm, which
    relies on anchor features from already identified music to guide subsequent generation
    during the autoregressive process, effectively mitigating error accumulation in
    autoregressive methods. Based on the ACG paradigm, we further propose the Hierarchical
    Anchored Cyclic Generation (Hi-ACG) framework, which employs a systematic global-to-local
    generation strategy and is highly compatible with our specifically designed piano
    token, an efficient musical representation. The experimental results demonstrate
    that compared to traditional autoregressive models, the ACG paradigm achieves
    reduces cosine distance by an average of 34.7% between predicted feature vectors
    and ground-truth semantic vectors. In long-sequence symbolic music generation
    tasks, the Hi-ACG framework significantly outperforms existing mainstream methods
    in both subjective and objective evaluations. Furthermore, the framework exhibits
    excellent task generalization capabilities, achieving superior performance in
    related tasks such as music completion.
- title: Efficient Long-Sequence Diffusion Modeling for Symbolic Music Generation
  date: 2026-02
  url: https://arxiv.org/abs/2603.00576
  category: generation
  subcategory: symbolic
  abstract: Symbolic music generation is a challenging task in multimedia generation,
    involving long sequences with hierarchical temporal structures, long-range dependencies,
    and fine-grained local details. Though recent diffusion-based models produce high
    quality generations, they tend to suffer from high training and inference costs
    with long symbolic sequences due to iterative denoising and sequence-length-related
    costs. To deal with such problem, we put forth a diffusing strategy named SMDIM
    to combine efficient global structure construction and light local refinement.
    SMDIM uses structured state space models to capture long range musical context
    at near linear cost, and selectively refines local musical details via a hybrid
    refinement scheme. Experiments performed on a wide range of symbolic music datasets
    which encompass various Western classical music, popular music and traditional
    folk music show that the SMDIM model outperforms the other state-of-the-art approaches
    on both the generation quality and the computational efficiency, and it has robust
    generalization to underexplored musical styles. These results show that SMDIM
    offers a principled solution for long-sequence symbolic music generation, including
    associated attributes that accompany the sequences. We provide a project webpage
    with audio examples and supplementary materials at https://3328702107.github.io/smdim-music/.
- title: 'RPPNet: Perceptually-Grouped Rhythm-Pitch Primitives for Long-Term Structure
    Melody Generation via Boundary-Aware Modeling'
  date: 2026-07
  url: https://arxiv.org/abs/2607.19776
  category: generation
  subcategory: symbolic
  abstract: Existing symbolic music generation models typically use bars as the basic
    structural unit. However, human perception of musical phrases often does not align
    with notated bar lines, leading to long-term structural fragmentation. This paper
    proposes RPPNet-a two-stage deep learning architecture with variable structural
    boundaries. It first generates variable-length Rhythm-Pitch Primitive (RPP) sequences,
    where each RPP encodes note count, rhythm, and contour; then decodes the RPP sequences
    into concrete notes. The grouping of RPPs is automatically derived from acoustic
    cues, auditory inertia, and similarity perception based on music psychology. Experiments
    show that melodies generated by RPPNet are superior in both long-term structure
    and musicality, with significant improvements across all subjective evaluation
    dimensions. Ablation studies confirm that the performance gain stems from the
    structural correctness of the psychological representation, rather than from model
    capacity. This work offers an interdisciplinary perspective for music generation,
    integrating music theory, computational modeling, and music psychology.
- title: 'Generative Modeling of Bach-Style Symbolic Music: A Comparative Study of
    Autoregressive, Latent-Variable, and Adversarial Approaches'
  date: 2026-06
  url: https://arxiv.org/abs/2606.13626
  category: generation
  subcategory: symbolic
  abstract: 'We study generative modeling of Bach-style symbolic piano music using
    a shared MIDI corpus and three model families: autoregressive LSTMs with attention,
    latent-variable models including recurrent VAEs and vector-quantized VAEs, and
    generative adversarial networks. We compare their ability to model polyphonic
    note sequences, learn useful latent representations, and generate stylistically
    coherent compositions. Our experiments show that the autoregressive LSTM with
    attention produces the most musically coherent samples, while vector quantization
    helps mitigate posterior collapse and yields more structured outputs than conventional
    recurrent VAEs. The adversarial approach captures local pitch patterns but remains
    difficult to train and generalizes less reliably to Bach''s style. These results
    highlight the relative strengths and failure modes of autoregressive, latent-variable,
    and adversarial approaches for symbolic music generation.'
- title: 'Academic Text-to-Music Grand Challenge: Datasets, Baselines, and Evaluation
    Methods'
  date: 2026-05
  url: https://arxiv.org/abs/2605.21538
  category: evaluation
  subcategory: multimodal
  abstract: 'This paper presents an overview and the technical framework of the ICME
    2026 Grand Challenge on Academic Text-to-Music Generation (ATTM). Despite the
    rapid progress in text-to-music generation (TTM) systems, the field is currently
    dominated by models trained on massive proprietary datasets with industrial-scale
    computational resources, creating a significant barrier for academic research.
    To address this, the ATTM Challenge establishes a fair-play benchmark that requires
    participants to train generative models strictly from scratch using a standardized,
    CC-licensed subset of the MTG-Jamendo dataset containing only instrumental music.
    The challenge is divided into two tracks: the Efficiency Track (limited to 500M
    parameters) and the Performance Track (no parameter limit). Submissions are evaluated
    through a multi-stage process involving objective metrics, including Frechet Audio
    Distance, CLAP score, and a novel Concept Coverage Score (CCS), followed by a
    subjective listening test. By providing open-source baselines, preprocessing pipelines,
    reference captions, and public evaluation code for computing FAD and CLAP, this
    challenge aims to facilitate and promote TTM research in academic contexts.'
- title: Learning Music Style for Piano Arrangement Through Cross-Modal Bootstrapping
  date: 2026-08
  url: https://arxiv.org/abs/2608.03050
  category: generation
  subcategory: symbolic
  abstract: 'What is music style? Though often described using text labels such as
    "swing," "classical," or "emotional," the real style remains implicit and hidden
    in concrete music examples. In this paper, we introduce a cross-modal framework
    that learns implicit music styles from raw audio and applies them to symbolic
    music generation. Inspired by BLIP-2, our model leverages a Querying Transformer
    (Q-Former) to extract style representations from a large, pre-trained audio language
    model (LM), and further applies them to condition a symbolic LM for generating
    piano arrangements. We adopt a two-stage training strategy: contrastive learning
    to align auditory style with symbolic expression, followed by generative modeling
    for music arrangement. Our model generates piano performances jointly conditioned
    on a lead sheet (content) and a reference audio example (style), enabling controllable
    and stylistically faithful arrangement. Experiments demonstrate the effectiveness
    of our approach in piano cover generation, style transfer, and audio-to-MIDI retrieval,
    achieving substantial improvements in style-aware alignment and music quality.'
- title: UT-AISTimprt submission for ICME 2026 Grand Challenge on Academic Text-to-Music
    Generation
  date: 2026-07
  url: https://arxiv.org/abs/2607.01669
  category: evaluation
  subcategory: multimodal
  abstract: 'This work investigates the effect of batch sampling strategies during
    training for text-to-audio music generation under low-data and small-scale model
    settings. This paper describes our approach and findings for the ICME 2026 Grand
    Challenge on Academic Text-to-Music Generation. Training data are clustered using
    either text embeddings or audio embeddings, and samples with similar characteristics
    are grouped within the same mini-batch to mitigate gradient interference. The
    effects of modality and cluster granularity on clustering are analyzed. Results
    show that clustering based on text embeddings achieves better performance on objective
    evaluation metrics than clustering based on audio embeddings. In addition, different
    cluster granularity leads to different behaviors across evaluation criteria: a
    moderate number of clusters performs best on objective metrics, while a larger
    number of clusters tends to exhibit music with more coherent structure in listening
    tests.'
- title: Instrumental Text-to-Music Generation with Auxiliary Conditioning Branches
  date: 2026-05
  url: https://arxiv.org/abs/2605.21433
  category: generation
  subcategory: audio
  abstract: Text-to-music generation has advanced rapidly, with modern autoregressive
    and diffusion-based models producing convincing music from natural-language prompts.
    However, much of this progress relies on large-scale training data and external
    pretraining, making it difficult to isolate which design choices remain effective
    when data and pretraining are controlled. We study this setting using a Diffusion
    Transformer backbone with lyric and timbre conditioning, adapted to an instrumental-only
    text-to-music task in which the auxiliary lyric and timbre branches receive only
    degenerate conditioning signals. Through controlled ablations, we find that models
    retrained without these branches score lower across AudioBox aesthetics, LLM-as-judge,
    and human MOS, and that reinvesting the saved parameters as additional DiT depth
    recovers only marginally. This suggests the auxiliary branches may act as training-time
    architectural anchors whose contribution goes beyond their explicit conditioning
    content. We validate the same model through comparisons with external instrumental
    baselines and through our submission to the ICME 2026 Academic Text-to-Music (ATTM)
    Grand Challenge, where our Performance submission ranked first under both the
    objective metrics and the subsequent organizer-administered MOS over 35 raters,
    attaining the highest overall MOS across all challenge submissions, while our
    Efficiency submission was a finalist that tied for second under the objective
    metrics.
- title: 'V2M-Zero: Zero-Pair Time-Aligned Video-to-Music Generation'
  date: 2026-03
  url: https://arxiv.org/abs/2603.11042
  category: generation
  subcategory: multimodal
  abstract: 'Generating music that temporally aligns with video events is challenging
    for existing text-to-music models, which lack fine-grained temporal control. We
    introduce V2M-ZERO, a video-to-music generation approach that generates time-aligned
    music with disentangled time synchronization and semantic control (e.g., genre,
    mood) from video while requiring zero video-music pairs at training time. Our
    method is motivated by a key observation: temporal synchronization requires matching
    when and how much change occurs, not what changes. While musical and visual events
    differ semantically, they exhibit shared temporal structure that can be captured
    independently within each modality. We capture this structure through event curves
    computed from intra-modal similarity using pretrained music and video encoders.
    By measuring temporal change within each modality independently, these curves
    provide comparable representations across modalities. This enables a simple training
    strategy: fine-tune a text-to-music model on music-event curves, then substitute
    video-event curves at inference without cross-modal training or paired data. Across
    OES-Pub, MovieGenBench-Music, and AIST++, V2M-ZERO achieves state-of-the-art performance
    without any paired music-video data, surpassing the strongest prior baselines
    per metric with 5-9% higher audio quality, 13-15% better semantic alignment, 21-52%
    improved temporal synchronization, and 28% higher beat alignment on dance videos.
    We find similar results via a large crowd-source subjective listening test. Our
    results validate that temporal alignment through within-modality features is not
    only effective for video-to-music generation but also leads to better performance
    than paired cross-modal supervision. Furthermore, our approach enables independent
    controls for timing and music style (e.g., genre, mood) for more controllable
    generation.'
- title: 'Text2Score: Generating Sheet Music From Textual Prompts'
  date: 2026-05
  url: https://arxiv.org/abs/2605.13431
  category: generation
  subcategory: symbolic
  abstract: Developing text-driven symbolic music generation models remains challenging
    due to the scarcity of aligned text-music datasets and the unreliability of automated
    captioning pipelines. While most efforts have focused on MIDI, sheet music representations
    are largely underexplored in text-driven generation. We present Text2Score, a
    two-stage framework comprising a planning stage and an execution stage for generating
    sheet music from natural language prompts. By deriving supervision signals directly
    from symbolic XML data, we propose an alternative to caption-based training that
    bypasses noisy or scarce text-music pairs. In the planning stage, an LLM orchestrator
    translates a natural language prompt into a structured bar-wise plan defining
    musical attributes such as instruments, key, time signatures, harmony, etc. This
    plan guides a generative model in the execution stage to produce interleaved ABC
    notation conditioned on its structural constraints. To assess output quality,
    we introduce an evaluation framework covering playability, readability, instrument
    utilization, structural complexity, and prompt adherence, corroborated by expert
    musicians. Text2Score consistently outperforms both a pure LLM-based agentic framework
    and three end-to-end baselines across objective and subjective dimensions. We
    open-source the dataset, code, evaluation set and LLM prompts used in this work;
    a demo is available on our project page (https://keshavbhandari.github.io/portfolio/text2score).
- title: 'Fusing Memory and Attention: A study on LSTM, Transformer and Hybrid Architectures
    for Symbolic Music Generation'
  date: 2026-03
  url: https://arxiv.org/abs/2603.21282
  category: evaluation
  subcategory: symbolic
  abstract: Machine learning techniques, such as Transformers and Long Short-Term
    Memory (LSTM) networks, play a crucial role in Symbolic Music Generation (SMG).
    Existing literature indicates a difference between LSTMs and Transformers regarding
    their ability to model local melodic continuity versus maintaining global structural
    coherence. However, their specific properties within the context of SMG have not
    been systematically studied. This paper addresses this gap by providing a fine-grained
    comparative analysis of LSTMs versus Transformers for SMG, examining local and
    global properties in detail using 17 musical quality metrics on the Deutschl dataset.
    We find that LSTM networks excel at capturing local patterns but fail to preserve
    long-range dependencies, while Transformers model global structure effectively
    but tend to produce irregular phrasing. Based on this analysis and leveraging
    their respective strengths, we propose a Hybrid architecture combining a Transformer
    Encoder with an LSTM Decoder and evaluate it against both baselines. We evaluated
    1,000 generated melodies from each of the three architectures on the Deutschl
    dataset. The results show that the hybrid method achieves better local and global
    continuity and coherence compared to the baselines. Our work highlights the key
    characteristics of these models and demonstrates how their properties can be leveraged
    to design superior models. We also supported the experiments with ablation studies
    and human perceptual evaluations, which statistically support the findings and
    provide robust validation for this work.
- title: 'Polyphonia: Zero-Shot Timbre Transfer in Polyphonic Music with Acoustic-Informed
    Attention Calibration'
  date: 2026-05
  url: https://arxiv.org/abs/2605.10203
  category: generation
  subcategory: audio
  abstract: The advancement of diffusion-based text-to-music generation has opened
    new avenues for zero-shot music editing. However, existing methods fail to achieve
    stem-specific timbre transfer, which requires altering specific stems while strictly
    preserving the background accompaniment. This limitation severely hinders practical
    application, since real-world production necessitates precise manipulation of
    components within dense mixtures. Our key finding is that, while vanilla cross-attention
    captures semantic features of stems, it lacks the spectral resolution to strictly
    localize targets in dense mixtures, leading to boundary leakage. To resolve this
    dilemma, we propose Polyphonia, a zero-shot editing framework with Acoustic-Informed
    Attention Calibration. Rather than relying solely on diffuse semantic attention,
    Polyphonia leverages a probabilistic acoustic prior to establish coarse boundaries,
    enabling non-target stems preserved precise semantic synthesis. For evaluation,
    we propose PolyEvalPrompts, a standardized prompt set with 1,170 timbre transfer
    tasks in polyphonic music. Specifically, Polyphonia achieves an increase of 15.5%
    in target alignment compared to baselines, while maintaining competitive music
    fidelity and non-target integrity.
- title: 'AudioX-Turbo: A Unified Framework for Efficient Anything-to-Audio Generation'
  date: 2026-06
  url: https://arxiv.org/abs/2606.12555
  category: evaluation
  subcategory: multimodal
  abstract: 'Audio and music generation based on flexible multimodal control signals
    is a widely applicable topic, with the following key challenges: 1) a unified
    multimodal modeling framework, 2) large-scale, high-quality training data, and
    3) the prohibitive inference cost of multi-step diffusion sampling. As such, we
    propose AudioX-Turbo, a unified and efficient framework for anything-to-audio
    generation that integrates varied multimodal conditions (i.e., text, video, and
    audio signals) in this work. AudioX-Turbo follows a teacher-student paradigm.
    The teacher AudioX-Base is built on a Multimodal Diffusion Transformer with a
    Multimodal Adaptive Fusion module that aligns diverse multimodal inputs for high-fidelity
    synthesis, and is then distilled into the few-step student AudioX-Turbo via Distribution
    Matching Distillation adapted to flow matching, complemented by a diffusion-based
    discriminator for high-quality few-step generation. To support the training of
    AudioX-Turbo, we construct a large-scale, high-quality dataset, IF-caps-Pro, comprising
    approximately 9.2M samples curated through a two-stage data collection and annotation
    pipeline. We benchmark AudioX-Turbo across a wide range of tasks, finding that
    our model achieves superior performance, especially on text-to-audio and text-to-music
    generation, while operating at only 4 sampling steps and requiring approximately
    25x fewer function evaluations (NFE) than multi-step baselines. These results
    demonstrate that our method is capable of audio generation under flexible multimodal
    control, showing efficient and powerful instruction-following capabilities. The
    code and datasets will be available at https://zeyuet.github.io/AudioX-Turbo/.'
- title: 'Mental Damage: Caption Poisoning Attacks on Retrieval-Augmented Text-to-Music
    Generation'
  date: 2026-05
  url: https://arxiv.org/abs/2605.30365
  category: generation
  subcategory: multimodal
  abstract: 'Retrieval-augmented text-to-music (TTM) systems augment underspecified
    user prompts using captions retrieved from a music caption dataset. This design
    introduces an integrity dependency on the music knowledge database. We show that
    an attacker can poison the database by injecting a small number of crafted music
    captions, causing the system to retrieve malicious captions that bias prompt augmentation
    and steer generation away from the user''s intended function, without modifying
    the user prompt, retriever, or generator. To achieve the music caption poisoning
    attack, we propose a dual-layer caption poisoning strategy that preserves high-level
    retrieval anchors while injecting low-level acoustic descriptors to steer prompt
    augmentation and downstream music generation toward an attacker-chosen target
    intent. In a MusicCaps knowledge database, CLAP retriever, and MusicGen pipeline,
    poisoned generations move substantially closer to the attacker''s target, while
    remaining comparably aligned with the original user query. These results expose
    a practical integrity risk for retrieval-augmented creative AI systems. Our demo
    can be found at: https://yizhu-wen.github.io/Mental-Damage/'
- title: Qwen-Music Technical Report
  date: 2026-07
  url: https://arxiv.org/abs/2607.11699
  category: generation
  subcategory: audio
  abstract: 'In this report, we introduce Qwen-Music, a powerful music generation
    model capable of producing highly musical and high-fidelity songs with complete
    vocal singing. Qwen-Music supports two core tasks: Text to Music Generation, which
    create entirely new songs from text descriptions, lyrics, and musical attributes,
    and Cover Song Generation, which reinterprets existing songs with different styles
    and vocal characteristics. Architecturally, Qwen-Music integrates three core components:
    Qwen-Music-Tokenizer, Qwen-Music-LLM, and Qwen-Music-Render. Qwen-Music-Tokenizer
    compresses audio into a 25 Hz single-codebook stream of Music Semantic Tokens
    that preserve semantic and melodic information for LLM prediction. Based on these
    tokens, Qwen-Music-LLM performs autoregressive music semantic modeling, with a
    key novelty being a melody-token-based chain-of-thought (Melody-CoT) mechanism
    that plans melodies before full-song generation, improving creativity, musicality,
    structural coherence, and reference-audio-based melody cloning. To overcome the
    fidelity limitations of discrete semantic tokens, Qwen-Music-Render performs generative
    stereo rendering, enriching acoustic details and producing high-fidelity stereo
    waveforms. Finally, we train Qwen-Music-LLM on more than 5 million hours of multilingual
    music data covering hundreds of languages. We first apply quality-aware pre-training
    curriculum, then use progressive post-training, comprising supervised initialization,
    offline DPO, and online GSPO, to further improve musicality and instruction-following
    ability. Across 600 Chinese and English prompts, Qwen-Music achieves state-of-the-art
    results in 13 of 16 objective musicality and audio-quality metrics. Professional
    evaluators also prefer Qwen-Music over leading proprietary systems. For cover
    song generation, Qwen-Music preserves reference melodies more accurately than
    leading proprietary systems.'
- title: 'FlowSonic: Stable Zero-Shot Music Editing via High-Order Trajectory Integration'
  date: 2026-07
  url: https://arxiv.org/abs/2607.17526
  category: generation
  subcategory: audio
  abstract: Zero-shot text-guided editing of real-world music recordings requires
    balancing semantic modification with faithful preservation of the original musical
    structure. Although recent diffusion transformers trained with rectified flow
    have achieved remarkable success in text-to-music generation, extending them to
    edit existing recordings remains challenging because editing requires accurate
    deterministic inversion, reliable structural preservation, and numerically stable
    integration throughout the inversion and generation processes. We present FlowSonic,
    a zero-shot music editing framework built upon a pretrained diffusion transformer
    trained with rectified flow. FlowSonic first deterministically inverts a real-world
    recording into the latent space and preserves its musical structure during editing
    by reusing cross-attention representations extracted during inversion. To improve
    the numerical reliability of inversion-based editing, we introduce a high-order
    ODE solver and systematically investigate how different numerical integration
    schemes influence trajectory stability, structural preservation, and semantic
    controllability. Comprehensive experiments on timbre-transfer and genre-modification
    tasks demonstrate that FlowSonic consistently outperforms existing music editing
    methods across semantic alignment, harmonic preservation, structural consistency,
    and perceptual audio quality. We further provide geometric and empirical analyses
    showing how the proposed numerical integration strategy improves latent trajectory
    stability and leads to more reliable music editing.
- title: 'SongSong: A Time Phonograph for Chinese SongCi Music from Thousand of Years
    Away'
  date: 2026-02
  url: https://arxiv.org/abs/2602.24071
  category: generation
  subcategory: symbolic
  abstract: Recently, there have been significant advancements in music generation.
    However, existing models primarily focus on creating modern pop songs, making
    it challenging to produce ancient music with distinct rhythms and styles, such
    as ancient Chinese SongCi. In this paper, we introduce SongSong, the first music
    generation model capable of restoring Chinese SongCi to our knowledge. Our model
    first predicts the melody from the input SongCi, then separately generates the
    singing voice and accompaniment based on that melody, and finally combines all
    elements to create the final piece of music. Additionally, to address the lack
    of ancient music datasets, we create OpenSongSong, a comprehensive dataset of
    ancient Chinese SongCi music, featuring 29.9 hours of compositions by various
    renowned SongCi music masters. To assess SongSong's proficiency in performing
    SongCi, we randomly select 85 SongCi sentences that were not part of the training
    set for evaluation against SongSong and music generation platforms such as Suno
    and SkyMusic. The subjective and objective outcomes indicate that our proposed
    model achieves leading performance in generating high-quality SongCi music.
- title: 'SqueezeComposer: Temporal Speed-up is A Simple Trick for Long-form Music
    Composing'
  date: 2026-03
  url: https://arxiv.org/abs/2603.21073
  category: generation
  subcategory: audio
  abstract: 'Composing coherent long-form music remains a significant challenge due
    to the complexity of modeling long-range dependencies and the prohibitive memory
    and computational requirements associated with lengthy audio representations.
    In this work, we propose a simple yet powerful trick: we assume that AI models
    can understand and generate time-accelerated (speeded-up) audio at rates such
    as 2x, 4x, or even 8x. By first generating a high-speed version of the music,
    we greatly reduce the temporal length and resource requirements, making it feasible
    to handle long-form music that would otherwise exceed memory or computational
    limits. The generated audio is then restored to its original speed, recovering
    the full temporal structure. This temporal speed-up and slow-down strategy naturally
    follows the principle of hierarchical generation from abstract to detailed content,
    and can be conveniently applied to existing music generation models to enable
    long-form music generation. We instantiate this idea in SqueezeComposer, a framework
    that employs diffusion models for generation in the accelerated domain and refinement
    in the restored domain. We validate the effectiveness of this approach on two
    tasks: long-form music generation, which evaluates temporal-wise control (including
    continuation, completion, and generation from scratch), and whole-song singing
    accompaniment generation, which evaluates track-wise control. Experimental results
    demonstrate that our simple temporal speed-up trick enables efficient, scalable,
    and high-quality long-form music generation. Audio samples are available at https://SqueezeComposer.github.io/.'
- title: 'AudioCALM: Continuous Autoregressive Language Modeling for Universal Audio
    Generation'
  date: 2026-06
  url: https://arxiv.org/abs/2606.23080
  category: evaluation
  subcategory: audio
  abstract: 'Unifying speech, sound, and music generation in one model is hindered
    by tradeoffs between fidelity, end-to-end training, in-context conditioning, and
    variable-length synthesis that no current paradigm fully resolves. To address
    this challenge, we present AudioCALM, a universal audio generation framework that
    extends autoregressive (AR) next-token prediction from discrete tokens to continuous
    audio latents: a thin flow-matching head replaces the softmax to predict rectified-flow
    velocities at each position, and a block-causal AR-Flow attention pattern produces
    arbitrary-length output. Joint training of multiple audio generation tasks faces
    an asymmetric text--audio mismatch: speech transcripts align to specific time
    spans and demand tight, time-aligned attention, whereas sound and music captions
    describe only overall semantics and rely on diffuse, holistic attention; mixing
    the two disproportionately degrades sound and music generation. We address this
    asymmetry at two levels: a data reformulation strategy that unifies all three
    tasks under a single description-style conditioning interface, and a novel architecture
    Asymmetric Mixture-of-Modality-Experts (A-MoME), which adds a dedicated residual
    expert for speech while sound and music share the backbone, incurring no inference
    overhead on non-speech inputs. Experimental results demonstrate that AudioCALM
    matches modality-specific state-of-the-art and outperforms prior unified baselines
    on speech, sound, and music generation benchmarks.'
- title: Cross-cultural evaluation of taste-sound correspondences in AI-generated
    music
  date: 2026-08
  url: https://arxiv.org/abs/2608.03433
  category: cognition
  subcategory: multimodal
  abstract: 'Sonic seasoning research has shown that listeners attribute systematic
    gustatory and emotional meaning to sound, and text-to-music generative artificial
    intelligence has recently been used to render gustatory prompts as musical stimuli.
    Whether the taste-sound correspondences acquired by such models hold beyond the
    cultural context in which they were validated remains untested. We extended a
    single-country study to a three-country online experiment conducted in Argentina,
    Italy, and Japan (N = 361). Participants first indicated their preference between
    base and fine-tuned MusicGen excerpts generated from four taste prompts (sweet,
    sour, bitter, salty), and then rated fine-tuned excerpts on twelve taste, emotion,
    and thermal descriptors. Preference for the fine-tuned model was confirmed in
    Argentina and Italy but not in Japan, and the salty prompt yielded the weakest
    correspondence in all three cohorts. Ratings differed substantially between countries,
    yet the main effect of country was no longer detectable once ratings had been
    standardized within participant, whereas the interactions characterizing the mapping
    of prompts onto descriptors remained essentially unchanged. Much of the apparent
    cross-cultural divergence is therefore attributable to differences in scale use;
    a structural component nevertheless persists. In addition an exploratory factor
    analysis indicated that the twelve descriptors were organized along different
    latent dimensions in each cohort. These results indicate that cross-cultural variation
    in AI-mediated sonic seasoning operates at two levels: the overall level at which
    taste is attributed to a given stimulus, and the relational structure of those
    attributions. Evaluations of generative music systems across populations should
    accordingly distinguish response-style bias from genuine perceptual reorganization.'
- title: 'Persian MusicGen: A Large-Scale Dataset and Culturally-Aware Generative
    Model for Persian Music'
  date: 2026-05
  url: https://arxiv.org/abs/2605.14765
  category: generation
  subcategory: multimodal
  abstract: Persian music, with its unique tonalities, modal systems (Dastgah), and
    rhythmic structures, presents significant challenges for music generation models
    trained primarily on Western music. We address this gap by curating the first
    large-scale dataset of Persian songs, comprising over 900 hours high-quality audio
    samples across diverse sub-genres, including pop, traditional, and contemporary
    styles. This dataset captures the rich melodic and cultural diversity of Persian
    music and serves as the foundation for fine-tuning MusicGen, a state-of-the-art
    generative music model. We adapt MusicGen to this domain and evaluate its performance
    by utilizing subjective and objective metrics. To assess the semantic alignment
    between generated music and intended style tags, we report the proportion of relevant
    tags accurately reflected in the generated outputs. Our results demonstrate that
    the fine-tuned model produces compositions that more align with Persian stylistic
    conventions. This work introduces a new resource for generative music research
    and illustrates the adaptability of music generation models to underrepresented
    cultural and linguistic contexts.
- title: 'Video-Robin: Autoregressive Diffusion Planning for Intent-Grounded Video-to-Music
    Generation'
  date: 2026-04
  url: https://arxiv.org/abs/2604.17656
  category: analysis
  subcategory: multimodal
  abstract: Video-to-music (V2M) is the fundamental task of creating background music
    for an input video. Recent V2M models achieve audiovisual alignment by typically
    relying on visual conditioning alone and provide limited semantic and stylistic
    controllability to the end user. In this paper, we present Video-Robin, a novel
    text-conditioned video-to-music generation model that enables fast, high-quality,
    semantically aligned music generation for video content. To balance musical fidelity
    and semantic understanding, Video-Robin integrates autoregressive planning with
    diffusion-based synthesis. Specifically, an autoregressive module models global
    structure by semantically aligning visual and textual inputs to produce high-level
    music latents. These latents are subsequently refined into coherent, high-fidelity
    music using local Diffusion Transformers. By factoring semantically driven planning
    into diffusion-based synthesis, Video-Robin enables fine-grained creator control
    without sacrificing audio realism. Our proposed model outperforms baselines that
    solely accept video input and additional feature conditioned baselines on both
    in-distribution and out-of-distribution benchmarks with a 2.21x speed in inference
    compared to SOTA. We will open-source everything upon paper acceptance.
- title: 'SyncTrack: Rhythmic Stability and Synchronization in Multi-Track Music Generation'
  date: 2026-03
  url: https://arxiv.org/abs/2603.01101
  category: generation
  subcategory: symbolic
  abstract: 'Multi-track music generation has garnered significant research interest
    due to its precise mixing and remixing capabilities. However, existing models
    often overlook essential attributes such as rhythmic stability and synchronization,
    leading to a focus on differences between tracks rather than their inherent properties.
    In this paper, we introduce SyncTrack, a synchronous multi-track waveform music
    generation model designed to capture the unique characteristics of multi-track
    music. SyncTrack features a novel architecture that includes track-shared modules
    to establish a common rhythm across all tracks and track-specific modules to accommodate
    diverse timbres and pitch ranges. Each track-shared module employs two cross-track
    attention mechanisms to synchronize rhythmic information, while each track-specific
    module utilizes learnable instrument priors to better represent timbre and other
    unique features. Additionally, we enhance the evaluation of multi-track music
    quality by introducing rhythmic consistency through three novel metrics: Inner-track
    Rhythmic Stability (IRS), Cross-track Beat Synchronization (CBS), and Cross-track
    Beat Dispersion (CBD). Experiments demonstrate that SyncTrack significantly improves
    the multi-track music quality by enhancing rhythmic consistency.'
- title: Dialogue-Aware Video-to-Music Generation Using Public Domain Film Collections
  date: 2026-08
  url: https://arxiv.org/abs/2608.11576
  category: generation
  subcategory: audio
  abstract: 'Video-to-music generation has drawn growing interest for its role in
    conveying the emotion of visual media, including film. Progress in the field,
    however, is hampered by a reproducibility gap: models are often trained on crawled
    corpora referenced through YouTube URLs that may be deleted, with the underlying
    data often difficult and time-consuming to retrieve. To address this, we introduce
    the Open Screen Soundtrack Library version 2 (OSSL-v2), a self-hosted corpus of
    34,343 video clips totaling 246.4 hours, sourced from public-domain films. Unlike
    crawled corpora, OSSL-v2 is reproducible (i.e., not subject to link rot) and copyright-conscious,
    yet still large enough to train functional video-to-music models. We then use
    this film-domain corpus to study dialogue as a conditioning signal for video-to-music
    generation, motivated by the close temporal coupling between film music and on-screen
    speech. Specifically, we augment existing models'' video cross-attention with
    a time axis and modulate it frame-by-frame with the dialogue track. Evaluated
    on both public-domain and commercial films, our approach shows improvement over
    the state-of-the-art baselines. The dataset is available at https://huggingface.co/datasets/McAuley-Lab/OSSL-v2.'
- title: Exploring LLMs for South Asian Music Understanding and Generation
  date: 2026-06
  url: https://arxiv.org/abs/2606.05522
  category: evaluation
  subcategory: agentic
  abstract: Recent advancements in Large Language Models (LLMs) have shown promising
    results in music understanding and generation tasks. However, existing works remain
    confined to Western tonal traditions, offering little insight into whether current
    LLMs can handle structurally distinct low-resource musical traditions. We present
    the first systematic evaluation of LLM competence in South Asian classical music,
    a tradition governed by raga, tala-based melodic constraints that impose fundamentally
    different structural principles from Western harmony-driven music. We ground our
    evaluation in Hindustani classical theory and Bengali classical forms, including
    Rabindra and Nazrul Sangeet -- representative low-resource traditions within South
    Asian classical music. For music understanding evaluation, we introduce a 504-question-answer
    benchmark spanning raga grammar, cultural knowledge, and symbolic notation reasoning,
    evaluating 33 LLMs where frontier models such as Gemini 2.5 Pro achieve 85-90%
    accuracy, while most open-source models remain in the 23-40% range. For music
    generation, we design a five-level controlled prompting framework and find that
    even the strongest model produces stylistically faithful outputs only 40% of the
    time. These results reveal that structural validity and stylistic faithfulness
    in music generation are distinct objectives and highlight an open challenge for
    culturally grounded music modeling.
- title: Dance to Music Generation leveraging Pre-training with Unpaired data and
    Contrastive Alignment
  date: 2026-07
  url: https://arxiv.org/abs/2607.10537
  category: generation
  subcategory: audio
  abstract: Dance-to-music generation is a promising task for applications such as
    choreography support and automatic accompaniment, where temporal coordination
    between body movement and sound is essential. In particular, using human joint
    positions as the motion representation is attractive because they explicitly capture
    body dynamics while being lightweight, privacy-preserving, and easy to integrate
    with motion capture and pose-estimation pipelines. A central challenge in this
    setting, however, is the scarcity of high-quality paired dance-music data, since
    collecting accurately synchronized pairs is costly and often constrained by copyright
    and performance rights. This makes it difficult to train end-to-end models solely
    from paired data. To address this issue, we propose a dance-conditioned music
    generation framework that efficiently exploits both unpaired and paired data.
    Our method combines pretrained unimodal encoders for motion and music, beat-guided
    contrastive pretraining to align their feature spaces, and a ControlNet-style
    conditioning module on top of a pretrained text-to-audio diffusion model. Experiments
    on AIST++ demonstrate that the proposed techniques improve both dance-music alignment
    and audio quality, as confirmed by quantitative and qualitative evaluations. Compared
    to a state-of-the-art method, our approach achieves superior dance alignment performance
    and competitive audio quality. Code is available at https://github.com/kmraven/AudioLDM-ControlNet
    .
- title: 'ARIA: A Diagnostic Framework for Music Training Data Attribution'
  date: 2026-05
  url: https://arxiv.org/abs/2605.16181
  category: generation
  subcategory: symbolic
  abstract: Training data attribution (TDA) for music generation must answer two questions
    that copyright analysis requires, namely which training songs influence a generated
    output and along which musical aspects the influence operates. Existing methods
    reduce influence to a single scalar, without revealing which musical aspects are
    dominant in that influence. We propose ARIA, a framework that decomposes attribution
    along musical aspects (five for symbolic music, three for audio) and pairs the
    decomposition with reliability diagnostics computed from the segment-level score
    matrix. It measures within-group similarity among the top-K attributed tracks
    against random reference groups drawn from the training pool, and diagnoses the
    score matrix through its singular value decomposition and column statistics. On
    a symbolic-music model where attribution ground truth is available through counterfactual
    retraining, the reliability diagnostics rank four attribution methods identically
    to that ground truth. On an audio music generation model, ARIA reveals attribution
    behaviors that vary substantially across TDA methods, flags score matrices whose
    retrieved tracks are nearly identical across queries rather than reflecting per-query
    attribution, and characterizes embedding-similarity retrieval baselines by the
    musical aspect each encoder surfaces. Together, ARIA produces per-aspect attribution
    evidence aligned with the musical aspects considered under the idea-expression
    distinction in copyright analysis.
- title: 'Musical Attention Transformer: Music Generation Using a Music-Specific Attention
    Model'
  date: 2026-05
  url: https://arxiv.org/abs/2605.21081
  category: generation
  subcategory: symbolic
  abstract: This study aims to enhance the quality of music generation using Transformers
    by incorporating meta-information. While Transformer-based approaches are effective
    at capturing long-term dependencies in musical compositions, the music they generate
    often suffers from issues such as excessive repetition or duplication of notes,
    leading to unnatural melodies. To address these limitations, we propose Musical
    Attention, a mechanism that incorporates meta-information such as bar numbers,
    key, signatures, and tempos into the attention process. Musical Attention explicitly
    leverages both the structural properties of music and its associated metadata,
    enabling the Transformer's attention mechanism to operate more effectively and
    thereby improving the quality of the generated output. In our framework, each
    musical note is represented as a combination of five events-pitch, bar number,
    onset, duration, and velocity in addition to the three metadata elements. The
    attention mechanism is then modified to reflect the correlations among these eight
    features, allowing the model to better capture the inherent characteristics of
    musical composition. Experimental results demonstrate that the model incorporating
    Musical Attention outperforms prior methods, such as Full Attention and Strided
    Attention, in terms of musical coherence, variation, and overall quality. Notably,
    it significantly reduces repetition and enhances the model's ability to generate
    diverse, harmonically consistent melodies. Musical Attention thus represents a
    meaningful advancement in AI-driven music generation, facilitating the creation
    of more natural and expressive compositions.
- title: 'MusiChat: Vibe Composing for Music Creation'
  date: 2026-07
  url: https://arxiv.org/abs/2607.24873
  category: generation
  subcategory: symbolic
  abstract: Recent advances in AI music generation have enabled users to create complete
    musical pieces from natural-language prompts. However, most existing systems follow
    a prompt-and-regenerate paradigm, making iterative refinement difficult because
    users must repeatedly recreate compositions instead of directly evolving existing
    musical ideas. We present MusiChat, a conversational vibe composing system that
    enables collaborative human-AI music creation through natural-language interaction
    and iterative refinement. At the core of MusiChat is a hierarchical controllable
    music generation framework that separates lyric-aligned musical structure generation
    from expressive surface realization, allowing flexible stylistic transformations
    and structure-preserving edits. The system integrates a large language model with
    a hybrid symbolic music engine through a memory-augmented architecture that maintains
    the active composition state and user history across interactions. A hybrid intent-routing
    mechanism further enables efficient interpretation of both precise musical edits
    and open-ended creative requests. Rather than regenerating compositions from scratch,
    MusiChat incrementally transforms an evolving musical artifact while preserving
    relevant musical structure and user intent. We evaluate MusiChat through objective
    analysis and human studies, achieving 95.31% and 100% accuracy for single- and
    multi-turn interactions, respectively, and obtaining like-to-dislike ratios of
    2:1 for melody naturalness and 3:1 for musical quality. Our results demonstrate
    that MusiChat supports coherent multi-turn music authoring and interactive human-AI
    co-creation through a conversational interface.
- title: Taming Audio VAEs via Target-KL Regularization
  date: 2026-05
  url: https://arxiv.org/abs/2605.17085
  category: generation
  subcategory: audio
  abstract: Latent diffusion models have emerged as the dominant paradigm for many
    generation tasks including audio generation such as text-to-audio, text-to-music
    and text-to-speech. A key component of latent diffusion is an autoencoder (VAE)
    that compresses high-dimensional signals into a low frame rate continuous representation
    that is conducive for downstream prediction. Regularizing these VAEs is challenging,
    as there is a trade-off between over-regularized (poor output quality) and under-regularized
    (difficult to predict) latent representations. We propose a framework for studying
    this trade-off through compression and train Audio VAEs at specific bitrates via
    target-KL regularization. This allows direct comparison to well-studied discrete
    neural audio codec models, and the construction of rate-distortion curves for
    audio VAEs. We evaluate the impact of target-KL regularization on text-to-sound
    generation and find that sweeping compression rates is helpful in identifying
    the optimal generation setting.
- title: 'TuneJury: An Open Metric for Improving Music Generation Preference Alignment'
  date: 2026-06
  url: https://arxiv.org/abs/2606.17006
  category: evaluation
  subcategory: multimodal
  abstract: 'We introduce TuneJury, an open, instance-level pairwise reward model
    for text-to-music that predicts a music preference score from a text prompt and
    an audio clip. The released checkpoint is trained on publicly available human-preference
    labels covering arena-style (A vs. B) votes, metric-alignment preference pairs,
    crowdsourced pairwise comparisons, and expert aesthetic ratings. The predicted
    score margin between two clips is well calibrated on our held-out test split,
    supporting data filtering via a simple score threshold. TuneJury generalizes to
    both held-out test pairs and out-of-distribution benchmarks, remaining competitive
    with prior baselines on the latter. For generators released after training, we
    introduce anchor calibration, a post-hoc, per-system Bradley-Terry calibration
    that recovers agreement at substantially better data efficiency than from-scratch
    retraining. The same frozen reward drives consistent reward-axis gains across
    three downstream applications: inference-time best-of-N selection, DITTO-style
    latent optimization, and expert-iteration post-training. TuneJury is available
    at https://github.com/yonghyunk1m/TuneJury.'
- title: 'Drive-to-Music: Context-Aware Generative Audio for In-Vehicle Experiences'
  date: 2026-08
  url: https://arxiv.org/abs/2608.12615
  category: generation
  subcategory: multimodal
  abstract: In-vehicle music can serve as an adaptive interface to enhance driver
    experience, attention, and well-being. We present Drive-to-Music, a context-aware
    system that generates music in real time from multimodal driving signals. Using
    dashcam imagery and vehicle telemetry, the system extracts scene semantics and
    driving context, maps them to high-level musical descriptors, and conditions generative
    audio models to produce contextually aligned soundtracks. The architecture combines
    perception and generative components to translate visual and kinematic inputs
    into structured musical attributes and synthesize audio with low latency. It supports
    smooth transitions as driving conditions evolve, and to ensure robustness and
    deployment readiness, we incorporate constraint-based controls and safety checks
    across the generation pipeline. Our results demonstrate the feasibility of real-time,
    context-aware music generation in automotive settings, providing a foundation
    for personalized and adaptive in-vehicle audio experiences.
- title: 'DeRA-MOS: Optimizing Text-to-Music Evaluation via Decoupled Listwise Ranking
    and Modality Alignment'
  date: 2026-06
  url: https://arxiv.org/abs/2606.10010
  category: generation
  subcategory: multimodal
  abstract: Evaluating text-to-music (TTM) systems remains expensive because music
    impression (MI) and text alignment (TA) scores rely on human mean opinion scores
    (MOS). Most automatic MOS estimators are trained with point-wise regression or
    distributional classification. These objectives do not directly optimize rank-based
    metrics and provide weak geometric constraints for cross-modal coherence. To address
    these gaps, we propose DeRA-MOS, a decoupled optimization framework for TTM evaluation.
    For MI, we introduce a batch-aware listwise ranking loss that models relative
    order within each mini-batch and better aligns with evaluation based on Spearman's
    rank correlation coefficient (SRCC). For TA, we introduce a score-anchored modality
    alignment loss that maps human scores to target audio-text similarity and regularizes
    the latent space before fusion. By effectively mitigating the point-wise training
    mismatch and modality drift, experiments on MusicEval demonstrate that our decoupled
    framework yields substantial improvements in both MI and TA ranking metrics, establishing
    a robust paradigm for large-scale TTM evaluation.
- title: 'DashengTokenizer: One layer is enough for unified audio understanding and
    generation'
  date: 2026-02
  url: https://arxiv.org/abs/2602.23765
  category: generation
  subcategory: audio
  abstract: 'This paper introduces DashengTokenizer, a continuous audio tokenizer
    engineered for joint use in both understanding and generation tasks. Unlike conventional
    approaches, which train acoustic tokenizers and subsequently integrate frozen
    semantic knowledge, our method inverts this paradigm: we leverage frozen semantic
    features and inject acoustic information. In linear evaluation across 22 diverse
    tasks, our method outperforms previous audio codec and audio encoder baselines
    by a significant margin while maintaining competitive audio reconstruction quality.
    Notably, we demonstrate that this acoustic injection improves performance for
    tasks such as speech emotion recognition, music understanding, and acoustic scene
    classification. We further evaluate the tokenizer''s generative performance on
    text-to-audio (TTA), text-to-music (TTM), and speech enhancement (SE). Our approach
    surpasses standard variational autoencoder (VAE)-based methods on TTA and TTM
    tasks, while its effectiveness on SE underscores its capabilities as a general-purpose
    audio encoder. Finally, our results challenge the prevailing assumption that VAE-based
    architectures are a prerequisite for audio synthesis. Checkpoints are available
    at https://huggingface.co/mispeech/dashengtokenizer.'
- title: 'From Prompting to Describing: A Cross-Cultural Study of Language for AI-Generated
    Music'
  date: 2026-08
  url: https://arxiv.org/abs/2608.06634
  category: cognition
  subcategory: multimodal
  abstract: 'Text-to-music (TTM) generation systems allow users to create music through
    natural language prompts, yet it is unclear whether the descriptive language used
    to prompt aligns with descriptive language used to summarize or describe heard
    music. We pair 200 real-world Udio prompts with their generated audio and free-form
    descriptions collected from English- (n = 70) and Korean-speaking (n = 78) listeners,
    and contribute a human-derived taxonomy of musical prompting vocabulary grounded
    in real user data. Using this framework, alongside word- and vector-level analyses,
    we find a consistent structural asymmetry: prompts are dominated by Genre and
    Story/Narrative language. Genre terms propagate most reliably from prompt to perception,
    while narrative-heavy prompts are the strongest predictor of semantic misalignment.
    A preliminary cross-cultural comparison further suggests that description profiles
    vary across listener populations along narrative, functional, and affective dimensions,
    raising questions about whether current TTM systems, trained on aggregated English-centric
    corpora, can accommodate the full diversity of how people naturally express musical
    ideas.'
- title: 'ViTex: Visual Texture Control for Multi-Track Symbolic Music Generation
    via Discrete Diffusion Models'
  date: 2026-03
  url: https://arxiv.org/abs/2603.01984
  category: generation
  subcategory: symbolic
  abstract: In automatic music generation, a central challenge is to design controls
    that enable meaningful human-machine interaction. Existing systems often rely
    on extrinsic inputs such as text prompts or metadata, which do not allow humans
    to directly shape the composition. While prior work has explored intrinsic controls
    such as chords or hierarchical structure, these approaches mainly address piano
    or vocal-accompaniment settings, leaving multitrack symbolic music largely underexplored.
    We identify instrumentation, the choice of instruments and their roles, as a natural
    dimension of control in multi-track composition, and propose ViTex, a visual representation
    of instrumental texture. In ViTex, color encodes instrument choice, spatial position
    represents pitch and time, and stroke properties capture local textures. Building
    on this representation, we develop a discrete diffusion model conditioned on ViTex
    and chord progressions to generate 8-measure multi-track symbolic music, enabling
    explicit texture-level control while maintaining strong unconditional generation
    quality. The demo page and code are avaliable at https://vitex2025.github.io/.
- title: 'Modeling Music as a Time-Frequency Image: A 2D Tokenizer for Music Generation'
  date: 2026-05
  url: https://arxiv.org/abs/2605.15831
  category: generation
  subcategory: audio
  abstract: Autoregressive music generation depends strongly on the audio tokenizer.
    Existing high-fidelity codecs often use residual multi-codebook quantization,
    which preserves reconstruction quality but complicates language modeling after
    sequence flattening, as the residual hierarchy imposes strong sequential dependencies
    and can amplify error accumulation. We propose BandTok, a generation-oriented
    2D Mel-spectrogram tokenizer that represents each frame with Mel-frequency band
    tokens from a single shared codebook. This design yields a physically interpretable
    time-frequency token grid with a more independent token structure, making it better
    suited for autoregressive modeling. BandTok improves reconstruction with a multi-scale
    PatchGAN objective and EMA codebook updates. We further introduce an autoregressive
    language model with 2D Rotary Position Embedding (2D RoPE) to preserve temporal
    and frequency-band structure during generation. Experiments show that BandTok
    improves over residual-codebook tokenizers and achieves strong results in a data-limited
    setting. The source code and generation demos for this work are publicly available.
- title: 'Echoes: A semantically-aligned music deepfake detection dataset'
  date: 2026-03
  url: https://arxiv.org/abs/2603.23667
  category: generation
  subcategory: audio
  abstract: We introduce Echoes, a new dataset for music deepfake detection designed
    for training and benchmarking detectors under realistic and provider-diverse conditions.
    Echoes comprises 4,468 tracks (131 hours of audio) spanning multiple genres (pop,
    rock, electronic), and includes content generated by ten popular AI music generation
    systems. To prevent shortcut learning and promote robust generalization, the dataset
    is deliberately constructed to be challenging, enforcing semantic-level alignment
    between spoofed audio and bona fide references. This alignment is achieved by
    conditioning generated audio samples directly on bona-fide waveforms or song descriptors.
    We evaluate Echoes in a cross-dataset setting against three existing AI-generated
    music datasets using state-of-the-art Wav2Vec2 XLS-R 2B representations. Results
    show that (i) Echoes is the hardest in-domain dataset; (ii) detectors trained
    on existing datasets transfer poorly to Echoes; (iii) training on Echoes yields
    the strongest generalization performance. These findings suggest that provider
    diversity and semantic alignment help learn more transferable detection cues.
- title: 'InvFlowFD: Reference-Free and Background-Set-Free Perceptual Music Quality
    Metric with Flow Matching Inversion'
  date: 2026-08
  url: https://arxiv.org/abs/2608.04142
  category: generation
  subcategory: audio
  abstract: Existing reference-free methods for evaluating music perceptual quality
    alleviate the need for paired noisy-clean data, but they still rely on a background
    set, which is used to compute aggregated statistics of clean audio samples. In
    this work, we propose a novel approach that eliminates this requirement, achieving
    background-set-free and reference-free quality estimation using only a pre-trained
    Flow Matching backbone. We demonstrate that unconditional Flow Matching inversion
    via simple Euler integration is sufficient to detect various artificial distortions
    and accurately rank music generation models against human perceptual judgments.
    We introduce InvFlowFD, which performs flow inversion and compares a group of
    inverted samples to the prior distribution. We evaluate our method against prior
    work, quantitatively and with a thorough human study. Results suggest that InvFlowFD
    is highly correlated with human perception of sound distortions, as well as generative
    models' quality, while being more flexible and less restrictive than existing
    metrics.
- title: Do Text-to-Music Models Really Follow Instructions? A Counterfactual Evaluation
    of Key and Beat Grouping
  date: 2026-08
  url: https://arxiv.org/abs/2608.11899
  category: evaluation
  subcategory: multimodal
  abstract: 'Prompted attribute agreement is widely used as evidence of text-to-music
    controllability, yet a requested attribute may occur simply because it is already
    common in the model''s output distribution. We introduce a matched counterfactual
    evaluation that separates target occurrence from instruction-attributable control.
    Each family contains a neutral input that omits the scored attribute and two otherwise
    matched inputs that swap the requested target. All three are rendered through
    frozen native-interface adapters with a shared seed. Applied to global key and
    beat grouping in three open systems, this design changes the empirical conclusion.
    ACE-Step 1.5 and Stable Audio 3 Medium exhibit substantial key control, whereas
    LeVo2 does not. For beat grouping, the same models redirect toward the rare three-beat
    target, but high four-beat agreement is largely inherited from neutral outputs:
    Stable Audio 3 produces four-beat grouping in 0.97 of neutral cases but only 0.56
    under its explicit four-beat treatment. Off-attribute placebos, external recognizer
    validation, blind expert annotation, and multi-seed sentinels support the attribution.
    When targets have unequal output priors, agreement describes what a model produced,
    while matched neutral and target-swap contrasts test whether the instruction changed
    it.'
- title: 'UniSonate: A Unified Model for Speech, Music, and Sound Effect Generation
    with Text Instructions'
  date: 2026-04
  url: https://arxiv.org/abs/2604.22209
  category: generation
  subcategory: multimodal
  abstract: Generative audio modeling has largely been fragmented into specialized
    tasks, text-to-speech (TTS), text-to-music (TTM), and text-to-audio (TTA), each
    operating under heterogeneous control paradigms. Unifying these modalities remains
    a fundamental challenge due to the intrinsic dissonance between structured semantic
    representations (speech/music) and unstructured acoustic textures (sound effects).
    In this paper, we introduce UniSonate, a unified flow-matching framework capable
    of synthesizing speech, music, and sound effects through a standardized, reference-free
    natural language instruction interface. To reconcile structural disparities, we
    propose a novel dynamic token injection mechanism that projects unstructured environmental
    sounds into a structured temporal latent space, enabling precise duration control
    within a phoneme-driven Multimodal Diffusion Transformer (MM-DiT). Coupled with
    a multi-stage curriculum learning strategy, this approach effectively mitigates
    cross-modal optimization conflicts. Extensive experiments demonstrate that UniSonate
    achieves state-of-the-art performance in instruction-based TTS (WER 1.47%) and
    TTM (SongEval Coherence 3.18), while maintaining competitive fidelity in TTA.
    Crucially, we observe positive transfer, where joint training on diverse audio
    data significantly enhances structural coherence and prosodic expressiveness compared
    to single-task baselines. Audio samples are available at https://qiangchunyu.github.io/UniSonate/.
- title: Improving Text-to-Music Generation with Human Preference Rewards
  date: 2026-06
  url: https://arxiv.org/abs/2606.21670
  category: generation
  subcategory: multimodal
  abstract: 'We describe our entry to the efficiency track of the Academic Text-to-Music
    (ATTM) Grand Challenge at ICME 2026. Beyond the challenge protocol''s FAD-CLAP
    and CLAP score, we add a learned human-preference reward from TuneJury, a twin
    pairwise ranker trained over open music-preference datasets. The reward serves
    both as a training-time conditioning signal and as a sample-selection criterion.
    The pipeline combines five engineering decisions on a 120M-parameter FluxAudio-S
    backbone, four at training time and one at inference: (i) training-time reward
    conditioning that doubles as an inference-time CFG axis, (ii) a sweep over five
    score-conditioning architectures, where training and inference use different variants,
    (iii) expert iteration on the top decile, (iv) a short preference-tuning pass
    (CRPO) for audio-text alignment, and (v) inference post-processing via joint CFG,
    source separation, and loudness normalization. Per-stage decomposition on 100
    Song Describer prompts shows training-time reward conditioning as a functional
    conditioning axis, expert iteration as the dominant contributor, the preference-tuning
    pass adding only noise-level gain, and the inference-time score scalar already
    saturated by the end of the chain.'
- title: 'Finding the noise: Zero-shot AI Music Detection'
  date: 2026-07
  url: https://arxiv.org/abs/2607.25530
  category: generation
  subcategory: audio
  abstract: We present a novel method for AI-generated music detection in scenarios
    where the models that generated the input samples are unknown to the detector
    (e.g., from a newly released service). Since 2023, there has been a multiplication
    of user-friendly AI-music generation services (e.g., Suno, Udio), along with regular
    updates and new features. There is thus a need to address synthetic content detection
    in an unsupervised way to adapt to this rapidly changing context. This angle has
    not been much studied in music yet. We propose to study two tasks. First, discriminating
    between real and synthetic music. This may be approached in a one-class manner,
    namely, using some baseline real music and trying to determine what falls outside.
    Second, zero-shot multi-class identification, which is more similar to an unsupervised
    clustering task on a mix of real and various AI-music generations, where the goal
    is to create coherent, high-purity clusters. We propose a combination of a previously
    proposed artifact-extraction method, on top of which we apply non-negative matrix
    factorization and simple classification and clustering methods. We achieve excellent
    performance on both tasks, showing that the proposed methods may be used to monitor
    large-scale catalogs that may receive AI-generated samples from various newly
    released generative models.
- title: 'P-MUSE: Prompt-MIDI-Optional Model for Unified Instrumental Music Synthesis
    and Editing'
  date: 2026-08
  url: https://arxiv.org/abs/2608.01920
  category: analysis
  subcategory: symbolic
  abstract: 'MIDI-to-Music system renders the melody and rhythm of a target MIDI sequence
    into musical segment while cloning instrument timbre from a prompt recording.
    Existing systems typically adopt one of two distinct paradigms: conditional generation
    with prompt audio alone, which remains applicable when aligned prompt MIDI is
    unavailable, and In-Context Learning with paired prompt audio and MIDI, which
    exploits cross-modal alignment for stronger control on MIDI following and timbre
    similarity. We introduce P-MUSE, an instrumental MIDI-to-Music framework that
    unifies both paradigms via a multi-stage Curriculum-Learning supporting prompt-MIDI-optional
    inputs. P-MUSE further unifies music generation and local editing through a shared
    fill-in-the-middle formulation. Grounded in theoretical analysis and empirical
    study, we propose a phase-aware classifier-free guidance scheduling principle
    for Transcription-to-Audio systems, alongside a Tail-Drop strategy. Finally, to
    advance research in this field, we establish the first comprehensive benchmark,
    covering various prompt modes, generation/editing tasks, and four representative
    instruments: piano, guitar, bass, and drums. Demos are available at https://p-muse.github.io/.'
- title: Genre Bias or Aesthetic Perception? Identifying and Mitigating Shortcut Learning
    in Music Evaluation
  date: 2026-07
  url: https://arxiv.org/abs/2607.13903
  category: generation
  subcategory: symbolic
  abstract: 'Music aesthetics scoring plays a critical role in applications such as
    dataset curation, generative model evaluation, and reward modeling for music generation.
    Recent approaches rely on deep neural networks trained on human-annotated ratings,
    but these models may exploit spurious correlations rather than capturing perceptually
    meaningful aesthetics. In this work, we identify a previously underexplored failure
    mode in music evaluation models: genre-induced shortcut learning. Through a systematic
    analysis of SongEval, we show that biases in training data lead to strong correlations
    between genre-related features and predicted scores, causing the model to use
    them as a proxy for aesthetics. This results in systematic overestimation of pop
    music and undervaluation of high-quality samples from other genres, leading to
    predictions that are inconsistent with human preferences. To address this issue,
    we propose a training objective that jointly reweights hard samples and regularizes
    group-level performance, encouraging the model to learn genre-invariant representations
    of musicality. Experimental results demonstrate that our method reduces genre-dependent
    bias and improves alignment with human preferences, as reflected by gains in both
    cross-genre and within-genre preference alignment.'
- title: 'MI-MIDI: Mechanistic Interpretability of Text-to-MIDI Generation Models
    via Probing, Lenses and Steering'
  date: 2026-08
  url: https://arxiv.org/abs/2608.06638
  category: generation
  subcategory: symbolic
  abstract: 'Mechanistic interpretability of music generation has concentrated on
    audio models, leaving symbolic models largely unexplored. We analyze two public
    text-to-MIDI systems of contrasting design: the purpose-built encoder--decoder
    text2midi and MIDI-LLM, a Llama~3.2~1B model extended with MIDI tokens using linear
    probing, the logit and tuned lenses, activation patching and difference-in-means
    steering. Across these methods, we recover musically meaningful structure and
    show how architecture shapes its formation and control. Pitch, instrumentation,
    harmony and texture are linearly decodable in both models. text2midi refines predictions
    gradually across depth, whereas MIDI-LLM works largely in its inherited textual
    basis before a sharp late rotation into the musical vocabulary; patching identifies
    a matching late attenuation of prompt-driven instrument transfer. Steering produces
    bidirectional changes in register and polyphony in both systems, and in tempo/energy
    in MIDI-LLM. Our two-orientation protocol isolates directional control and shows
    that all-layer interventions are robust in text2midi but accumulate disruptively
    in MIDI-LLM. Together, the results provide a practical toolkit for tracing and
    controlling musical concepts in symbolic generators. Audio examples are available
    on a demo website.'
- title: Real-Time Interactive Music Generation via Data-Free Streaming Consistency
    Distillation
  date: 2026-06
  url: https://arxiv.org/abs/2606.24307
  category: generation
  subcategory: audio
  abstract: Interactive music and live performance relies on real-time human expression,
    but modern generative music AI remains largely absent from this domain due to
    its prohibitive inference latency and offline rendering paradigm. To provide pioneer
    musicians with a novel medium for interactive composition, we should fundamentally
    change these static models into dynamic, playable instruments. In this paper,
    we propose a framework that bridges this gap. To achieve the low latency required
    for live interaction without sacrificing structural coherence, we formulate distillation
    within a streaming autoregressive latent space. Our approach gets rid of the need
    for expensive paired audio-latent datasets by utilizing prompt-only inputs to
    synthesize teacher-guided, chunk-wise trajectories on the fly. Because live instruments
    require high acoustic fidelity, we introduce music-aware consistency objectives,
    which combine latent, spectral, and temporal-difference losses, to preserve crucial
    qualities like timbre, transients, and rhythmic stability during accelerated single-step
    streaming generation. Implemented via parameter-efficient adaptation, our distillation
    reduces generation steps to achieve a low real-time factor. Crucially, by operating
    as a continuous autoregressive stream, the system can seamlessly assimilate dynamic
    human inputs on the fly, allowing users to instantly steer the musical trajectory
    without interrupting the audio flow. Ultimately, this work recontextualizes generative
    text-to-music models not as passive prompt-and-wait systems, but as responsive
    instruments, opening new frontiers for live human-AI musical co-creation.
- title: A Text-Steerable Instrument for Sketching Procedural Soundscapes via Language
    Models
  date: 2026-07
  url: https://arxiv.org/abs/2607.00309
  category: generation
  subcategory: multimodal
  abstract: We present a real-time musical interface that converts natural-language
    scene descriptions into evolving procedural soundscapes. A performer types a prompt
    such as "warm jazz cafe at midnight" and steers it through direct parameter adjustments
    - stepping brightness down, switching a rhythm style - each producing a predictable,
    audible shift without re-prompting. Where GPU-bound text-to-audio systems synthesize
    monolithic waveforms, our instrument generates human-readable configurations over
    a categorical schema, enabling fine-grained performer control; most valid combinations
    are designed to sound musically coherent. Three interchangeable backends - embedding
    retrieval for sub-second CPU-only use, hosted LLMs via API, and a fine-tuned 270M
    local model - all emit the same schema. A live generator architecture continuously
    emits audio while resolving new instructions in the background, crossfading seamlessly
    when ready; even when an LLM takes 5-12 seconds to respond, the audience hears
    uninterrupted sound - reframing text-to-music as an ongoing performable stream
    rather than a one-shot generation. We evaluate text-audio semantic alignment using
    LAION-CLAP on held-out prompts as a technical proxy, finding that retrieval-based
    configuration outperforms random valid configurations on this metric, while noting
    that LAION-CLAP also informed retrieval-map construction. We report performance
    observations, informal listener feedback, and release materials for the SDK, dataset
    artifacts, model, and audiovisual performance interface.
- title: 'Audio-Oscar: A Multi-Agent System for Complex Audio Scene Generation, Orchestration,
    and Refinement'
  date: 2026-06
  url: https://arxiv.org/abs/2606.07397
  category: generation
  subcategory: audio
  abstract: In recent years, audio generation has made significant progress in tasks
    such as text-to-speech (TTS), text-to-audio (TTA) and text-to-music (TTM). However,
    generating long-form and controllable audio from complex audio scene descriptions
    remains a significant challenge, as such scenes often require coordinated speech,
    sound effects, music, songs, temporal structure, and post-production. In this
    work, we introduce Audio-Oscar, a multi-agent framework for generating audio from
    complex descriptions. Audio-Oscar coordinates a set of specialist agents, each
    responsible for a different aspect of the audio scene, including character modeling
    and voice design, speech generation, fine-grained timeline planning, model selection,
    non-speech generation, and audio post-production. Audio-Oscar further incorporates
    feedback-driven refinement. In addition, to address the lack of suitable benchmarks
    for evaluating audio generation from complex audio scene descriptions, we construct
    ASG-Bench, an Audio Scene Generation Benchmark containing both scene descriptions
    paired with reference audio and text-only scene descriptions. Each scene is annotated
    with target audio events and temporal statements to evaluate whether the generated
    audio faithfully realizes the required scene content and temporal structure. Experimental
    results show that Audio-Oscar can effectively generate audio that matches complex
    scene descriptions. Project samples are available at https://audiooscar.github.io/.
    Our code is available at https://github.com/ziye26/Audio-Oscar.
- title: 'MuQ-Eval: An Open-Source Per-Sample Quality Metric for AI Music Generation
    Evaluation'
  date: 2026-03
  url: https://arxiv.org/abs/2603.22677
  category: evaluation
  subcategory: audio
  abstract: Distributional metrics such as Fréchet Audio Distance cannot score individual
    music clips and correlate poorly with human judgments, while the only per-sample
    learned metric achieving high human correlation is closed-source. We introduce
    MUQ-EVAL, an open-source per-sample quality metric for AIgenerated music built
    by training lightweight prediction heads on frozen MuQ-310M features using MusicEval,
    a dataset of generated clips from 31 text-to-music systems with expert quality
    ratings. Our simplest model, frozen features with attention pooling and a two-layer
    MLP, achieves system-level SRCC = 0.957 and utterance-level SRCC = 0.838 with
    human mean opinion scores. A systematic ablation over training objectives and
    adaptation strategies shows that no addition meaningfully improves the frozen
    baseline, indicating that frozen MuQ representations already capture quality-relevant
    information. Encoder choice is the dominant design factor, outweighing all architectural
    and training decisions. LoRA-adapted models trained on as few as 150 clips already
    achieve usable correlation, enabling personalized quality evaluators from individual
    listener annotations. A controlled degradation analysis reveals selective sensitivity
    to signal-level artifacts but insensitivity to musical-structural distortions.
    Our metric, MUQ-EVAL, is fully open-source, outperforms existing open per-sample
    metrics, and runs in real time on a single consumer GPU. Code, model weights,
    and evaluation scripts are available at https://github.com/dgtql/MuQ-Eval.
- title: 'SongEcho: Towards Cover Song Generation via Instance-Adaptive Element-wise
    Linear Modulation'
  date: 2026-02
  url: https://arxiv.org/abs/2602.19976
  category: generation
  subcategory: multimodal
  abstract: Cover songs constitute a vital aspect of musical culture, preserving the
    core melody of an original composition while reinterpreting it to infuse novel
    emotional depth and thematic emphasis. Although prior research has explored the
    reinterpretation of instrumental music through melody-conditioned text-to-music
    models, the task of cover song generation remains largely unaddressed. In this
    work, we reformulate our cover song generation as a conditional generation, which
    simultaneously generates new vocals and accompaniment conditioned on the original
    vocal melody and text prompts. To this end, we present SongEcho, which leverages
    Instance-Adaptive Element-wise Linear Modulation (IA-EiLM), a framework that incorporates
    controllable generation by improving both conditioning injection mechanism and
    conditional representation. To enhance the conditioning injection mechanism, we
    extend Feature-wise Linear Modulation (FiLM) to an Element-wise Linear Modulation
    (EiLM), to facilitate precise temporal alignment in melody control. For conditional
    representations, we propose Instance-Adaptive Condition Refinement (IACR), which
    refines conditioning features by interacting with the hidden states of the generative
    model, yielding instance-adaptive conditioning. Additionally, to address the scarcity
    of large-scale, open-source full-song datasets, we construct Suno70k, a high-quality
    AI song dataset enriched with comprehensive annotations. Experimental results
    across multiple datasets demonstrate that our approach generates superior cover
    songs compared to existing methods, while requiring fewer than 30% of the trainable
    parameters. The code, dataset, and demos are available at https://github.com/lsfhuihuiff/SongEcho_ICLR2026.
- title: 'TMD-Bench: A Multi-Level Evaluation Paradigm for Music-Dance Co-Generation'
  date: 2026-05
  url: https://arxiv.org/abs/2605.01809
  category: evaluation
  subcategory: multimodal
  abstract: 'Unified audio-visual generation is rapidly gaining industrial and creative
    relevance, enabling applications in virtual production and interactive media.
    However, when moving from general audio-video synthesis to music-dance co-generation,
    the task becomes substantially harder: musical rhythm, phrasing, and accents must
    drive choreographic motion at fine temporal resolution, and such rhythmic coupling
    is not captured by unimodal metrics or generic audiovisual consistency scores
    used in current evaluation practice. We introduce TMD-Bench, a benchmark for text-driven
    music-dance co-generation that assesses systems across unimodal generation quality,
    instruction adherence, and cross-modal rhythmic alignment. The benchmark integrates
    computable physical metrics with perceptual multimodal judgments, and is supported
    by a curated rhythm-aligned music-dance dataset and a fine-grained Music Captioner
    for structured music semantics. TMD-Bench further reveals that (i) modern commercial
    audio-visual models, such as Veo 3 and Sora 2, produce high-quality music and
    video, while rhythmic coupling remains less consistently optimized and leaves
    room for improvement, and (ii) our unified baseline RhyJAM trained on rhythm-aligned
    data achieves competitive beat-level synchronization while maintaining competitive
    unimodal fidelity. This presents prospects for building next-generation music-dance
    models that explicitly optimize rhythmic and kinetic coherence.'
- title: 'CMI-RewardBench: Evaluating Music Reward Models with Compositional Multimodal
    Instruction'
  date: 2026-02
  url: https://arxiv.org/abs/2603.00610
  category: analysis
  subcategory: multimodal
  abstract: 'While music generation models have evolved to handle complex multimodal
    inputs mixing text, lyrics, and reference audio, evaluation mechanisms have lagged
    behind. In this paper, we bridge this critical gap by establishing a comprehensive
    ecosystem for music reward modeling under Compositional Multimodal Instruction
    (CMI), where the generated music may be conditioned on text descriptions, lyrics,
    and audio prompts. We first introduce CMI-Pref-Pseudo, a large-scale preference
    dataset comprising 110k pseudo-labeled samples, and CMI-Pref, a high-quality,
    human-annotated corpus tailored for fine-grained alignment tasks. To unify the
    evaluation landscape, we propose CMI-RewardBench, a unified benchmark that evaluates
    music reward models on heterogeneous samples across musicality, text-music alignment,
    and compositional instruction alignment. Leveraging these resources, we develop
    CMI reward models (CMI-RMs), a parameter-efficient reward model family capable
    of processing heterogeneous inputs. We evaluate their correlation with human judgment
    scores on musicality and alignment on CMI-Pref along with previous datasets. Further
    experiments demonstrate that CMI-RM not only correlates strongly with human judgments,
    but also enables effective inference-time scaling via top-k filtering. Code is
    available at GitHub (https://github.com/Haiwen-Xia/CMI-RewardBench). Model weights:
    CMI-RM (https://huggingface.co/HaiwenXia/CMI-RM). Datasets: CMI-Pref-Pseudo (https://huggingface.co/datasets/HaiwenXia/cmi-pref-pseudo)
    and CMI-Pref (https://huggingface.co/datasets/HaiwenXia/cmi-pref)'
- title: 'Live Music Diffusion Models: Efficient Fine-Tuning and Post-Training of
    Interactive Diffusion Music Generators'
  date: 2026-05
  url: https://arxiv.org/abs/2605.22717
  category: generation
  subcategory: audio
  abstract: Interactive streaming music generation promises the use of generative
    models for live performance and co-creation that is impossible with offline models.
    However, SOTA models exist in the discrete-AR regime, requiring industrial levels
    of compute for both training and inference. In this work, we investigate whether
    audio diffusion models, with their wide support in the open-source community but
    non-streaming bidirectional nature, can be repurposed efficiently into interactive
    models accessible on consumer hardware. By taking a critical look at the modern
    pipeline for block-wise outpainting diffusion, we identify critical inefficiencies
    during inference that result in strictly worse computational efficiency than their
    discrete-AR counterparts. We propose Live Music Diffusion Models (LMDMs), a simple
    modification of the generative diffusion process that recovers, and then outperforms,
    the inference complexity of the discrete Live Music Models (LMMs) through block-wise
    KV Caching. Unlike LMMs, LMDMs further enable stable post-training alignment through
    our novel ARC-Forcing paradigm, reducing error accumulation without any explicit
    RL or reward models. We demonstrate the application of LMDMs in a number of creative
    domains, including text-conditioned generation, sketch-based music synthesis,
    and jamming. We finally show how LMDMs can be used as a generative instrument
    in a real artist-AI collaboration, utilizing LMDMs as a "generative delay" to
    transform musicians' improvisation live for variable timbral effects while running
    locally on a consumer gaming laptop.
- title: 'From Textural Counterpoint to Feature Encoding: A Multi-Dimensional Machine
    Representation Study of Haydn''s "The Lark" Integrating Electroacoustic Analysis'
  date: 2026-07
  url: https://arxiv.org/abs/2607.05902
  category: generation
  subcategory: audio
  abstract: 'Chamber music, as a highly precise multi-part interactive system, contains
    a logic of "role assignment and dynamic interaction" that provides an extremely
    valuable blueprint for exploring human-computer collaborative composition paradigms.
    Addressing the lack of role perception capabilities in existing deep music generation
    models during polyphonic interactions, this paper conducts an interdisciplinary
    analysis of Haydn''s String Quartet in D Major, The Lark (Op. 64, No. 5). We propose
    a novel research path: "Classical Morphology Qualitative Analysis-Electroacoustic
    Quantitative Measurement-Machine Representation Reconstruction." The study first
    utilizes auditory analysis to dissect the counterpoint morphology of the leading
    voice and the underlying groove in the first movement. Subsequently, it introduces
    spectrum and dynamic feature analysis tools from a Digital Audio Workstation (DAW)
    to translate subjective auditory perception into objective, measurable physical
    parameters. Building on this, the paper introduces a fundamentally new approach
    to low-level computer feature extraction: completely abandoning the traditional
    mechanical quantization grid, introducing Event-based Timestamps to record the
    duration of micro-timing, and transforming acoustic features into an independent
    "Role-Aware Encoding" as an aesthetic heuristic mechanism (a phenomenological
    anchor). This study not only completes the logical loop spanning classical analysis,
    electronic music mapping, and AI symbolic generation but also establishes a profound
    theoretical foundation-from the perspectives of interactive aesthetics and media
    philosophy-for constructing human-computer collaborative music systems imbued
    with "social attributes" and "otherness awareness."'
- title: A Quantized Native Runtime for On-Device Semantic Audio Generation
  date: 2026-07
  url: https://arxiv.org/abs/2607.08526
  category: generation
  subcategory: audio
  abstract: 'Semantic audio applications increasingly require controllable generation
    on commodity and embedded hardware rather than through framework-heavy datacenter
    stacks. We present aria, a dependency-free native runtime that runs the complete
    text-to-music pipeline of Stable Audio~3 (SA3) on ordinary GPUs, CPU-only machines,
    and a Raspberry~Pi~5, with no Python or deep-learning framework underneath. Our
    main contribution is a study of quantization: running the model at lower numerical
    precision to fit tight memory budgets, saving memory in place rather than adding
    to it. Because the runtime owns every internal tensor, it also exposes activation
    steering, a low-cost way to steer what the model generates. We judge the quality
    cost with three independent measures of the output (prompt adherence, overall
    audio quality, taste preservation), each compared against the ordinary variation
    between random seeds. Eight-bit precision shows no measurable quality loss on
    any measure while sharply cutting memory, and it is the fastest mode on the GPU;
    four-bit adds a small, bounded cost but shrinks the footprint enough to run the
    1.2-billion-parameter model on an 8\,GB Pi. Against the official implementation,
    aria matches or exceeds generation speed and starts about seven times faster.
    A case study of the steering interface generates music carrying taste associations
    (sonic seasoning), with genuine but bounded control for a subset of attributes.
    These results make a compact, quantized runtime with built-in control a practical
    basis for on-device semantic audio in Internet-of-Sounds settings. The aria runtime
    is released at https://github.com/matteospanio/aria.'
- title: 'MAGE: Modality-Agnostic Music Generation and Target-Source Extraction'
  date: 2026-04
  url: https://arxiv.org/abs/2604.09803
  category: generation
  subcategory: multimodal
  abstract: 'Recent advances in multimodal audio generation have enabled music synthesis
    from text, visual cues, and other high-level conditions. However, most systems
    are designed for a single operating mode: either generating music without a reference
    mixture or extracting a target source from an existing mixture. This fixed-task
    design limits their use when different combinations of text, visual, and mixture
    inputs are available. To address this gap, we propose MAGE, a modality-agnostic
    framework for conditional music generation and mixture-grounded target-source
    extraction within a shared continuous latent space. Our approach introduces three
    key components. First, a Controlled Multimodal FluxFormer models the conditional
    flow from noise to a target audio latent, enabling the same backbone to operate
    with or without a mixture condition. Second, Audio-Visual Nexus Alignment maps
    frame-level visual features onto the audio latent sequence, allowing visual evidence
    to condition the generation process at the audio-token level. Third, a cross-gated
    modulation mechanism uses the aligned visual representation to regulate intermediate
    audio features, while text provides separate semantic guidance. We further train
    MAGE with dynamic modality masking, exposing the same model to text-only, visual-only,
    joint text-visual, mixture-conditioned, and unconditional configurations. Experiments
    on the MUSIC benchmark evaluate MAGE under separate protocols for mixture-free
    generation and mixture-grounded target-source extraction. The results show that
    MAGE provides a shared conditioning interface across both settings, and that the
    proposed alignment and gating components improve interference suppression in the
    extraction task.'
- title: Improved Robustness in AI-Generated Music Detection
  date: 2026-07
  url: https://arxiv.org/abs/2607.27454
  category: analysis
  subcategory: symbolic
  abstract: 'AI music generators leave predictable spectral artifacts determined by
    their architecture. Existing detectors exploit these artifacts with near-perfect
    accuracy on raw generated tracks, but their performance collapses under simple
    audio manipulations, such as speed modification or pitch shifting. We address
    this open robustness problem by introducing a frequency-scaling-invariant detection
    pipeline that aims to prevent this kind of attack by design. Our method maps audio
    onto a log-frequency axis via a log-STFT remapping. A single learned cross-correlation
    filter, combined with max-pooling, provides shift invariance at inference time.
    Training uses a hybrid loss that jointly supervises binary detection and artifact-peak
    localization, regularizing boundary weights. Because robustness to speed change
    is built in by design, the detector is also interpretable: it outputs both a binary
    decision and an estimate of the applied speed-change factor.'
- title: 'LK Jam: System Architecture and Implementation of a Real-Time Human-AI Interactive
    Music Generation System using Role-Aware GRU'
  date: 2026-06
  url: https://arxiv.org/abs/2606.21018
  category: generation
  subcategory: audio
  abstract: As artificial intelligence advances into the era of Embodied AI, live
    musical interaction urgently needs to break free from the limitations of offline,
    unidirectional generation, achieving a "virtual synergy" capable of low-latency,
    dynamic interplay. To address this, this technical report presents LK_Jam, a real-time,
    bidirectional human-computer interactive music generation system based on a lightweight
    Gated Recurrent Unit (GRU) and a high-performance audio host architecture. In
    the algorithmic representation layer, this system abandons the computationally
    expensive fixed time-grid. Instead, it constructs a multi-dimensional sparse event
    stream integrating time-shifts, continuous harmonic embeddings, and role-aware
    encoding, enabling the model to accurately capture turn-taking logic and micro-timing
    in a single-step inference. In the engineering implementation layer, this paper
    builds a strict multithreaded lock-free communication bridge using C++ and the
    JUCE framework, incorporating the RTNeural inference engine designed specifically
    for real-time audio. By utilizing compile-time network topology solidification
    and a zero-allocation (allocation-free) mechanism, the end-to-end overhead of
    autoregressive decoding is strictly locked at O(1) complexity, structurally mitigating
    the risk of audio thread dropouts in DAW plugin environments. Furthermore, this
    study designs a three-stage progressive training strategy, achieving a leap from
    basic chord harmonization to expert-level interaction. Preliminary observations
    and architectural analysis demonstrate that while ensuring musical coherence and
    interactive role-play, the proposed system successfully challenges extreme real-time
    engineering constraints, offering a highly robust and deployable technical paradigm
    for next-generation AI co-performers in live music.
- title: 'MusicMark: A Robust Generative Watermarking Framework for Music Generation'
  date: 2026-07
  url: https://arxiv.org/abs/2607.11117
  category: generation
  subcategory: audio
  abstract: AI music generation has rapidly advanced alongside commercial platforms,
    raising the need for reliable watermarking for provenance and attribution. However,
    existing audio watermarking research has largely focused on speech, and applying
    speech-oriented methods to music is challenging due to music's complex structure
    and rich acoustic texture. Most existing methods are post-hoc, adding imperceptible
    perturbations after generation rather than embedding watermarks as part of the
    content. This makes them fragile under transformations and especially vulnerable
    to neural codec re-synthesis, which can discard imperceptible residual signals.
    Moreover, since generation and watermarking are decoupled, the watermarking step
    can be bypassed or omitted, weakening provenance guarantees. To address these
    issues, we propose MusicMark, which, to the best of our knowledge, is the first
    generative watermarking framework for music. Specifically, MusicMark embeds watermark
    messages into the semantic latent space during generation, incorporating the watermark
    as part of the musical content and ensuring robustness against diverse attacks,
    particularly neural codec re-synthesis. To this end, we introduce a watermark
    adapter into a diffusion-based generation model to embed watermark messages across
    denoising steps. The adapter and detector are trained with a joint objective that
    preserves fidelity by constraining watermarked latents close to their unwatermarked
    reference latents, while improving robustness through attack augmentations. Experiments
    demonstrate that MusicMark substantially outperforms post-hoc baselines across
    diverse attacks including neural codec re-synthesis, while maintaining comparable
    generation quality. We further introduce a cover-song attack, converting the singing
    voice while preserving musical content, and show that MusicMark remains more robust
    than post-hoc methods.
- title: 'Neurological Plausibility of AI-Generated Music for Commercial Environments:
    An In-Silico Cortical Investigation Using Wubble and TRIBE v2'
  date: 2026-04
  url: https://arxiv.org/abs/2604.04025
  category: generation
  subcategory: audio
  abstract: 'Background music shapes attention, affect, and approach behavior in commercial
    environments, yet the neural plausibility of AI-generated music for such settings
    remains poorly characterized. We present an in-silico pilot study that combines
    Wubble, a generative music system, with TRIBE v2, a publicly released whole-brain
    encoding model, to estimate cortical response profiles for prompt-conditioned
    retail music. Five fully instrumental tracks were generated to span low-to-high
    arousal, sparse-to-dense arrangement, and neutral-to-positive valence prompts,
    then analyzed with audio-only TRIBE v2 inference on loudness-normalized waveforms.
    Analysis focused on fsaverage5 cortical predictions summarized over auditory,
    superior temporal, temporo-parietal, and inferior frontal HCP parcels. The fast
    bright major-pop condition produced the largest whole-cortex mean activation (0.0402),
    the strongest prefrontal ROI composite response (0.0704), and the highest parcel
    means in IFJa (0.1102), IFJp (0.0995), A5 (0.0188), and area 45 (0.0015). Pairwise
    spatial correlations ranged from 0.787 to 0.974, indicating that prompt variation
    modulated predicted cortical states rather than yielding a single undifferentiated
    response profile. Predicted cortical surface maps further revealed visually distinct
    spatial organization between low-arousal and high-arousal conditions. These results
    support a cautious claim of cortical neurological plausibility: prompt-conditioned
    AI music can systematically shift predicted auditory-temporal-prefrontal patterns
    relevant to salience and valuation. Although the study does not establish subcortical
    reward engagement or consumer behavior, it provides a reproducible framework for
    neural pre-screening and pre-optimization of commercial music generation against
    biologically informed cortical proxies.'
- title: 'Agogic: Performance-Timed Music Tokens for LLM-Native Text-to-Symbolic-Music
    Generation'
  date: 2026-08
  url: https://arxiv.org/abs/2608.03999
  category: generation
  subcategory: symbolic
  abstract: 'Text-to-music language models begin with a choice usually made by default:
    how to tokenize music. Normally entangled with backbone, data, and recipe, its
    effect has never been measured in isolation. We fix pretrained Qwen3.5 (0.8B-27B),
    data, budget, and decoding, and swap only the representation across seven tokenizations,
    anchoring texture metrics to each representation''s model-free ceiling. The ordering
    is clean and surprising: representation, not model size, is the binding variable
    for distributional fidelity. Scaling the backbone 34x barely moves Frechet Music
    Distance (FMD), whereas switching representation halves it. PMT, a performance-resolution
    stream we release (10 ms timing, per-note velocity, multi-track texture; 609 symbols),
    reaches FMD 159 at 0.8B against 272-286 for beat grids (1.7-1.8x lower, up to
    2.8x elsewhere; non-overlapping bootstrap CIs), so a 0.8B performance-resolution
    model beats a 27B beat grid. It reappears on a 26M from-scratch backbone and a
    second performance-resolution tokenizer: a property of the class, not one lucky
    vocabulary. Nor is it a finer-lattice artifact: snapping PMT''s onsets to the
    beat grids'' resolution still leaves it 67-129 FMD ahead of both (n=500). The
    effect is distributional; whether it is audible is a separate question, left open
    by our probe, with a human study pre-registered. Native caption adherence is weak
    but separable: a lightweight decode-time constraint doubles instrument-F1 (.28
    to .60) and Correct-Key (.16 to .35) at no distributional cost. We release the
    harness, 25+ checkpoints, two corpora (86.6k aligned across caption/MIDI/ABC/audio;
    6.25M captioned, the largest for music), and an imprinting diagnostic: published
    text-to-MIDI systems reproduce their training distribution near-invariant to the
    caption (72% vs. 71% chord-time on disjoint domains). The field''s next representation
    claim can now be measured, not asserted.'
- title: 'Beyond Artifacts: Towards Generalizable Synthetic Song Detection via Music-Intrinsic
    Features'
  date: 2026-06
  url: https://arxiv.org/abs/2606.16612
  category: generation
  subcategory: audio
  abstract: The rapid advancement of AI music generators highlights the urgent need
    for reliable Synthetic Song Detection (SSD). Existing SSD methods often rely on
    low-level artifacts or fixed feature assumptions, struggling to capture generator-agnostic
    cues. To address this, we propose Sofia (Synthetic-song detection framework via
    music features), a flexible framework that models music-intrinsic attributes via
    feature-specific experts and an adaptive Mixture-of-Experts (MoE) module. By configuring
    Sofia with representative Vocal, Audio-effect, Global structure features, and
    their combinations, we present their individual and complementary contributions.
    To comprehensively evaluate our framework, we further construct MUSIC8K, a challenging
    benchmark featuring lastest emerging generators and realistic audio perturbations.
    Experiments show that Sofia learns generator-agnostic representations from music-intrinsic
    features, improving the F1 score by 18.5 points over the strongest baseline on
    MUSIC8K-O while maintaining strong robustness.
- title: 'MusicDET: Zero-Shot AI-Generated Music Detection'
  date: 2026-05
  url: https://arxiv.org/abs/2605.18072
  category: generation
  subcategory: audio
  abstract: Detecting AI-generated music is crucial for preserving artistic authenticity
    and preventing the misuse of generative music technologies. However, existing
    discriminative detectors typically rely on generated samples during training and
    often suffer from severe performance degradation when confronted with music produced
    by unseen generators, which limits their real-world applicability. To address
    this issue, we formulate a zero-shot setting for AI-generated music detection,
    where the detector is trained exclusively on real music without access to any
    generated samples. Under this setting, we propose MusicDET, a generator-agnostic
    detection framework based on frequency-guided normalizing flows that probabilistically
    models the distribution of real music features. By evaluating the likelihood of
    an input sample under the learned real-music distribution, MusicDET enables effective
    detection of out-of-distribution music signals. Experiments on the FakeMusicCaps
    and SONICS datasets show that MusicDET consistently outperforms conventional discriminative
    detectors, particularly when detecting music generated by previously unseen models.
- title: 'RIME: Enabling Large-Scale Agentic Music Post-Production'
  date: 2026-07
  url: https://arxiv.org/abs/2607.19605
  category: generation
  subcategory: agentic
  abstract: 'Almost every piece of recorded music you have ever heard was modified
    before it reached you; commercial releases rarely spring fully-formed from the
    mind of a musician. Despite the promise of music generation models for one-shot
    output, such fine-grained iterative refinement workflows are a complementary problem,
    and largely out of their reach. There is also a gap for musicians: while they
    can express what they want to hear, not all have the facility with studio production
    tools to implement the complex set of actions needed to realize these intuitions.
    We formalize this task as agentic post-production, wherein individual aspects
    of a song are targeted, refined, and combined into a final track. We argue the
    bottleneck is data: existing corpora do not reflect how realistic post-production
    chains map onto the vocabulary musicians and engineers actually use. We argue
    there is a language for modifying recorded music that is dense, consistent, and
    learnable. We introduce the Rule-based Instructions for Music Editing (RIME) framework,
    which generates realistic paired edit-instruction data from any baseline music
    dataset grounded in canonical methods, design patterns, and constraints derived
    from real production workflows. RIME leverages POEMS, a new toolkit that combines
    stem separation, mixing, and common studio effects for use by multimodal agents.
    We use RIME and POEMS to generate 3,000 pairs of edit instructions and ground
    truth audio, and use this data to evaluate existing multimodal LLMs as agents
    on this task, showing persistent challenges in current models'' post-production
    capabilities. We also demonstrate RIME''s ability to improve post-production agent
    performance via supervised fine-tuning. We see RIME as an early step toward iterative
    musical agents, collaborative systems that could transform music production much
    as interactive coding agents have reshaped software engineering.'
- title: 'Fourier is Frontier: Frequency-Aware Autoencoding for High-Fidelity Music
    Reconstruction'
  date: 2026-08
  url: https://arxiv.org/abs/2608.19843
  category: evaluation
  subcategory: audio
  abstract: 'Continuous-latent audio autoencoders form the backbone of latent music
    generators, yet decoders at high compression rates commonly exhibit three failure
    modes: high-frequency loss, phase incoherence, and stereo-image collapse. These
    share a structural root: waveform autoencoders lack an explicit frequency axis,
    leaving no handle for targeted per-band correction. Among five matched-budget
    representations, the complex STFT achieves the lowest full-band and high-frequency
    spectral distances, providing direct access to magnitude and phase at every bin.
    Building on this, we present ear-VAE2, a complex-spectral autoencoder with cross-channel
    interaction. Spec-SnakeBeta learns a periodic activation per frequency bin with
    frequency-dependent initialization, outperforming other activation variants while
    using fewer parameters than the fully independent variant. Duplex-Aware Refiner
    applies band-specific corrections to magnitude and phase following duplex theory
    of sound localization. On the 546-track Song Describer Dataset, ear-VAE2 achieves
    the best point estimates on five of seven reconstruction metrics. The Duplex-Aware
    Refiner reduces Mel Distance by 19.4% and uses ~45% fewer residual-output dimensions
    than the Unconstrained Refiner, while also lowering spectral distances, spatial-cue
    errors, and receiving higher ratings from professional engineers. The downstream
    generator using ear-VAE2 latents achieves better point estimates on all 12 automatic
    metrics.Demo page is available at https://eps-acoustic-revolution-lab.github.io/EAR_VAE2/.'
- title: 'Spacing Out: On the Reliability of Binaural Music Source Separation Metrics'
  date: 2026-07
  url: https://arxiv.org/abs/2607.25919
  category: analysis
  subcategory: symbolic
  abstract: Despite the rising popularity of immersive audio, binaural music remains
    underexplored in music information retrieval (MIR), particularly regarding the
    task of music source separation (MSS). While existing stereo MSS models can process
    binaural audio, they often degrade the spatial quality of the separated stems
    and undermine listener immersion. Through a perceptual study comparing binaural
    and stereo MSS outputs, we evaluate how well objective spatial distortion metrics
    correlate with human perception. Our findings reveal varied agreement between
    these metrics and human judgment, highlighting a lack of reliability when used
    to evaluate binaural music tasks. Specifically, we find that Interaural Time Difference
    (ITD) estimation is highly sensitive to noise and separation artifacts. In evaluating
    two alternative ITD estimation methods, we uncover a critical trade-off between
    robustness and accuracy, particularly for narrow-band instruments like bass. These
    results underscore the need for accurate, interpretable spatial metrics designed
    for binaural music to develop models that preserve source localization and listener
    immersion.
- title: 'MulTTiPop: A Multitrack Transcription Dataset for Pop Music'
  date: 2026-07
  url: https://arxiv.org/abs/2607.08756
  category: analysis
  subcategory: audio
  abstract: We present MulTTiPop, a dataset of pop music segments and their associated
    multitrack MIDI recordings for the evaluation of automatic music transcription
    models. MulTTiPop contains 572 segments of popular music totaling 3.5 hours of
    audio, and contains songs from diverse genres and decades from the 1930s to 2000s.
    To collect this dataset, we perform metadata-based matching on song segments from
    the Lakh MIDI and TheoryTab datasets, manually identify an anchor beat between
    the audio and MIDI, then use beat tracking on the audio and warp the MIDI to match
    its tempo and timing. We evaluate state-of-the-art automatic music transcription
    models on MulTTiPop and find substantial room for improvement, with the best model
    achieving 29% Onset F1. More details and sound examples of MulTTiPop are available
    at https://gclef-cmu.org/multtipop.
- title: 'Advancing Multi-Instrument Music Transcription: Results from the 2025 AMT
    Challenge'
  date: 2026-03
  url: https://arxiv.org/abs/2603.27528
  category: generation
  subcategory: audio
  abstract: 'This paper presents the results of the 2025 Automatic Music Transcription
    (AMT) Challenge, an online competition to benchmark progress in multi-instrument
    transcription. Eight teams submitted valid solutions; two outperformed the baseline
    MT3 model. The results highlight both advances in transcription accuracy and the
    remaining difficulties in handling polyphony and timbre variation. We conclude
    with directions for future challenges: broader genre coverage and stronger emphasis
    on instrument detection.'
- title: 'YMIR: A new Benchmark Dataset and Model for Arabic Yemeni Music Genre Classification
    Using Convolutional Neural Networks'
  date: 2026-04
  url: https://arxiv.org/abs/2604.05011
  category: analysis
  subcategory: audio
  abstract: 'Automatic music genre classification is a major task in music information
    retrieval; however, most current benchmarks and models have been developed primarily
    for Western music, leaving culturally specific traditions underrepresented. In
    this paper, we introduce the Yemeni Music Information Retrieval (YMIR) dataset,
    which contains 1,475 carefully selected audio clips covering five traditional
    Yemeni genres: Sanaani, Hadhrami, Lahji, Tihami, and Adeni. The dataset was labeled
    by five Yemeni music experts following a clear and structured protocol, resulting
    in strong inter-annotator agreement (Fleiss kappa = 0.85). We also propose the
    Yemeni Music Classification Model (YMCM), a convolutional neural network (CNN)-based
    system designed to classify music genres from time-frequency features. Using a
    consistent preprocessing pipeline, we perform a systematic comparison across six
    experimental groups and five different architectures, resulting in a total of
    30 experiments. Specifically, we evaluate several feature representations, including
    Mel-spectrograms, Chroma, FilterBank, and MFCCs with 13, 20, and 40 coefficients,
    and benchmark YMCM against standard models (AlexNet, VGG16, MobileNet, and a baseline
    CNN) under the same experimental conditions. The experimental findings reveal
    that YMCM is the most effective, achieving the highest accuracy of 98.8% with
    Mel-spectrogram features. The results also provide practical insights into the
    relationship between feature representation and model capacity. The findings establish
    YMIR as a useful benchmark and YMCM as a strong baseline for classifying Yemeni
    music genres.'
- title: Music Source Restoration with Ensemble Separation and Targeted Reconstruction
  date: 2026-03
  url: https://arxiv.org/abs/2603.16926
  category: evaluation
  subcategory: audio
  abstract: The Inaugural Music Source Restoration (MSR) Challenge targets the recovery
    of original, unprocessed stems from fully mixed and mastered music. Unlike conventional
    music source separation, MSR requires reversing complex production processes such
    as equalization, compression, reverberation, and other real-world degradations.
    To address MSR, we propose a two-stage system. First, an ensemble of pre-trained
    separation models produces preliminary source estimates. Then a set of pre-trained
    BSRNN-based restoration models performs targeted reconstruction to refine these
    estimates. On the official MSR benchmark, our system surpasses the baselines on
    all metrics, ranking second among all submissions. The code is available at https://github.com/xinghour/Music-source-restoration-CUPAudioGroup
- title: 'LabelBuddy: An Open Source Music and Audio Language Annotation Tagging Tool
    Using AI Assistance'
  date: 2026-03
  url: https://arxiv.org/abs/2603.04293
  category: analysis
  subcategory: multimodal
  abstract: The advancement of Machine learning (ML), Large Audio Language Models
    (LALMs), and autonomous AI agents in Music Information Retrieval (MIR) necessitates
    a shift from static tagging to rich, human-aligned representation learning. However,
    the scarcity of open-source infrastructure capable of capturing the subjective
    nuances of audio annotation remains a critical bottleneck. This paper introduces
    LabelBuddy, an open-source collaborative auto-tagging audio annotation tool designed
    to bridge the gap between human intent and machine understanding. Unlike static
    tools, it decouples the interface from inference via containerized backends, allowing
    users to plug in custom models for AI-assisted pre-annotation. We describe the
    system architecture, which supports multi-user consensus, containerized model
    isolation, and a roadmap for extending agents and LALMs. Code available at https://github.com/GiannisProkopiou/gsoc2022-Label-buddy.
- title: Aligning MusicLLM with Emotion using Instruction Tuning and Feedback-Driven
    Alignment
  date: 2026-06
  url: https://arxiv.org/abs/2606.24123
  category: analysis
  subcategory: agentic
  abstract: 'This paper investigates whether music large language models (MusicLLMs)
    can be aligned for emotion regression. While MusicLLMs have shown strong performance
    in music information retrieval tasks, their ability to predict arousal and valence
    scores remains limited, since emotion regression has not been an explicit training
    objective. To examine whether MusicLLMs can be aligned with emotion, we train
    MusicLLMs on emotion regression and compare two strategies: instruction tuning
    and feedback-driven alignment. Our experiments show that task-aware instruction
    tuning enables MusicLLMs to predict emotion levels to some extent, although the
    accuracy remains limited. Applying feedback-driven alignment with a verifiable
    numerical reward substantially improves performance on both arousal and valence
    over instruction tuning alone. We further show that our approach improves emotion
    regression performance while maintaining MusicQA capability.'
- title: Music Transcription with (Almost) No Supervision
  date: 2026-05
  url: https://arxiv.org/abs/2605.24193
  category: analysis
  subcategory: symbolic
  abstract: 'Competitive music transcription models require large amounts of paired
    audio-score data, which is scarce due to collection costs, alignment difficulty,
    and copyright restrictions. Meanwhile, vast quantities of unpaired audio recordings
    and symbolic scores are freely available but have gone unused. We adopt a cycle-consistent
    translation framework in which a small amount of paired data acts as a minimal
    anchor, unlocking the full potential of the unpaired pool. We find that: unpaired
    data yields surprisingly large gains, especially under limited supervision; unpaired
    audio contributes more than unpaired scores; incorporating unlabeled audio from
    a new instrument during training improves transcription for that instrument without
    any paired supervision. Together, these results suggest that scaling unpaired
    data offers a practical path toward high-quality transcription for instruments
    where labeled data remains scarce.'
- title: 'PolSeT: Polish Semantics of Timbre Dataset'
  date: 2026-06
  url: https://arxiv.org/abs/2606.19987
  category: analysis
  subcategory: audio
  abstract: This data report introduces PolSeT (Polish Semantic Timbre), a dataset
    designed to facilitate research in psychoacoustics and Music Information Retrieval
    (MIR) in Polish and cross-cultural contexts. The dataset contains data from two
    sequential experiments. Experiment 1 (N=60) was a free-verbalization task aimed
    at creating a lexicon of Polish semantic descriptors. Using 11 stimuli, a total
    of 1901 descriptors (701 unique) were gathered. Experiment 2 (N=105) utilized
    this lexicon to conduct a semantic differential study, where participants rated
    18 instrument sounds on 8 bipolar scales, with repeated trials for reliability
    analysis. The released dataset includes raw listener responses, comprehensive
    demographics (experience, gender, age), audio stimuli, and extracted acoustic
    features with Python extraction code. This dataset addresses a gap in open timbre
    research data, providing both the qualitative linguistic groundwork and the quantitative
    ratings necessary for psychoacoustic research and the training of multilingual
    semantic embedding models.
- title: 'CrowdioSet and PaRIRset: Two Datasets Towards Live Music Source Separation'
  date: 2026-07
  url: https://arxiv.org/abs/2607.27828
  category: evaluation
  subcategory: audio
  abstract: 'Most Music Source Separation (MSS) models do not generalize well to live
    music recordings because they are trained on studio recordings alone, disregarding
    the venue acoustics, the speaker system''s response and audience noise. We propose
    to bridge this gap by providing and training a model on two novel datasets. First,
    we present CrowdioSet: a noise dataset comprising 4800 real ambience tracks from
    Freesound and synthetic sing-alongs for the vocals in MUSDB18 and MOISESDB datasets,
    generated from zero-shot singing voice conversions. CrowdioSet enables effective
    audio denoising for live recordings, resulting in superior separation both in
    objective and subjective evaluations. Second, we introduce PaRIRset, a stereo
    impulse response dataset captured across 40 professional concert venues using
    a microphone array. Our results show that adding PaRIRset RIRs increases the performance
    of a MSS model compared to using real RIRs from Speech Enhancement tasks alone.
    We make the examples, code, model weights, PaRIRset, and CrowdioSet freely available
    to the public.'
- title: Singer-Informed Vocal Source Separation for Multi-Singer Music Mixtures
  date: 2026-08
  url: https://arxiv.org/abs/2608.14516
  category: analysis
  subcategory: audio
  abstract: Music source separation systems typically extract a single vocal track
    and do not distinguish between multiple singers. We study singer-informed vocal
    source separation for multi-singer mixtures. Our framework introduces a short
    enrollment recording of a target singer to guide separation through a learned
    embedding. The singer embedding is incorporated using feature concatenation or
    feature-wise linear modulation (FiLM), enabling the model to focus on the target
    singer while suppressing interference. We construct a duet dataset based on DAMP-VSEP
    with quality filtering and non-overlapping enrollment segments. Experiments on
    solo and duet settings show that while baseline models perform well for single-singer
    mixtures, the proposed method improves target-singer extraction in multi-singer
    cases, increasing target-singer SI-SDR from 0.33 dB to 5.58 dB. Fréchet Audio
    Distance (FAD) further shows improved perceptual quality and better alignment
    with target audio distributions. Code and checkpoints are available at https://github.com/jocelynxu01/singer-separation-paper.
- title: Computational Features for Symbolic Melody Analysis
  date: 2026-08
  url: https://arxiv.org/abs/2608.19061
  category: analysis
  subcategory: symbolic
  abstract: This paper addresses the general problem of extracting music-theoretic
    and psychological features from symbolically encoded melodies. We review existing
    melodic feature extraction toolboxes, enumerate their features, and organise them
    into a common taxonomy. We then describe a new software library that provides
    implementations of all of these features in a straightforward Python package.
    We then demonstrate the combined feature set on the Essen Folksong Collection,
    using the dataset to produce a series of style classification models. These models
    help us answer key questions about the interpretability and dimensionality of
    the feature set. Our results show excellent classification accuracy using the
    full feature set, and promising performance for an eight-dimensional factor-analytic
    solution that improves the interpretability of the classifier. We distribute our
    new toolbox as an open-source Python package, \mathtt{melody-features}, which
    can easily be used in various applications within music analysis, music psychology,
    and music information retrieval.
- title: 'SKY-Piano: A Multimodal Piano Performance Dataset'
  date: 2026-07
  url: https://arxiv.org/abs/2607.27296
  category: analysis
  subcategory: symbolic
  abstract: Music information retrieval research on piano performance increasingly
    involves diverse modalities of data and annotations beyond audio and MIDI. We
    present SKY-Piano, a multimodal piano performance dataset that includes 11 hours
    of performance recordings of motion, multi-view video, audio, MIDI from 7 professional
    and 12 amateur pianists along with MusicXML scores. The performance pieces were
    selected considering playing technique, difficulty, and performer expertise on
    a shared core repertoire. The motion data include both hand and body motion, released
    in both flagged form, where samples lost to marker occlusion are marked as unreliable,
    and imputed form, where those gaps are reconstructed, together with Visual3D body-segment
    kinematics and other time-synchronized modalities. To easily browse different
    modalities of data at a glance, we provide an interactive web browser. In addition,
    we developed a fingering annotation model and tool for deriving pseudo fingering
    annotations from the MIDI and motion data. Lastly, we present MIDI-to-motion generation
    through a fine-tuning experiment as a use case of the dataset.
- title: A Dual Evaluation for Music Transcription
  date: 2026-08
  url: https://arxiv.org/abs/2608.04511
  category: analysis
  subcategory: symbolic
  abstract: Automatic music transcription systems produce sheet music that can be
    read and played back. We argue that these two targets call for complementary evaluations
    of notation similarity to a reference score and playback similarity to the original
    performance, respectively. Our study considers notation similarity metrics from
    the optical music recognition literature and a wide range of playback-similarity
    methods validated through a listening study across over 100 participants and 230
    piano recordings covering 23 works, 30 performers, and six composers. We find,
    fortuitously, that the playback similarity metric that correlates best with human
    judgments, CLEWS, is also the cheapest to run. We also find that the two evaluation
    dimensions favor different systems among a collection of 24 pipelines formed by
    pairing eight audio-to-MIDI models with three MIDI-to-score converters, with the
    latter component systematically determining the favored objective. The complementarity
    between metrics also holds when adding to the pool Rubato, a new end-to-end system
    that offers substantially improved notation similarity while remaining competitive,
    though not the best, on playback similarity.
- title: Velocity Prediction in Automatic Guitar Transcription
  date: 2026-06
  url: https://arxiv.org/abs/2606.24912
  category: generation
  subcategory: symbolic
  abstract: Automatic Music Transcription (AMT) models have achieved a high level
    of success in polyphonic transcription of various instruments. Velocity, typically
    a measure of note intensity, is less commonly predicted in these models due to
    the absence of velocity labels in available datasets and lack of a proper definition
    for instruments other than piano. We present a methodology and model for velocity
    prediction in Automatic Guitar Transcription (AGT) which uses virtual instruments
    to generate synthetic training data with velocity labels. We first pretrain a
    model on this synthetic data. These weights are then transferred to a different
    model and trained on real guitar audio, allowing the model to retain the working
    velocity prediction while also achieving high performance and generalisability
    from the real training data. The velocity prediction is shown to outperform a
    baseline model which does not use the pretrained velocity weights, when evaluated
    on synthetic data. In addition, using the pretrained velocity weights offers a
    small improvement in note transcription, though the magnitude of this improvement
    is limited and not always significant depending on the testing data. Overall the
    model achieves results comparable to the state of the art in guitar transcription,
    while also successfully predicting velocity.
- title: 'Snapping Matters: Context-Aware Onset Refinement for Automatic Music Transcription'
  date: 2026-06
  url: https://arxiv.org/abs/2606.11903
  category: analysis
  subcategory: symbolic
  abstract: 'Precise note-level annotations are critical for training automatic music
    transcription (AMT) systems, in particular note-onset labels, which form a core
    component of many recent AMT systems. However, high-quality annotations for real-world
    recordings are scarce. Sequence-level score--audio alignment methods such as dynamic
    time warping provide only coarse correspondence, making a local refinement step
    necessary. This refinement step, known as snapping, adjusts aligned score onsets
    using peaks in a neural onset posteriorgram and often determines whether weakly
    aligned score--audio pairs become usable training data at all. Despite its practical
    importance, snapping is typically treated as a simple post-processing heuristic
    and implemented with greedy local decisions. We present a systematic analysis
    of snapping strategies for training instrument-agnostic transcribers, demonstrating
    that snapping is essential for learning from weakly aligned data. Building on
    this, we formulate snapping as a per-pitch assignment problem and solve it via
    bipartite graph matching, yielding context-aware onset decisions under overlapping
    refinement windows and uncertain initial alignments. Extensive cross-dataset experiments
    across piano, chamber, and orchestral recordings show improved onset alignment
    and transcription accuracy over greedy snapping, with gains increasing for wider
    snapping windows and coarser initial alignments. Qualitative examples are provided
    on our project page: https://abhirupsaha8.github.io'
- title: Score-Agnostic Structure Analysis in Large-Scale Performance Datasets
  date: 2026-05
  url: https://arxiv.org/abs/2605.25951
  category: analysis
  subcategory: symbolic
  abstract: 'In recent years, thanks to advances in automatic music transcription
    (AMT), several large-scale datasets of automatically transcribed piano solo music
    have been released. While these datasets undoubtedly offer extensive material
    for performance studies, they vary substantially in quality. In the case of classical
    music, performances often differ not only in expressive aspects such as tempo,
    but also in their structural interpretation of the score (including repeat patterns
    and edition-specific variants). To meaningfully use large-scale transcribed datasets
    for performance research, transcriptions of the same piece must be grouped according
    to their underlying structural realisation to support valid comparison. We address
    this by applying sequence-to-sequence alignment followed by hierarchical clustering:
    we create pairwise alignments for all pairs of transcriptions of a given piece,
    and use the alignment cost and (dis)similarity of performed sequence lengths to
    resolve structural mismatches as features for grouping. We propose this approach
    as a first step towards automatically evaluating large-scale transcribed datasets
    that lack ground-truth score and/or audio, shifting the evaluation criterion from
    truth-based accuracy to musical coherence and plausibility. We demonstrate our
    score-agnostic approach on around 1,500 transcriptions of 88 compositions from
    a recently published large-scale transcribed piano performance dataset.'
- title: 'Music Genre Classification: A Comparative Analysis of Classical Machine
    Learning and Deep Learning Approaches'
  date: 2026-03
  url: https://arxiv.org/abs/2603.15440
  category: analysis
  subcategory: audio
  abstract: Automatic music genre classification is a long-standing challenge in Music
    Information Retrieval (MIR); work on non-Western music traditions remains scarce.
    Nepali music encompasses culturally rich and acoustically diverse genres--from
    the call-and-response duets of Lok Dohori to the rhythmic poetry of Deuda and
    the distinctive melodies of Tamang Selo--that have not been addressed by existing
    classification systems. In this paper, we construct a novel dataset of approximately
    8,000 labeled 30-second audio clips spanning eight Nepali music genres and conduct
    a systematic comparison of nine classification models across two paradigms. Five
    classical machine learning classifiers (Logistic Regression, SVM, KNN, Random
    Forest, and XGBoost) are trained on 51 hand-crafted audio features extracted via
    Librosa, while four deep learning architectures (CNN, RNN, parallel CNN-RNN, and
    sequential CNN followed by RNN) operate on Mel spectrograms of dimension 640 x
    128. Our experiments reveal that the sequential Convolutional Recurrent Neural
    Network (CRNN)--in which convolutional layers feed into an LSTM--achieves the
    highest accuracy of 84%, substantially outperforming both the best classical models
    (Logistic Regression and XGBoost, both at 71%) and all other deep architectures.
    We provide per-class precision, recall, F1-score, confusion matrices, and ROC
    analysis for every model, and offer a culturally grounded interpretation of misclassification
    patterns that reflects genuine overlaps in Nepal's musical traditions.
- title: 'PianoCoRe: Combined and Refined Piano MIDI Dataset'
  date: 2026-05
  url: https://arxiv.org/abs/2605.06627
  category: analysis
  subcategory: symbolic
  abstract: 'Symbolic music datasets with matched scores and performances are essential
    for many music information retrieval (MIR) tasks. Yet, existing resources often
    cover a narrow range of composers, lack performance variety, omit note-level alignments,
    or use inconsistent naming formats. This work presents PianoCoRe, a large-scale
    piano MIDI dataset that unifies and refines major open-source piano corpora. The
    dataset contains 250,046 performances of 5,625 pieces written by 483 composers,
    totaling 21,763 h of performed music. PianoCoRe is released in tiered subsets
    to support different applications: from large-scale analysis and pre-training
    (PianoCoRe-C and deduplicated PianoCoRe-B) to expressive performance modeling
    with note-level score alignment (PianoCoRe-A/A*). The note-aligned subset, PianoCoRe-A,
    provides the largest open-source collection of 157,207 performances aligned to
    1,591 scores to date. In addition to the dataset, the contributions are: (1) a
    MIDI quality classifier for detecting corrupted and score-like transcriptions
    and (2) RAScoP, an alignment refinement pipeline that cleans temporal alignment
    errors and interpolates missing notes. The analysis shows that the refinement
    reduces temporal noise and eliminates tempo outliers. Moreover, an expressive
    performance rendering model trained on PianoCoRe demonstrates improved robustness
    to unseen pieces compared to models trained on raw or smaller datasets. PianoCoRe
    provides a ready-to-use foundation for the next generation of expressive piano
    performance research.'
- title: Embedding-Based Intrusive Evaluation Metrics for Musical Source Separation
    Using MERT Representations
  date: 2026-04
  url: https://arxiv.org/abs/2604.20270
  category: evaluation
  subcategory: audio
  abstract: 'Evaluation of musical source separation (MSS) has traditionally relied
    on Blind Source Separation Evaluation (BSS-Eval) metrics. However, recent work
    suggests that BSS-Eval metrics exhibit low correlation between metrics and perceptual
    audio quality ratings from a listening test, which is considered the gold standard
    evaluation method. As an alternative approach in singing voice separation, embedding-based
    intrusive metrics that leverage latent representations from large self-supervised
    audio models such as Music undERstanding with large-scale self-supervised Training
    (MERT) embeddings have been introduced. In this work, we analyze the correlation
    of perceptual audio quality ratings with two intrusive embedding-based metrics:
    a mean squared error (MSE) and an intrusive variant of the Fréchet Audio Distance
    (FAD) calculated on MERT embeddings. Experiments on two independent datasets show
    that these metrics correlate more strongly with perceptual audio quality ratings
    than traditional BSS-Eval metrics across all analyzed stem and model types.'
- title: 'The Costs of Reproducibility in Music Separation Research: a Replication
    of Band-Split RNN'
  date: 2026-03
  url: https://arxiv.org/abs/2603.09187
  category: generation
  subcategory: audio
  abstract: Music source separation is the task of isolating the instrumental tracks
    from a music song. Despite its spectacular recent progress, the trend towards
    more complex architectures and training protocols exacerbates reproducibility
    issues. The band-split recurrent neural networks (BSRNN) model is promising in
    this regard, since it yields close to state-of-the-art results on public datasets,
    and requires reasonable resources for training. Unfortunately, it is not straightforward
    to reproduce since its full code is not available. In this paper, we attempt to
    replicate BSRNN as closely as possible to the original paper through extensive
    experiments, which allows us to conduct a critical reflection on this reproducibility
    issue. Our contributions are three-fold. First, this study yields several insights
    on the model design and training pipeline, which sheds light on potential future
    improvements. In particular, since we were unsuccessful in reproducing the original
    results, we explore additional variants that ultimately yield an optimized BSRNN
    model, whose performance largely improves that of the original. Second, we discuss
    reproducibility issues from both methodological and practical perspectives. We
    notably underline how substantial time and energy costs could have been saved
    upon availability of the full pipeline. Third, our code and pre-trained models
    are released publicly to foster reproducible research. We hope that this study
    will contribute to spread awareness on the importance of reproducible research
    in the music separation community, and help promoting more transparent and sustainable
    practices.
- title: Taste-aware music retrieval from audio embeddings
  date: 2026-07
  url: https://arxiv.org/abs/2607.03296
  category: cognition
  subcategory: audio
  abstract: Crossmodal correspondences between sound and taste are well established
    in psychology and neuroscience, but largely absent from content-based multimedia
    retrieval. We formalise taste-from-audio prediction as a content-based music information
    retrieval benchmark over a perceptually validated multi-source corpus, comparing
    ten frozen audio encoders from the four HEAR families under a shared multi-task
    regression head, with gated late-fusion as a configurable variant. In order to
    assess the effectiveness of the models, we compute absolute error and rank correlation.
    The strongest systems predict the five tastes within a macro RMSE of 0.134; on
    held-out real music their error is less than half a single rater's deviation from
    the consensus (RMSE 0.13 vs. 0.28), so the model tracks the group consensus more
    closely than an average human rater, and well below the previous state of the
    art baseline (0.219). On absolute error the encoders are statistically flat, with
    a single VGGish matching the best fusion, but gated late-fusion's advantage is
    confined to rank correlation (macro Pearson r 0.724 vs. 0.666). Operationalised
    as a content-based retrieval index, the predicted taste space ranks a 309-item
    pool far more faithfully than a CLAP-text baseline, which sits at chance; ridge
    probes and an audio-bandstop knockout read the strongest representations against
    documented sound-taste correspondences.
- title: What Makes a Good Layer? Assessing the Layer-Wise Intrinsic Properties of
    Music Foundation Models
  date: 2026-08
  url: https://arxiv.org/abs/2608.14819
  category: analysis
  subcategory: symbolic
  abstract: Music foundation models are commonly used as frozen audio feature extractors,
    yet selecting which layer to extract from remains largely heuristic. Current practice
    defaults to fixed depths or multi-layer fusion, with limited understanding of
    why certain layers transfer better across downstream tasks or how representation
    quality varies with depth and pre-training paradigm. We conduct a systematic layer-wise
    analysis of 12 music foundation models spanning three pre-training paradigms (masked
    modeling, autoregressive modeling, and contrastive learning), characterizing their
    hidden representations through intrinsic geometric and transformation-based properties.
    Correlating label-free representation-quality metrics with layer-wise performance
    across 15 downstream tasks, we find that several metrics track layer quality for
    genre classification, emotion recognition, automatic tagging, and beat tracking,
    albeit with varying strength across tasks and pre-training paradigms. However,
    all metrics fail on tonal tasks such as key estimation and chord recognition,
    indicating that no single property serves as a general proxy for representation
    quality across music information retrieval tasks. To address this gap, we introduce
    a pitch-transposition equivariance measure that captures properties missed by
    these standard metrics, providing a consistent indicator of tonal quality across
    model families. Finally, we show that intrinsic metrics can serve as effective
    proxies for layer selection, matching or outperforming trainable multi-layer fusion
    methods, particularly in limited-data settings.
- title: Frequency-Aware Self-Supervised Music Representation Learning
  date: 2026-06
  url: https://arxiv.org/abs/2606.25713
  category: analysis
  subcategory: audio
  abstract: 'Self-supervised learning (SSL) has emerged as an essential paradigm for
    music information retrieval (MIR). While current SSL models achieve state-of-the-art
    performance across various MIR tasks, they typically treat audio as 1D sequences,
    either operating on time-domain waveforms or on flattened time-frequency-domain
    spectrograms. This discards the rich spatial and structural information in time-frequency
    representations and overlooks a fundamental intuition in music production. In
    particular, music is naturally represented as time-frequency grids in MIDI-based
    workflows, a structure that tightly corresponds to 2D spectrograms and inherently
    makes many MIR tasks trivial. Motivated by this intuition, we propose PupuJEPA,
    a visual Joint-Embedding Predictive Architecture (JEPA) that is trained directly
    on 2D spectrograms. Instead of applying masked language modeling (MLM) to 1D sequences,
    PupuJEPA learns robust representations by predicting the latent embeddings of
    masked 2D spectrogram patches from unmasked contexts. To optimally adapt such
    a visual framework to music signals, we also apply domain-specific modifications
    to model architecture, training scheme, and inference paradigm, with comprehensive
    ablation studies showing their effectiveness. Evaluations on the MARBLE benchmark
    show that PupuJEPA outperforms the 1D sequence-based SSL models across multiple
    MIR tasks in linear probing. Additionally, case studies of the attention maps
    also confirm that PupuJEPA captures musically meaningful patterns within the 2D
    time-frequency domain. Codes and checkpoints are available at: https://www.yichenggu.com/PupuJEPA/.'
- title: Precise and Simple Audio-to-Score Alignment
  date: 2026-05
  url: https://arxiv.org/abs/2605.20014
  category: analysis
  subcategory: symbolic
  abstract: Audio-to-score alignment is a long-standing challenge in music information
    retrieval and arguably the most widely applicable alignment task for music research.
    Alignment algorithms match two versions of a piece of music, and for this to work
    these versions need to be in comparable formats. Audio-to-audio alignment matches
    audio features; when matching audio files to scores, they must either synthesize
    the score or derive audio-like features by means of piano rolls or similar feature
    sequences. Symbolic alignment, by contrast, matches symbolically encoded notes;
    in an audio-to-score scenario these would be obtained by a transcription of the
    audio file. In this article, we present an algorithm that bridges audio-like and
    symbol-level features directly. Sequential audio features encoding onset and spectral
    activation are matched to score positions by a bespoke dynamic programming-based
    matching algorithm derived from symbolic alignment methods. The resulting method
    is both precise - surpassing widely used audio-to-audio approaches based on synthesized
    scores -, and remains flexible in its digital signal processing components, i.e.,
    the method is adaptable to diverse timbral characteristics without requiring a
    separate transcription model. Furthermore it inherits some of the symbolic alignment
    runtime advantages with an algorithmic complexity that is at worst linear in the
    length of the (typically short) symbolic score and (typically long) audio feature
    sequence. In the following sections, we provide a detailed algorithm description
    and evaluate its alignment quality on a large-scale dataset of solo piano recordings.
- title: Transformer-Based Rhythm Quantization of Performance MIDI Using Beat Annotations
  date: 2026-04
  url: https://arxiv.org/abs/2604.22290
  category: analysis
  subcategory: symbolic
  abstract: Rhythm transcription is a key subtask of notation-level Automatic Music
    Transcription (AMT). While deep learning models have been extensively used for
    detecting the metrical grid in audio and MIDI performances, beat-based rhythm
    quantization remains largely unexplored. In this work, we introduce a novel deep
    learning approach for quantizing MIDI performances using a priori beat information.
    Our method leverages the transformer architecture to effectively process synchronized
    score and performance data for training a quantization model. Key components of
    our approach include dataset preparation, a beat-based pre-quantization method
    to align performance and score times within a unified framework, and a MIDI tokenizer
    tailored for this task. We adapt a transformer model based on the T5 architecture
    to meet the specific requirements of rhythm quantization. The model is evaluated
    using a set of score-level metrics designed for objective assessment of quantization
    performance. Through systematic evaluation, we optimize both data representation
    and model architecture. Additionally, we apply performance and score augmentations,
    such as transposition, note deletion, and performance-side time jitter, to enhance
    the model's robustness. Finally, a qualitative analysis compares our model's quantization
    performance against state-of-the-art probabilistic and deep-learning models on
    various example pieces. Our model achieves an onset F1-score of 97.3% and a note
    value accuracy of 83.3% on the ASAP dataset. It generalizes well across time signatures,
    including those not seen during training, and produces readable score output.
    Fine-tuning on instrument-specific datasets further improves performance by capturing
    characteristic rhythmic and melodic patterns. This work contributes a robust and
    flexible framework for beat-based MIDI quantization using transformer models.
- title: 'Voices of Civilizations: A Multilingual QA Benchmark for Global Music Understanding'
  date: 2026-02
  url: https://arxiv.org/abs/2603.00533
  category: analysis
  subcategory: audio
  abstract: 'We introduce Voices of Civilizations, the first multilingual QA benchmark
    for evaluating audio LLMs'' cultural comprehension on full-length music recordings.
    Covering 380 tracks across 38 languages, our automated pipeline yields 1,190 multiple-choice
    questions through four stages - each followed by manual verification: 1) compiling
    a representative music list; 2) generating cultural-background documents for each
    sample in the music list via LLMs; 3) extracting key attributes from those documents;
    and 4) constructing multiple-choice questions probing language, region associations,
    mood, and thematic content. We evaluate models under four conditions and report
    per-language accuracy. Our findings demonstrate that even state-of-the-art audio
    LLMs struggle to capture subtle cultural nuances without rich textual context
    and exhibit systematic biases in interpreting music from different cultural traditions.
    The dataset is publicly available on Hugging Face to foster culturally inclusive
    music understanding research.'
- title: 'When the Same Musical Knowledge Forgets Differently: A Clean Probe of Pathway-Dependent
    Forgetting'
  date: 2026-06
  url: https://arxiv.org/abs/2606.15088
  category: analysis
  subcategory: multimodal
  abstract: 'A model can learn that the piano piece Für Elise is calm and reflective
    by listening to the audio or by reading a text description, but does it matter
    which route that knowledge took when it is later at risk of being forgotten? Forgetting
    research in multimodal models measures what knowledge is lost under adaptation,
    yet has not asked whether acquisition route affects how easily that knowledge
    is forgotten. We call this untested premise the Pathway-Invariant Assumption.
    Music understanding enables a clean test because a music clip and a canonical
    text description can be aligned to the same perceptual content, allowing the same
    knowledge unit to enter a model through listening or reading while the target
    remains fixed. Across multiple architecturally distinct audio-language models,
    we observe a consistent asymmetry: text-pathway knowledge is forgotten more than
    matched audio-pathway knowledge under identical adaptation pressure. To attribute
    this effect to route rather than confounds, we introduce the Paired Pathway Controlled
    Protocol (PPCP), a three-phase design that establishes matched pathway baselines,
    activates both pathways under symmetric supervision on the same knowledge pool,
    and applies identical forgetting pressure to both pathways. The gap is stable
    across models and gain-controlled analyses, persists when contradictory overwrite
    is replaced by correct-label cross-domain learning, remains under single-modality
    pressure, and is not removed by lightweight replay. Two independent routing-depth
    controls confirm that the effect is not explained by architectural depth, pointing
    to input representation as the dominant factor. Under PPCP, our results demonstrate
    that forgetting is highly route-dependent, establishing acquisition route as a
    new analytical dimension for forgetting research and multimodal system design.'
- title: 'MeloTune: On-Device Arousal Learning and Peer-to-Peer Mood Coupling for
    Proactive Music Curation'
  date: 2026-04
  url: https://arxiv.org/abs/2604.10815
  category: cognition
  subcategory: audio
  abstract: 'MeloTune is an iPhone-deployed music agent that instantiates the Mesh
    Memory Protocol (MMP) and Symbolic-Vector Attention Fusion (SVAF) as a production
    system for affect-aware music curation with peer-to-peer mood coupling. Each device
    runs two closed-form continuous-time (CfC) networks: a private listener-level
    CfC that predicts a short-horizon affective trajectory on Russell''s circumplex
    and drives proactive curation, and a shared mesh-runtime CfC at MMP Layer 6 that
    integrates Cognitive Memory Blocks (CMBs) from co-listening peers. CfC hidden
    states never cross the wire; only structured CMBs do. A Personal Arousal Function
    (PAF) replaces the standard linear mapping from audio intensity to psychological
    arousal with a per-listener learned adjustment, trained from behavioral signals
    (skip, completion, favorite, volume) and from drift between user-declared mood
    and machine inference. The same track receives different arousal predictions for
    different listeners. The model (94,552 parameters) achieves trajectory MAE 0.414,
    pattern accuracy 96.6%, and intent accuracy 69.4% on held-out validation. PAF
    evidence from a live deployment session (46 observations across 11 genres) demonstrates
    that the learning loop operates end-to-end, with pop reaching full confidence
    after 22 observations. All inference runs on-device via CoreML. To our knowledge,
    this is the first production deployment of MMP/SVAF on consumer mobile hardware.
    The accompanying SDK (sym-swift v0.3.78, SYMCore v0.3.7) enforces strict protocol
    conformance. Music is the case study; the substrate is the contribution.'
- title: 'JenBridge: Adaptive Long-Form Video Soundtracking across Scene Transitions'
  date: 2026-06
  url: https://arxiv.org/abs/2606.01703
  category: evaluation
  subcategory: multimodal
  abstract: 'We address the challenge of generating high-fidelity, long-form soundtracks
    that remain coherent across scene transitions. Existing AI music systems are mainly
    designed for short, isolated clips and lack mechanisms to ensure narrative continuity.
    We present JenBridge, a modular and interpretable framework for adaptive long-form
    video soundtracking that ensures both high-fidelity audio generation and transition
    naturalness. The core architecture is a Transformer-based generative model trained
    with a flow-matching objective, following a two-stage paradigm: pretraining on
    large-scale text-audio corpora to establish robust musical priors, then adapting
    to the video domain with dual text-visual conditioning for precise cross-modal
    alignment. Crucially, to achieve long-form coherence across diverse scene changes,
    JenBridge incorporates a novel adaptive transition mechanism. This system features
    a versatile toolkit of transition styles, including a generative transition method,
    and uniquely employs a Large Language Model (LLM) Agent that acts as a director
    to select the most appropriate transition for each narrative shift intelligently.
    To rigorously assess this task, we propose the LVS Benchmark, a new benchmark
    that includes a curated dataset and novel evaluation metrics focusing on holistic
    and transition-aware assessment. Extensive experiments on the proposed benchmark
    demonstrate that JenBridge significantly outperforms existing methods in both
    objective and subjective metrics, particularly in terms of transition naturalness
    and overall narrative coherence. JenBridge represents a significant step towards
    fully automated, professional-quality video soundtracking.'
- title: 'HumMusQA: A Human-written Music Understanding QA Benchmark Dataset'
  date: 2026-03
  url: https://arxiv.org/abs/2603.27877
  category: evaluation
  subcategory: audio
  abstract: The evaluation of music understanding in Large Audio-Language Models (LALMs)
    requires a rigorously defined benchmark that truly tests whether models can perceive
    and interpret music, a standard that current data methodologies frequently fail
    to meet. This paper introduces a meticulously structured approach to music evaluation,
    proposing a new dataset of 320 hand-written questions curated and validated by
    experts with musical training, arguing that such focused, manual curation is superior
    for probing complex audio comprehension. To demonstrate the use of the dataset,
    we benchmark six state-of-the-art LALMs and additionally test their robustness
    to uni-modal shortcuts.
- title: 'MusTBENCH: Benchmarking and Advancing Temporal Grounding in Music LLMs'
  date: 2026-05
  url: https://arxiv.org/abs/2605.29300
  category: analysis
  subcategory: multimodal
  abstract: Recent Large Audio-Language Models (LALMs) have demonstrated promising
    abilities in understanding musical content. However, whether their responses are
    grounded in the correct temporal regions of the audio remains underexplored. This
    limitation is particularly critical for music understanding, where key information
    often occurs as temporally localized events, such as instrument entries and rhythmic
    transitions. To address this gap, we introduce MusTBENCH, a music-expert-validated
    benchmark designed to evaluate temporal grounding in LALMs through five temporally
    grounded question-answering tasks. To further improve temporal grounding in existing
    models, we propose MusT, a novel four-stage temporal optimization recipe spanning
    music encoder adaptation, LLM adaptation, LLM supervised fine-tuning, and RL-based
    optimization. Experiments on MusTBENCH show that existing LALMs struggle with
    precise temporal grounding, while MusT brings significant improvements over strong
    baselines. These results establish temporal grounding as a key missing capability
    in current LALMs and position MusTBENCH as a challenging benchmark for future
    research in temporally grounded music understanding.
- title: 'Jamendo-MT-QA: A Benchmark for Multi-Track Comparative Music Question Answering'
  date: 2026-04
  url: https://arxiv.org/abs/2604.09721
  category: evaluation
  subcategory: multimodal
  abstract: 'Recent work on music question answering (Music-QA) has primarily focused
    on single-track understanding, where models answer questions about an individual
    audio clip using its tags, captions, or metadata. However, listeners often describe
    music in comparative terms, and existing benchmarks do not systematically evaluate
    reasoning across multiple tracks. Building on the Jamendo-QA dataset, we introduce
    Jamendo-MT-QA, a dataset and benchmark for multi-track comparative question answering.
    From Creative Commons-licensed tracks on Jamendo, we construct 36,519 comparative
    QA items over 12,173 track pairs, with each pair yielding three question types:
    yes/no, short-answer, and sentence-level questions. We describe an LLM-assisted
    pipeline for generating and filtering comparative questions, and benchmark representative
    audio-language models using both automatic metrics and LLM-as-a-Judge evaluation.'
- title: Audio-to-Score Transcription using Pre-trained Features, Data Augmentation,
    and the New SheetSage-A2S Dataset
  date: 2026-08
  url: https://arxiv.org/abs/2608.06165
  category: analysis
  subcategory: symbolic
  abstract: 'Existing audio-to-score (A2S) systems primarily focus on classical music,
    and the application to popular music remains underexplored. This paper first presents
    the new SheetSage-A2S Dataset, which includes 61 hours of audio with \texttt{**kern}
    score encodings for 9,468 clips originating from 6,066 unique songs, the first
    of its kind to facilitate A2S research for popular music. Additionally, we improve
    on existing A2S approaches by using data augmentation and MuQ, a pretrained feature-extraction
    model for music audio, to enhance generalisation abilities and extract meaningful
    audio features. Results show that the proposed A2S model achieves 4.98\% symbol
    error rate (SER) on the Quartets collection for classical music, which significantly
    outperforms the 15.3\% SER from the existing state-of-the-art \cite{alfaro-contrerasTransformer2024}.
    Additionally, our model achieves 20.92\% SER on the SheetSage-A2S dataset for
    popular music, serving as a strong benchmark for future research. The dataset,
    model, and code are made publicly available at: https://github.com/Multimodal-Music-Research-Lab/SheetSage2Kern_model.'
- title: 'Beyond Binary Instrument QA: Probing Instrument Grounding in Music Audio-Language
    Models'
  date: 2026-06
  url: https://arxiv.org/abs/2606.31338
  category: evaluation
  subcategory: multimodal
  abstract: 'Recent music audio-language models achieve high accuracy on instrument
    question-answering benchmarks, but it remains unclear whether this reflects robust
    audio grounding or benchmark-specific shortcuts. In this paper, we introduce an
    OpenMIC-derived diagnostic benchmark sequence for instrument grounding in music
    audio-language models, extending binary instrument-presence QA to genre-prior-reduced
    examples, confusable instrument discrimination, longer audio context, and temporal
    localization. Across these settings, high binary QA accuracy often fails to predict
    model behavior: models can exhibit option-position bias, confusable-instrument
    errors, and temporal response bias. These results suggest that instrument grounding
    should be evaluated with multi-axis diagnostic benchmarks rather than a single
    aggregate accuracy.'
- title: Low-Latency Neural Models for Real-Time Music Enhancement
  date: 2026-07
  url: https://arxiv.org/abs/2607.12872
  category: evaluation
  subcategory: audio
  abstract: 'Music recordings and live streams are often affected by noise, reverberation,
    spectral imbalances, or artifacts that degrade listening quality. While speech
    enhancement has matured into a well-defined research area, music enhancement is
    less established because musical signals combine overlapping sources, wide bandwidths,
    strong dynamics, and intentional production effects. We study real-time music
    enhancement under strict causal and low-latency constraints. We formulate the
    task around recovery of the intended produced mix from acoustic and production-oriented
    degradations, adapt compact causal networks to music, and compare speech-derived
    real-time baselines, an external music-denoising model, an offline restoration
    reference, and a music-specific MusicFilterNet-MS variant. On the tested hardware,
    all causal models run faster than real time, but improvements depend strongly
    on the dataset, degradation type, and metric family; under several objective criteria,
    indiscriminate enhancement can worsen the degraded input. The main contribution
    is therefore a benchmark and an analysis rather than a universal best model: real-time
    music enhancement is feasible, but robust improvement requires degradation-aware
    modeling, stereo-aware processing, identity-preserving correction, and evaluation
    beyond a single objective score.'
- title: 'GaMMA: Towards Joint Global-Temporal Music Understanding in Large Multimodal
    Models'
  date: 2026-05
  url: https://arxiv.org/abs/2605.00371
  category: evaluation
  subcategory: audio
  abstract: In this paper, we propose GaMMA, a state-of-the-art (SoTA) large multimodal
    model (LMM) designed to achieve comprehensive musical content understanding. GaMMA
    inherits the streamlined encoder-decoder design of LLaVA, enabling effective cross-modal
    learning between music and language. By incorporating audio encoders in a mixture-of-experts
    manner, GaMMA effectively unifies both time-series and non-time-series music understanding
    tasks within one set of parameters. Our approach combines carefully curated datasets
    at scale with a progressive training pipeline, effectively pushing the boundaries
    of music understanding via pretraining, supervised fine-tuning (SFT), and reinforcement
    learning (RL). To comprehensively assess both temporal and non-temporal capability
    of music LMMs, we introduce MusicBench, the largest music-oriented benchmark,
    comprising 3,739 human-curated multiple-choice questions covering diverse aspects
    of musical understanding. Extensive experiments demonstrate that GaMMA establishes
    new SoTA in the music domain, achieving 79.1% accuracy on MuchoMusic, 79.3% on
    MusicBench-Temporal, and 81.3% on MusicBench-Global, consistently outperforming
    previous methods.
- title: Unified Music Identification for Tracks and Versions
  date: 2026-08
  url: https://arxiv.org/abs/2608.19919
  category: evaluation
  subcategory: audio
  abstract: Given a music database, track identification (TI) retrieves the exact
    track matching an audio excerpt, whereas version identification (VI) retrieves
    its musical versions. Traditionally, the two tasks have been addressed separately.
    However, as every track is its own closest version, we investigate whether VI
    can subsume TI. This requires VI systems to be robust to both signal manipulation
    and audio degradation. We therefore propose a unified benchmark that evaluates
    accuracy and robustness on each task. Comparing seven existing models on this
    benchmark, we show that none of them are both accurate and robust on both tasks.
    We then train a baseline model targeting both tasks and show that a unified system
    is possible with 10 s TI queries. Lastly, we characterize the two retrieval constraints
    that limit our model's TI performance. We envision extending this unification
    to other music identification tasks.
- title: 'TinyMU: A Compact Audio-Language Model for Music Understanding'
  date: 2026-04
  url: https://arxiv.org/abs/2604.15849
  category: evaluation
  subcategory: agentic
  abstract: Music understanding and reasoning are central challenges in the Music
    Information Research field, with applications ranging from retrieval and recommendation
    to music agents and virtual assistants. Recent Large Audio-Language Models (LALMs)
    have shown remarkable progress in answering music-related questions by following
    user instructions. However, their massive scale, often billions of parameters,
    results in expensive training, slow inference, and limited deployability on edge
    devices. In this work, we present TinyMU, a lightweight (229M) Music-Language
    Model (MLM) that achieves performance comparable to much larger LALMs while remaining
    efficient and compact. To train TinyMU, we introduce MusicSkills-3.5M, a carefully
    curated, music-grounded question-answering dataset with 3.5M samples. Spanning
    multiple-choice, binary, and open-ended formats, this dataset provides fine-grained
    supervision across diverse musical concepts. For its architecture, TinyMU leverages
    MATPAC++, the SOTA self-supervised audio encoder for fine-grained feature extraction.
    Paired with a lightweight linear projector, it efficiently aligns audio embeddings
    with the language model. Through extensive evaluation, we show that TinyMU performs
    strongly in both basic music understanding and complex reasoning. Notably, on
    the MuChoMusic benchmark, it achieves 82\% of SOTA LALM's performance despite
    being 35x smaller, highlighting the potential of small MLMs under constrained
    computational budgets.
- title: 'MADB: A Large-Scale Music Aesthetics Dataset with Professional and Multi-Dimensional
    Annotations'
  date: 2026-07
  url: https://arxiv.org/abs/2607.06929
  category: analysis
  subcategory: multimodal
  abstract: 'Music aesthetic assessment is a challenging yet underexplored problem,
    requiring models to capture fine-grained, multi-dimensional human perceptual judgments.
    Progress in this area has been limited by the lack of large-scale datasets with
    structured aesthetic annotations. We introduce MADB, a large-scale dataset and
    benchmark comprising 9,999 tracks annotated by 30 trained annotators. Each track
    is rated by around 10 annotators across 10 perceptual dimensions and one overall
    score, with additional textual comments for multimodal analysis. We establish
    a unified evaluation framework over multiple pretrained models. Results reveal
    substantial gaps between model predictions and human judgments, exposing key limitations
    of current approaches. MADB provides a new benchmark for human-aligned music understanding.
    Project page: https://github.com/knownree/madb'
- title: 'HalluAudio: A Comprehensive Benchmark for Hallucination Detection in Large
    Audio-Language Models'
  date: 2026-04
  url: https://arxiv.org/abs/2604.19300
  category: evaluation
  subcategory: audio
  abstract: Large Audio-Language Models (LALMs) have recently achieved strong performance
    across various audio-centric tasks. However, hallucination, where models generate
    responses that are semantically incorrect or acoustically unsupported, remains
    largely underexplored in the audio domain. Existing hallucination benchmarks mainly
    focus on text or vision, while the few audio-oriented studies are limited in scale,
    modality coverage, and diagnostic depth. We therefore introduce HalluAudio, the
    first large-scale benchmark for evaluating hallucinations across speech, environmental
    sound, and music. HalluAudio comprises over 5K human-verified QA pairs and spans
    diverse task types, including binary judgments, multi-choice reasoning, attribute
    verification, and open-ended QA. To systematically induce hallucinations, we design
    adversarial prompts and mixed-audio conditions. Beyond accuracy, our evaluation
    protocol measures hallucination rate, yes/no bias, error-type analysis, and refusal
    rate, enabling a fine-grained analysis of LALM failure modes. We benchmark a broad
    range of open-source and proprietary models, providing the first large-scale comparison
    across speech, sound, and music. Our results reveal significant deficiencies in
    acoustic grounding, temporal reasoning, and music attribute understanding, underscoring
    the need for reliable and robust LALMs.
- title: 'UniVerse: Benchmarking and Enhancing LALMs on Culturally Inclusive Low-Resource
    Music Understanding'
  date: 2026-08
  url: https://arxiv.org/abs/2608.17852
  category: analysis
  subcategory: audio
  abstract: Recent advances in large audio-language models (LALMs) have significantly
    improved performance in tasks such as music captioning, genre classification,
    and sound event detection. However, limited attention has been paid to improving
    their adaptability across diverse musical traditions, particularly folk music
    rooted in distinct cultural contexts. Folk-music traditions are typically resource-scarce,
    unevenly represented across regions, and poorly documented. Even when such samples
    appear in large-scale pre-training, LALMs often fail to capture their structural
    and stylistic characteristics, partly due to the absence of dedicated evaluation
    protocols and training solutions. To address these limitations, we introduce UniVerse,
    a reproducible solution for low-resource music understanding. Specifically, we
    propose UniVerseBench, a benchmark of 5,042 Q&amp;A pairs across more than 38
    cultural and linguistic entities, constructed via an expert-guided yet highly
    automated pipeline. In parallel, we construct a fully automated, model-generated
    multi-turn dialogue training dataset UniVerseSet. By training LALMs on UniVerseSet,
    we systematically adapt and investigate representative multimodal imbalance learning
    strategies across both dense and Mixture-of-Experts (MoE) architectures. Experimental
    results indicate that fully automated data curation combined with imbalance-aware
    training yields non-trivial improvements, but models still struggle to capture
    fine-grained acoustic features, indicating a gap between surface-level alignment
    and deep musical comprehension.
- title: 'HAIM: Human-AI Music Datasets for AI Music Production Tracking Benchmark'
  date: 2026-06
  url: https://arxiv.org/abs/2606.01686
  category: evaluation
  subcategory: agentic
  abstract: 'As generative platforms such as Suno and Udio reach human-grade audio
    quality, the scope of AI''s utility has expanded across the entire music production
    workflow. Beyond simple track generation, these advancements have catalyzed the
    adoption of AI-driven methodologies in diverse forms. These include vocal synthesis,
    arrangement, and professional mastering. However, current detection research remains
    largely confined to a binary `AI-or-human'' paradigm. It fails to reflect the
    realities of contemporary music production workflows. In real-world production,
    AI tools are increasingly used to refine or master human-produced tracks, and
    human engineers likewise post-process AI-generated material to ensure professional
    quality. Moreover, users often employ adversarial tactics to bypass AI detectors,
    such as applying human mastering to AI-generated tracks. This creates a grey area
    that a simple binary classification fails to capture. In this paper, we define
    and investigate ``AI Music Tracking'''': the challenge of identifying specific
    AI integration across the multifaceted spectrum of music production. To this end,
    we introduce HAIM, a dataset with diverse labels for stages of music production.
    It is designed to isolate stages of AI intervention, including hybrid production
    and agent-level tracking. Our evaluation of state-of-the-art detectors reveals
    systemic flaws. By releasing HAIM, we propose a new benchmark that shifts the
    field beyond binary classification toward a granular, structured evaluation of
    AI music.'
- title: 'PARSA-Bench: A Comprehensive Persian Audio-Language Model Benchmark'
  date: 2026-03
  url: https://arxiv.org/abs/2603.14456
  category: analysis
  subcategory: audio
  abstract: 'Persian poses unique audio understanding challenges through its classical
    poetry, traditional music, and pervasive code-switching - none captured by existing
    benchmarks. We introduce PARSA-Bench (Persian Audio Reasoning and Speech Assessment
    Benchmark), the first benchmark for evaluating large audio-language models on
    Persian language and culture, comprising 16 tasks and over 8,000 samples across
    speech understanding, paralinguistic analysis, and cultural audio understanding.
    Ten tasks are newly introduced, including poetry meter and style detection, traditional
    Persian music understanding, and code-switching detection. Text-only baselines
    consistently outperform audio counterparts, suggesting models may not leverage
    audio-specific information beyond what transcription alone provides. Culturally-grounded
    tasks expose a qualitatively distinct failure mode: all models perform near random
    chance on vazn detection regardless of scale, suggesting prosodic perception remains
    beyond the reach of current models. The dataset is publicly available at https://huggingface.co/datasets/MohammadJRanjbar/PARSA-Bench'
- title: 'MMGenre: Benchmarking Singing Voice Synthesis across Multiple Musical Genres'
  date: 2026-07
  url: https://arxiv.org/abs/2607.06986
  category: evaluation
  subcategory: symbolic
  abstract: 'Singing voice synthesis (SVS) has progressed rapidly, yet its ability
    to generalize across diverse musical genres remains underexplored. Existing benchmarks
    are heavily biased toward pop music, limiting systematic analysis of genre-dependent
    behavior. We introduce MMGenre, a benchmark for multi-genre SVS diagnosis, supported
    by an automatic pipeline for constructing genre-aligned music scores. MMGenre
    spans 10 major genres and 26 subgenres, enabling comprehensive analysis of genre-aware
    synthesis. Extensive evaluation of representative SVS models reveals limited genre
    discrimination: synthesized vocals across genres exhibit highly similar acoustic
    characteristics and weak separability. While zero-shot genre adaptation yields
    only marginal improvements, lightweight genre-specific continued training leads
    to substantial gains. MMGenre provides a standardized framework for multi-genre
    SVS evaluation and exposes critical challenges in achieving genre-aware singing
    voice synthesis.'
- title: 'AudioCapBench: Quick Evaluation on Audio Captioning across Sound, Music,
    and Speech'
  date: 2026-02
  url: https://arxiv.org/abs/2602.23649
  category: evaluation
  subcategory: audio
  abstract: 'We introduce AudioCapBench, a benchmark for evaluating audio captioning
    capabilities of large multimodal models. \method covers three distinct audio domains,
    including environmental sound, music, and speech, with 1,000 curated evaluation
    samples drawn from established datasets. We evaluate 13 models across two providers
    (OpenAI, Google Gemini) using both reference-based metrics (METEOR, BLEU, ROUGE-L)
    and an LLM-as-Judge framework that scores predictions on three orthogonal dimensions:
    accuracy (semantic correctness), completeness (coverage of reference content),
    and hallucination (absence of fabricated content). Our results reveal that Gemini
    models generally outperform OpenAI models on overall captioning quality, with
    Gemini~3~Pro achieving the highest overall score (6.00/10), while OpenAI models
    exhibit lower hallucination rates. All models perform best on speech captioning
    and worst on music captioning. We release the benchmark as well as evaluation
    code to facilitate reproducible audio understanding research.'
- title: 'FIGMA: Towards FIne-Grained Music retrievAl'
  date: 2026-06
  url: https://arxiv.org/abs/2606.06615
  category: evaluation
  subcategory: symbolic
  abstract: 'Retrieving music using natural language descriptions has improved with
    contrastive audio-text models such as CLAP, but current systems remain limited
    to coarse semantic queries. When descriptions specify fine-grained musical attributes
    such as tempo, key, chord progression, or rhythmic structure, existing models
    often fail to retrieve the correct audio. We show that this limitation stems from
    the contrastive learning objective itself: despite being trained on long captions,
    CLAP-based models effectively utilize only the first few tokens, discarding much
    of the information encoded in detailed prompts. Then, we propose FIGMA (FIne-Grained
    Music RetrievAl), a multi-view contrastive architecture that addresses this limitation
    by jointly optimizing global audio-text alignment and frame-level, token-wise
    alignment. This design enables FIGMA to capture both high-level semantic context
    and fine-grained musical attributes within a unified representation space. Moreover,
    we formalize the task of Fine-Grained Music Retrieval and construct Fine-Grained
    Music Caption dataset (FGMCaps), a large-scale dataset of 380K music-caption pairs
    for training along with a 10K test set, both annotated with tempo, key, chord
    progression, beat count, as well as genre and mood. Extensive experiments demonstrate
    that FIGMA consistently outperforms existing CLAP-based music retrieval models
    across multiple music retrieval benchmarks, including out-of-domain evaluations,
    with relative improvements of up to 73.3%.'
- title: 'PitchBench: Measuring Pitch Hearing in Audio-Language Models'
  date: 2026-05
  url: https://arxiv.org/abs/2605.26176
  category: analysis
  subcategory: multimodal
  abstract: 'Audio-language models (ALMs) are increasingly used in real-world applications
    that require understanding music, from music tutoring and transcription to captioning,
    recommendation systems, and music production. More broadly, they are becoming
    an important component of multimodal AI systems that must reason from sensory
    input rather than text alone. This makes reliable musical perception a critical
    prerequisite: if a model cannot accurately hear the structure of sound, it cannot
    be trusted to reason about, teach, transcribe, or act on audio in the real world.
    Yet existing benchmarks rarely assess one of the most fundamental musical abilities
    underlying such perception: pitch hearing. Current evaluations tend to probe pitch
    hearing only indirectly, through higher-level tasks and often in multiple-choice
    formats, leaving open how reliably ALMs identify fine-grained pitch across instruments,
    acoustic conditions, and response formats. We introduce PitchBench, an evaluation
    suite that systematically measures pitch hearing in ALMs. PitchBench comprises
    28 experiments spanning absolute and relative pitch perception within sequences
    and chords, while varying loudness, note duration, sound source, time stretching,
    background noise, and other acoustic conditions. Tasks range from identifying
    individual pitches in isolation to tracking a melodic line within a four-part
    musical texture. Evaluating frontier ALMs, we find that pitch hearing remains
    highly unreliable: models perform consistently poorly across settings, with accuracy
    varying sharply by sound source, note duration, and notation format. Current ALMs
    do not yet possess stable pitch perception, even for controlled synthetic and
    instrumental stimuli. Alongside the benchmark, we release PitchBench as a Python
    package containing the evaluation data and data generation tools to support future
    work on pitch-aware audio-language modeling.'
- title: 'MMAG: A Multi-Control Mixed Audio Generation Benchmark'
  date: 2026-08
  url: https://arxiv.org/abs/2608.06900
  category: analysis
  subcategory: audio
  abstract: Recent audio generation systems have progressed from single-modality synthesis
    to generating complex acoustic scenes containing speech, music, and sound effects.
    Therefore, evaluating these models requires assessing multiple interacting capabilities,
    including semantic fidelity, speaker consistency, and temporal control, yet existing
    benchmarks focus on isolated domains or coarse-grained descriptions. To address
    this gap, we introduce the Multi-control Mixed Audio Generation (MMAG) benchmark.
    MMAG contains approximately 4,000 manually verified audio clips with rich annotations
    covering speech content, speaker identity, music attributes, sound events, and
    temporal relationships, together with dedicated subsets for voice cloning and
    timestamp-conditioned generation. We further propose a systematic evaluation protocol
    that measures acoustic fidelity, speech quality, semantic alignment, and temporal
    accuracy. Benchmarking representative agentic orchestrators, unified audio-visual
    generation models, and native mixed-audio generators reveals substantial performance
    trade-offs across these capabilities, with no existing model performing consistently
    well. Our results highlight the remaining challenges of controllable mixed audio
    generation and establish MMAG as a comprehensive benchmark for future research.
- title: Learning to Predict Performance-induced Emotion Differences in Classical
    Piano Music
  date: 2026-07
  url: https://arxiv.org/abs/2607.28876
  category: evaluation
  subcategory: symbolic
  abstract: Music is often used as a medium for communicating emotion, with performers
    shaping perceived affect through interpretation. This study addresses the challenge
    of identifying and predicting subtle changes in perceived emotion that are exclusively
    due to differences in performance. We focus on classical solo piano music, using
    a set of 6 commercial recordings of Bach's Well-Tempered Clavier Book I, annotated
    in terms of valence and arousal. By encoding the recordings through performance-specific
    features only, we isolate performance information from aspects of the composition
    itself, which tend to dominate the overall perceived emotional category. A preliminary
    analysis validates that these features vary meaningfully across performers. We
    then propose a relative regression framework, Delta-VA, to predict deviations
    in valence-arousal relative to an ``average'' performance, thereby focusing on
    the changes in emotion brought about by a specific way of playing a piece. In
    addition to the standard R^2 regression score, we introduce geometric evaluation
    metrics to assess the preservation of pairwise differences between performances.
    Results indicate high directional consistency with the ground truth, but also
    a compression in prediction magnitude, indicating that the model tends to underestimate
    expressive performance effects.
- title: 'Decomposer: Learning to Decompile Symbolic Music to Programs'
  date: 2026-07
  url: https://arxiv.org/abs/2607.01849
  category: evaluation
  subcategory: symbolic
  abstract: 'Musical performance involves executing a set of high-level musical instructions,
    yet recovering those instructions from the performance is a challenging inverse
    problem. We present Decomposer, a post-training framework for symbolic music decompilation:
    the task of recovering executable, editable music programs from symbolic music.
    We instantiate the task as MIDI-to-Strudel decompilation, where the model takes
    symbolic MIDI as input and produces a program in Strudel, a music programming
    language, that reconstructs the input when executed. The task poses two challenges:
    Strudel is a low-resource language with little naturally paired MIDI-code data,
    and optimizing faithful reconstruction of MIDI alone can collapse to unreadable
    note-by-note transliteration. We address these challenges in two stages. First,
    we construct Strudel-Synth, a synthetic corpus of paired Strudel programs and
    rendered MIDI, and use it for supervised fine-tuning. Second, we refine the model
    with reinforcement learning on unpaired MIDI, optimizing rewards for both MIDI
    reconstruction faithfulness and code readability. Our evaluation across synthetic
    and real-world MIDI benchmarks shows that Decomposer achieves substantially higher
    MIDI reconstruction faithfulness than closed-source LLMs while producing more
    readable and diverse code than the heuristic converter.'
- title: Unsupervised Evaluation of Deep Audio Embeddings for Music Structure Analysis
  date: 2026-03
  url: https://arxiv.org/abs/2603.27218
  category: analysis
  subcategory: audio
  abstract: Music Structure Analysis (MSA) aims to uncover the high-level organization
    of musical pieces. State-of-the-art methods are often based on supervised deep
    learning, but these methods are bottlenecked by the need for heavily annotated
    data and inherent structural ambiguities. In this paper, we propose an unsupervised
    evaluation of nine open-source, generic pre-trained deep audio models, on MSA.
    For each model, we extract barwise embeddings and segment them using three unsupervised
    segmentation algorithms (Foote's checkerboard kernels, spectral clustering, and
    Correlation Block-Matching (CBM)), focusing exclusively on boundary retrieval.
    Our results demonstrate that modern, generic deep embeddings generally outperform
    traditional spectrogram-based baselines, but not systematically. Furthermore,
    our unsupervised boundary estimation methodology generally yields stronger performance
    than recent linear probing baselines. Among the evaluated techniques, the CBM
    algorithm consistently emerges as the most effective downstream segmentation method.
    Finally, we highlight the artificial inflation of standard evaluation metrics
    and advocate for the systematic adoption of ``trimming'', or even ``double trimming''
    annotations to establish more rigorous MSA evaluation standards.
- title: 'Qwen-MusicAVQA-7B: A Multimodal Model for Music Audio-Visual QA'
  date: 2026-08
  url: https://arxiv.org/abs/2608.11329
  category: evaluation
  subcategory: multimodal
  abstract: 'A common approach to adding audio to a vision-language model is to train
    or adapt a large omni-modal system. We show that a lightweight alternative can
    be highly effective for music audio-visual question answering (AVQA). Qwen-MusicAVQA-7B
    connects a frozen Whisper encoder to Qwen2-VL-7B-Instruct through learned linear
    projections. The same frozen encoder processes both the video''s music track and
    a TTS-spoken question through separate projectors, while the language model fuses
    visual frames, music, and question audio through pretrained self-attention, with
    no task-specific fusion network. On MUSIC-AVQA, our system reaches 96.0% +/- 3.9%
    accuracy across three independent training seeds on the 7,402-question available-video
    test subset. Our central finding is that downstream accuracy tracks how much fine-grained
    local temporal information the audio representation preserves. In a matched 32-token
    comparison, a stride-pooled Whisper frame sequence outperforms a globally pooled
    PANNs representation expanded to the same budget by 26 percentage points, even
    though PANNs sees at least as much audio and uses a far larger projector. The
    effect is not simply sequence versus vector: within Whisper alone, reducing temporal
    resolution at a fixed token budget costs a comparable amount. Under matched data
    and inputs, fine-tuned Qwen2.5-Omni-7B reaches 80.9%, against 95.9% for our 30
    s variant; because the systems differ in backbone and adaptation, this is a system-level
    comparison. Accuracy remains high on sampled head and tail splits of the rephrased
    MUSIC-AVQA-R benchmark (96.5% and 95.6%). Because both encoders stay frozen and
    the music features are cached, the entire adaptation is cheap to train: the complete
    two-stage AVQA run takes approximately 5 hours on a single A100 80GB, and every
    run reported here fits on that one GPU.'
- title: 'Foley-Omni: A Unified Multimodal Generation Model from Task-Level Audio
    Synthesis to Complete Video Soundtrack Generation'
  date: 2026-06
  url: https://arxiv.org/abs/2606.03672
  category: evaluation
  subcategory: audio
  abstract: Recent unified audio generation models can support diverse tasks across
    speech, sound effects, and music, but most of them still focus on isolated task-level
    synthesis. However, real video production often requires multiple components of
    a complete audio track to be generated jointly and consistently for the same video.
    We present Foley-Omni, a unified multimodal audio generation model that extends
    isolated task-level synthesis to complete video soundtrack generation by jointly
    modeling speech, sound effects, and music within a shared latent generation process.
    To support training and reproducible evaluation, we develop an audiovisual data
    curation pipeline and introduce V2ST-Bench, a benchmark for holistic video soundtrack
    generation evaluation. Experiments show that Foley-Omni achieves competitive performance
    with expert systems on individual synthesis tasks, while improving speech intelligibility,
    audiovisual consistency and perceptual quality for mixed soundtrack generation.
- title: A Dataset and Benchmark for Optical Music Recognition of String Quartet Scores
  date: 2026-08
  url: https://arxiv.org/abs/2608.10978
  category: analysis
  subcategory: symbolic
  abstract: 'Optical music recognition (OMR) transcribes music scores into digital
    formats. While the field has advanced significantly on monophonic and piano-form
    scores, multi-part score transcription remains underexplored, largely due to the
    absence of a suitable dataset. We introduce OpenScore String Quartet for Optical
    Music Recognition (OSSQ-OMR), the first dataset dedicated to multi-part OMR. Built
    on the OpenScore String Quartet corpus, OSSQ-OMR pairs digitally encoded scores
    with their original scanned editions from IMSLP, with all images visually aligned
    to their transcriptions. The dataset is released with score images at system and
    staff levels, and paired transcriptions in three encoding formats: Extended Linearized
    MusicXML (LMXE), **kern, and ABC. In total, OSSQ-OMR contains 24,544 system images
    and 98,172 staff images drawn from 116 string quartet scores. We accompany the
    dataset with a benchmark protocol and baseline results from two representative
    OMR models, evaluated across four random score-level splits with mutually exclusive
    test sets. Baselines reach OMR-NED as low as 3.6% on synthetic and 5.9% on scanned
    inputs; results reveal substantial effects of encoding and segmentation choices,
    with the LSTM-based baseline degrading on scanned inputs roughly 2.6 times less
    than the Transformer-based baseline.'
- title: 'Towards Robust Version Identification in the Wild: A Dataset, Benchmark,
    and Fine-Tuning Study'
  date: 2026-08
  url: https://arxiv.org/abs/2608.04543
  category: generation
  subcategory: audio
  abstract: Existing datasets for musical version identification (VI) are primarily
    derived from curated metadata sources such as SecondHandSongs and Discogs, and
    are therefore dominated by professionally recorded tracks. This leads to a domain
    mismatch with real-world scenarios, where amateur and user-generated content is
    prevalent. To address this limitation, we introduce DiVers, a large-scale VI dataset
    comprising over 1.1 million musical versions, with train-validation-test splits
    compatible with established datasets such as Discogs-VI-YT, SHS100K, and Da-TACOS.
    In addition to standard version-level annotations, DiVers provides automatically
    assigned tags (e.g., instrumental, live) and segment-level predictions indicating
    the presence or absence of music. We evaluate the proposed dataset by training
    state-of-the-art VI systems. Our results show that models trained on DiVers achieve
    substantially improved robustness to acoustically diverse and noisy inputs, while
    maintaining a stable performance on cleaner, studio-quality benchmarks. We release
    the dataset metadata, code for its construction, and all experimental pipelines
    to support reproducibility.
- title: 'ONOTE: Benchmarking Omnimodal Notation Processing for Expert-level Music
    Intelligence'
  date: 2026-04
  url: https://arxiv.org/abs/2604.20719
  category: analysis
  subcategory: symbolic
  abstract: Omnimodal Notation Processing (ONP) represents a unique frontier for omnimodal
    AI due to the rigorous, multi-dimensional alignment required across auditory,
    visual, and symbolic domains. Current research remains fragmented, focusing on
    isolated transcription tasks that fail to bridge the gap between superficial pattern
    recognition and the underlying musical logic. This landscape is further complicated
    by severe notation biases toward Western staff and the inherent unreliability
    of "LLM-as-a-judge" metrics, which often mask structural reasoning failures with
    systemic hallucinations. To establish a more rigorous standard, we introduce ONOTE,
    a multi-format benchmark that utilizes a deterministic pipeline--grounded in canonical
    pitch projection--to eliminate subjective scoring biases across diverse notation
    systems. Our evaluation of leading omnimodal models exposes a fundamental disconnect
    between perceptual accuracy and music-theoretic comprehension, providing a necessary
    framework for diagnosing reasoning vulnerabilities in complex, rule-constrained
    domains.
- title: 'GLANCE: A Global-Local Coordination Multi-Agent Framework for Music-Grounded
    Non-Linear Video Editing'
  date: 2026-04
  url: https://arxiv.org/abs/2604.05076
  category: analysis
  subcategory: agentic
  abstract: 'Music-grounded mashup video creation is a challenging form of video non-linear
    editing, where a system must compose a coherent timeline from large collections
    of source videos while aligning with music rhythm, user intent, story completeness,
    and long-range structural constraints. Existing approaches typically rely on fixed
    pipelines or simplified retrieval-and-concatenation paradigms, limiting their
    ability to adapt to diverse prompts and heterogeneous source materials. In this
    paper, we present GLANCE, a global-local coordination multi-agent framework for
    music-grounded nonlinear video editing. GLANCE adopts a bi-loop architecture for
    better editing practice: an outer loop performs long-horizon planning and task-graph
    construction, and an inner loop adopts the "Observe-Think-Act-Verify" flow for
    segment-wise editing tasks and their refinements. To address the cross-segment
    and global conflict emerging after subtimelines composition, we introduce a dedicated
    global-local coordination mechanism with both preventive and corrective components,
    which includes a novelly designed context controller, conflict region decomposition
    module, and a bottom-up dynamic negotiation mechanism. To support rigorous evaluation,
    we construct MVEBench, a new benchmark that factorizes editing difficulty along
    task type, prompt specificity, and music length, and propose an agent-as-a-judge
    evaluation framework for scalable multi-dimensional assessment. Experimental results
    show that GLANCE consistently outperforms prior research baselines and open-source
    product baselines under the same backbone models. With GPT-4o-mini as the backbone,
    GLANCE improves over the strongest baseline by 33.2% and 15.6% on two task settings,
    respectively. Human evaluation further confirms the quality of the generated videos
    and validates the effectiveness of the proposed evaluation framework.'
- title: 'LiveBand: Live Accompaniment Generation in the Audio Domain'
  date: 2026-06
  url: https://arxiv.org/abs/2606.03803
  category: generation
  subcategory: audio
  abstract: We present LiveBand, a real-time system that generates high-fidelity music
    accompaniments to live audio input, respecting strict causal constraints. Our
    method trains a causal transformer generator in the continuous latent space of
    a pre-trained causal audio autoencoder, using adversarial sequence-level supervision
    from a discriminator. At each timestep, the generator receives only the causally
    available mix context and Gaussian noise, and predicts accompaniment latents without
    access to future mix frames or ground-truth target latents. Training is performed
    in a single parallel forward pass under causal masking, while streaming inference
    proceeds autoregressively with a rolling attention state. The model's training
    and inference computations are matched by design, eliminating teacher forcing
    and the associated exposure bias. On a multi-instrument music accompaniment benchmark,
    LiveBand improves over prior work on objective measures of audio quality, beat
    alignment, and mix adherence, while enabling real-time streaming generation without
    lookahead into the future on consumer hardware.
- title: 'From Prediction to Collaboration: Interactive Symbolic Music Analysis'
  date: 2026-07
  url: https://arxiv.org/abs/2607.13587
  category: analysis
  subcategory: symbolic
  abstract: Automatic symbolic music analysis has made substantial progress, yet existing
    systems are typically designed for a single mode of use, such as full-score prediction,
    and therefore do not match the broader range of operations that arise in analysis
    workflows, including partial completion, local correction, and iterative refinement.
    As a result, there remains a gap between strong benchmark models and systems that
    can support interactive analytical use. We present a unified framework for symbolic
    Roman-numeral (RN) analysis that narrows this gap by combining strong predictive
    performance with direct support for constrained completion and revision. The method
    is designed to provide a practical trade-off between accuracy and interactive
    responsiveness by computing expensive pretrained representations once and reusing
    them during iterative refinement, making powerful pretrained models more amenable
    to interactive settings. It supports complete score analysis, targeted revision
    of existing labels, and inference of missing annotations from partial context
    through a shared modeling framework. Experiments on Dilemmadata, the largest and
    most heterogeneous benchmark of its kind, show that the proposed approach is a
    strong RN-analysis baseline while also supporting masked completion from partial
    labels. Together with a prototype interface for multi-level candidate inspection
    and editing, these results position automatic RN analysis not only as a prediction
    problem, but also as a foundation for future interactive tools for music analysis.
- title: 'Comparative Validation of GPT-4o-mini and Teacher Mean Scores for Automated
    Scoring of Music Analysis Responses: Single-Pass Deployment, Repeatability, and
    Strategy-Specific Bias'
  date: 2026-08
  url: https://arxiv.org/abs/2608.01783
  category: generation
  subcategory: agentic
  abstract: 'Scoring open-ended music analysis responses is time-consuming and requires
    nuanced judgments of harmonic knowledge and formal understanding. This study evaluates
    the validity and repeatability of GPT-4o-mini for rubric-based scoring of music
    analysis essays, using teacher mean scores as the benchmark. A dataset of 300
    university-level student responses was scored by teachers on four dimensions:
    Harmony, Form, Reasoning, and Terminology. GPT-4o-mini scored the same responses
    using three prompting strategies: few-shot prompting with chain-of-thought reasoning
    (Fs+CoT), retrieval-augmented generation (RAG), and self-consistency based on
    five internal generations per administration (SC). Each strategy was administered
    three times with the model, prompt, rubric, and response held constant. Single-pass
    scores represented an operational scoring condition, whereas median aggregation
    across three runs was used to examine robustness. Agreement with teacher mean
    scores was evaluated using correlation, intraclass correlation, Krippendorff''s
    alpha, quadratic weighted kappa, and scoring error indices. Fs+CoT showed the
    strongest agreement with teacher mean scores in both single-pass scoring and median
    aggregation. RAG showed systematic over-scoring, whereas SC produced highly repeatable
    scores but weaker individual-level agreement. Dimension-level analyses showed
    that scoring performance varied across rubric components, with Terminology generally
    showing weaker agreement than Reasoning. These findings indicate that GPT-4o-mini
    can generate stable scores for complex music analysis responses, but prompting
    strategies produce distinct scoring profiles. Operational use therefore requires
    strategy-specific calibration, dimension-level validation, and continued human
    oversight.'
- title: Probing Token Spaces under Generator Shift in AI-Generated Music Detection
  date: 2026-06
  url: https://arxiv.org/abs/2606.08663
  category: evaluation
  subcategory: symbolic
  abstract: 'AI-generated music detectors can appear robust on standard benchmark
    splits, yet their deployments require transfer to generator sources absent during
    training. We study this problem with source-restricted evaluation on \textsc{MoM-open},
    an open reconstruction of MoM-CLAM that replaces the non-redistributable real
    corpus with FMA and MTG-Jamendo while preserving the fake-generator protocol.
    To isolate the role of representation, we introduce \textsc{CoMoE}, a compact
    fixed classifier for comparing heterogeneous audio token spaces while keeping
    the downstream architecture and training recipe unchanged. Experiments show that
    standard and real-source-restricted splits are nearly saturated, whereas fake-source
    restriction exposes large differences between token spaces: X-Codec tokens are
    strongest when training on Udio alone, while MERT-derived tokens are stronger
    when training on Suno-v3.5 alone. These results suggest that codec-style discrete
    token spaces should be treated as a primary experimental axis under generator
    shift in AI-generated music detection. Our code and data are available at https://github.com/MAAP-LAB/CoMoE.'
- title: 'AV-SyncBench: Decoupled Benchmarking of Temporal and Semantic Audio-Visual
    Synchronization'
  date: 2026-07
  url: https://arxiv.org/abs/2607.00726
  category: evaluation
  subcategory: audio
  abstract: 'Audio-visual feature extraction is a fundamental component of multimodal
    understanding and generation tasks. However, existing evaluation protocols for
    feature extraction models exhibit dimensional bias, typically focusing on either
    semantic matching or temporal offset detection. Moreover, their data construction
    remains coupled, preventing independent assessment of temporal and semantic consistency.
    We propose AV-SyncBench, the first benchmark to fully separate temporal and semantic
    evaluation for audio-visual synchronization. Built from in-the-wild videos, it
    spans Voice, Music, and Sound across 10 scenarios and 5 challenge tasks. Data
    are automatically filtered and manually verified to ensure on-screen sound sources.
    The benchmark contains 3,269 videos and 38,390 samples, and we evaluate five representative
    models to quantify feature quality for alignment and downstream tasks. The code
    and dataset are available at: https://fgt7t6g.github.io/AV-SyncBench.'
- title: Continuous Audio Thinking for Large Audio Language Models
  date: 2026-06
  url: https://arxiv.org/abs/2606.18273
  category: analysis
  subcategory: audio
  abstract: Large audio language models (LALMs) have shown impressive capabilities
    on diverse audio understanding tasks, ranging from speech transcription to music
    analysis. However, because LALMs are typically trained to produce text-aligned
    responses, their hidden states are progressively shaped for text generation rather
    than for preserving acoustic information. As a result, the diverse acoustic content
    that audio carries, such as phonetic detail, prosody, sound events, affect, and
    pitch, is lost along the way and difficult to leverage in the response. We introduce
    Continuous Audio Thinking (CoAT), a framework that equips audio language models
    with a continuous latent workspace for organizing acoustic information prior to
    response generation, grounded by distillation from audio experts. Within the thinking
    space, the model can utilize the rich acoustic information provided by expert
    distillation when generating its response. Furthermore, the proposed continuous
    thinking block can be processed in a single prefill, so CoAT does not require
    additional autoregressive decoding cost over the baseline. Across three LALMs,
    Qwen2-Audio, Qwen2.5-Omni-7B, and Audio Flamingo~3, performance gains on a broad
    benchmark suite spanning audio reasoning, audio understanding, music classification,
    speech emotion, and speech transcription demonstrate the effectiveness of CoAT.
    Further analysis confirms that the auxiliary supervision propagates from the thinking
    positions to the model's textual responses.
- title: 'ArtifactNet: Detecting AI-Generated Music via Forensic Residual Physics'
  date: 2026-04
  url: https://arxiv.org/abs/2604.16254
  category: evaluation
  subcategory: audio
  abstract: We present ArtifactNet, a lightweight framework that detects AI-generated
    music by reframing the problem as forensic physics -- extracting and analyzing
    the physical artifacts that neural audio codecs inevitably imprint on generated
    audio. A bounded-mask UNet (ArtifactUNet, 3.6M parameters) extracts codec residuals
    from magnitude spectrograms, which are then decomposed via HPSS into 7-channel
    forensic features for classification by a compact CNN (0.4M parameters; 4.0M total).
    We introduce ArtifactBench, a multi-generator evaluation benchmark comprising
    6,183 tracks (4,383 AI from 22 generators and 1,800 real from 6 diverse sources).
    Each track is tagged with bench_origin for fair zero-shot evaluation. On the unseen
    test partition (n=2,263), ArtifactNet achieves F1 = 0.9829 with FPR = 1.49%, compared
    to CLAM (F1 = 0.7576, FPR = 69.26%) and SpecTTTra (F1 = 0.7713, FPR = 19.43%)
    evaluated under identical conditions with published checkpoints. Codec-aware training
    (4-way WAV/MP3/AAC/Opus augmentation) further reduces cross-codec probability
    drift by 83% (Delta = 0.95 -&gt; 0.16), resolving the primary codec-invariance
    failure mode. These results establish forensic physics -- direct extraction of
    codec-level artifacts -- as a more generalizable and parameter-efficient paradigm
    for AI music detection than representation learning, using 49x fewer parameters
    than CLAM and 4.8x fewer than SpecTTTra.
- title: Dense-Sparse Dynamic Time Warping for Customizing Piano Concerto Accompaniments
  date: 2026-07
  url: https://arxiv.org/abs/2607.18189
  category: analysis
  subcategory: symbolic
  abstract: 'In this study, we explore how pianists can customize Music Minus One
    (MMO) concerto accompaniments to match their playing style. Bypassing the need
    for a symbolic score, often not available digitally, we use three types of audio
    data: solo piano recordings, MMO orchestra-only recordings, and mixed recordings
    of both piano and orchestra (e.g., from YouTube). The mixed recording serves as
    an intermediary reference to align the solo and orchestra parts, with only the
    orchestral part being adjusted through time-scale modification to synchronize
    with the user''s playing. The main challenge with estimating these alignments
    is the spectral mismatch between recordings containing different musical parts.
    Motivated by this application scenario, we introduce Dense-Sparse DTW, a variant
    of Dynamic Time Warping (DTW) that is designed to improve robustness of alignments
    to spectral mismatch by focusing on aligning a selected subset of audio frames
    containing prominent timing cues. We collect and annotate data from four piano
    concerto movements and establish a framework for generating and evaluating customized
    accompaniment recordings. On this benchmark, we show that Dense-Sparse DTW has
    better or comparable performance than more complex approaches based on source
    separation and spectral subtraction techniques.'
- title: Generalized Audio-Driven Synthesis of Precise Drummer Motion
  date: 2026-08
  url: https://arxiv.org/abs/2608.19055
  category: evaluation
  subcategory: symbolic
  abstract: 'Music-driven character animation enables and enhances transformative
    applications in entertainment and interactive education. However, synthesizing
    realistic drumming motion from audio remains challenging due to the inherent tension
    between high-acceleration dynamics and the need for extreme spatial-temporal precision.
    Existing approaches, often reliant on motion matching or MIDI input, struggle
    with generalizing to diverse real-world audio. Moreover, the field lacks standardized
    evaluation metrics capable of distinguishing precise drumming from noisy motion.
    In this paper, we introduce a generative diffusion framework featuring a dual-objective
    loss function that decouples skeletal integrity from drumstick precision, thus
    enabling centimeter-level stick precision without sacrificing natural body dynamics.
    Additionally, leveraging our own dataset and data augmentation strategy, the model
    generalizes to non-curated, in-the-wild audio. To rigorously evaluate performance,
    we propose two novel metrics: an impact-to-target distance to quantify spatial
    precision and an audio-motion correlation score to assess temporal alignment.
    Our quantitative analysis and user studies demonstrate that our system generates
    high-quality motion that is often indistinguishable from ground-truth performances.'
- title: A Diagnostic Evaluation Framework for AI-Generated Cover Songs Using Music-Theoretic
    and Acoustic Features
  date: 2026-07
  url: https://arxiv.org/abs/2607.19688
  category: generation
  subcategory: symbolic
  abstract: 'AI-generated covers often fail through local musical errors that a global
    quality score cannot locate: the vocal contour may remain recognizable while the
    accompaniment uses the wrong harmonic function, or the output may stay in key
    while the arrangement remains incomplete. We present a five-dimensional diagnostic
    framework covering melodic pitch, harmonic progression, key consistency, style
    consistency, and arrangement/production quality. The benchmark contains 30 covers
    generated from 5 source songs by 6 systems, with expert severity ratings and 9
    symbolic or acoustic features. Harmonic progression and arrangement had the highest
    severe-error rates (53% and 47%), whereas key consistency was better preserved.
    Six covers combined acceptable key consistency with severe harmonic errors. Large-leap
    ratio had a nominal association with melodic ratings (Spearman rho = -0.429, uncorrected
    p = 0.018), but no feature correlation survived the nine-test multiplicity reference.
    An interpretable percentile-rule pilot likewise failed to outperform a fixed majority
    baseline reliably across 16 dimension-level comparisons. The results separate
    useful diagnostic evidence from dependable automatic scoring: low-level and symbolic
    summaries can expose particular symptoms, but they do not replace context-aware
    musical judgment.'
- title: 'Evaluating Generalization and Robustness in Russian Anti-Spoofing: The RuASD
    Initiative'
  date: 2026-03
  url: https://arxiv.org/abs/2604.02374
  category: evaluation
  subcategory: audio
  abstract: RuASD (Russian AntiSpoofing Dataset) is a dedicated, reproducible benchmark
    for Russian-language speech anti-spoofing designed to evaluate both in-domain
    discrimination and robustness to deployment-style distribution shifts. It combines
    a large spoof subset synthesized using 37 modern Russian-capable TTS and voice-cloning
    systems with a bona fide subset curated from multiple heterogeneous open Russian
    speech corpora, enabling systematic evaluation across diverse data sources. To
    emulate typical dissemination and channel effects in a controlled and reproducible
    manner, RuASD includes configurable simulations of platform and transmission distortions,
    including room reverberation, additive noise/music, and a range of speech-codec
    transcodings implemented via a unified processing chain. We benchmark a diverse
    set of publicly available anti-spoofing countermeasures spanning lightweight supervised
    architectures, graph-attention models, SSL-based detectors, and large-scale pretrained
    systems, and report reference results on both clean and simulated conditions to
    characterize robustness under realistic perturbation pipelines. The dataset is
    publickly available at \href{https://huggingface.co/datasets/MTUCI/RuASD}{\underline{Hugging
    Face}} and \href{https://modelscope.cn/datasets/lab260/RuASD}{\underline{ModelScope}}.
- title: 'MUGEN: Evaluating and Improving Multi-audio Understanding of Large Audio-Language
    Models'
  date: 2026-03
  url: https://arxiv.org/abs/2603.09714
  category: analysis
  subcategory: audio
  abstract: While multi-audio understanding is critical for large audio-language models
    (LALMs), it remains underexplored. We introduce MUGEN, a comprehensive benchmark
    evaluating this capability across speech, general audio, and music. Our experiments
    reveal consistent weaknesses in multi-audio settings, and performance degrades
    sharply as the number of concurrent audio inputs increases, identifying input
    scaling as a fundamental bottleneck. We further investigate training-free strategies
    and observe that Audio-Permutational Self-Consistency, which diversifies the order
    of audio candidates, helps models form more robust aggregated predictions, yielding
    up to 6.28% accuracy gains. Combining this permutation strategy with Chain-of-Thought
    further improves performance to 6.74%. These results expose blind spots in current
    LALMs and provide a foundation for evaluating complex auditory comprehension.
- title: 'MiDashengLM-Gen: Unified Audio Scene Generation via LLM-Driven Autoregressive
    Flow Matching'
  date: 2026-08
  url: https://arxiv.org/abs/2608.11804
  category: generation
  subcategory: audio
  abstract: Generating coherent audio scenes that simultaneously blend speech, music,
    and sound effects remains a significant challenge. Current approaches typically
    rely on a disjointed pipeline where a frozen, decoupled text encoder feeds a separate
    audio decoder, limiting cross-modal optimization and leading to poor speech intelligibility.
    To overcome these limitations, we introduce MiDashengLM-Gen, an end-to-end framework
    that couples a pre-trained Large Language Model (LLM) with per-token conditional
    flow matching for autoregressive, variable-length mixed-audio scene generation.
    MiDashengLM-Gen represents a first approach for general text-to-audio generation
    with one end-to-end trained model. Empirical evaluations demonstrate that MiDashengLM-Gen
    drastically improves speech intelligibility over existing unified models. On the
    Seed-TTS benchmark, English Word Error Rate (WER) drops from 12.15% to 2.79%,
    approaching the performance of dedicated Text-to-Speech (TTS) systems (1.24%).
    Furthermore, the framework extends effectively to multilingual settings, yielding
    highly competitive multilingual WERs compared to existing baselines. Lastly, the
    model maintains competitive mixed-audio generation quality on the MECAT benchmark.
    Code and checkpoints are available at https://github.com/xiaomi-research/midashenglm-gen
    and https://huggingface.co/mispeech/midashenglm-gen, and the demo page is available
    at https://xingws.github.io/midashenglm-gen-demo/.
- title: 'AT-ADD: All-Type Audio Deepfake Detection Challenge Evaluation Plan'
  date: 2026-04
  url: https://arxiv.org/abs/2604.08184
  category: evaluation
  subcategory: audio
  abstract: 'The rapid advancement of Audio Large Language Models (ALLMs) has enabled
    cost-effective, high-fidelity generation and manipulation of both speech and non-speech
    audio, including sound effects, singing voices, and music. While these capabilities
    foster creativity and content production, they also introduce significant security
    and trust challenges, as realistic audio deepfakes can now be generated and disseminated
    at scale. Existing audio deepfake detection (ADD) countermeasures (CMs) and benchmarks,
    however, remain largely speech-centric, often relying on speech-specific artifacts
    and exhibiting limited robustness to real-world distortions, as well as restricted
    generalization to heterogeneous audio types and emerging spoofing techniques.
    To address these gaps, we propose the All-Type Audio Deepfake Detection (AT-ADD)
    Grand Challenge for ACM Multimedia 2026, designed to bridge controlled academic
    evaluation with practical multimedia forensics. AT-ADD comprises two tracks: (1)
    Robust Speech Deepfake Detection, which evaluates detectors under real-world scenarios
    and against unseen, state-of-the-art speech generation methods; and (2) All-Type
    Audio Deepfake Detection, which extends detection beyond speech to diverse, unknown
    audio types and promotes type-agnostic generalization across speech, sound, singing,
    and music. By providing standardized datasets, rigorous evaluation protocols,
    and reproducible baselines, AT-ADD aims to accelerate the development of robust
    and generalizable audio forensic technologies, supporting secure communication,
    reliable media verification, and responsible governance in an era of pervasive
    synthetic audio.'
- title: 'CODA: Cascaded Online Discontinuity-Aware Alignment for Real-Time Image-Based
    Score Following'
  date: 2026-07
  url: https://arxiv.org/abs/2607.21899
  category: analysis
  subcategory: symbolic
  abstract: 'Real-time score following from sheet images remains chal- lenging because
    the model must process streaming au- dio while resolving highly repetitive visual
    patterns un- der strict latency constraints. Recent image-based meth- ods have
    attempted to use multi-resolution prediction by simultaneously predicting the
    positions of the active sys- tem, bar, and note. However, their predictions across
    these different levels of notation are independent, which makes the predictions
    unstable and introduces unnecessary ex- tra search space for bar- and note-level
    predictions. Most existing methods also lack mechanisms to recover from score
    discontinuities, such as repeats, da capo (D.C.), or coda jumps. This paper proposes
    CODA, to the best of our knowledge, the first real-time score following system
    that addresses both gaps. CODA explicitly exploits the cascaded structure of music
    scores: it first selects the ac- tive system, then the active bar within it, and
    finally the active note within the selected bar. This enforces pre- diction consistency
    across resolutions. A silence-driven break mode enables recovery from arbitrary
    score discon- tinuities without requiring knowledge of the repeat struc- ture.
    Evaluated on the Multimodal Sheet Music Dataset (MSMD) piano benchmarks, CODA
    achieves state-of-the- art tracking accuracy and discontinuity-recovery perfor-
    mance under real-time throughput. Code is available at https://github.com/ValleyC/CODA.'
- title: 'DirectAudioEdit: Inversion-Free Text-Guided Audio Editing via Diffusion
    Prediction Contrast'
  date: 2026-06
  url: https://arxiv.org/abs/2606.07356
  category: evaluation
  subcategory: audio
  abstract: Text-guided audio editing aims to modify the language-specified acoustic
    content while preserving edit-irrelevant source components. Existing training-free
    methods typically rely on inversion-based editing. While inversion-free editing
    is appealing as it decreases computational overhead and reconstruction errors,
    it remains largely unexplored for audio editing. The key challenge is to construct
    a source-to-target editing path through diffusion denoising dynamics. In this
    paper, we introduce DirectAudioEdit, the first attempt to develop a training-free
    and inversion-free method for audio editing. Experiments on music and event-level
    benchmarks across two backbones show that DirectAudioEdit reduces macro-averaged
    FAD and KL by 15.9% and 15.8% compared with DDPM inversion, while achieving up
    to 64.5% editing speedup.
- title: 'VidAudio-Bench: Benchmarking V2A and VT2A Generation across Four Audio Categories'
  date: 2026-04
  url: https://arxiv.org/abs/2604.10542
  category: evaluation
  subcategory: audio
  abstract: 'Video-to-Audio (V2A) generation is essential for immersive multimedia
    experiences, yet its evaluation remains underexplored. Existing benchmarks typically
    assess diverse audio types under a unified protocol, overlooking the fine-grained
    requirements of distinct audio categories. To address this gap, we propose VidAudio-Bench,
    a multi-task benchmark for V2A evaluation with four key features: (1) Broad Coverage:
    It encompasses four representative audio categories - sound effects, music, speech,
    and singing - under both V2A and Video-Text-to-Audio (VT2A) settings. (2) Extensive
    Evaluation: It comprises 1,634 video-text pairs and benchmarks 11 state-of-the-art
    generation models. (3) Comprehensive Metrics: It introduces 13 task-specific,
    reference-free metrics to systematically assess audio quality, video-audio consistency,
    and text-audio consistency. (4) Human Alignment: It validates all metrics through
    subjective studies, demonstrating strong consistency with human preferences. Experimental
    results reveal that current V2A models perform poorly in speech and singing compared
    to sound effects. Our VT2A results further highlight a fundamental tension between
    instruction following and visually grounded generation: stronger visual conditioning
    improves video-audio alignment, but often at the cost of generating the intended
    audio category. These findings establish VidAudio-Bench as a comprehensive and
    scalable framework for diagnosing V2A systems and provide new insights into multimodal
    audio generation.'
- title: 'AnyAudio-Judge: A Dynamic Rubric-Based Benchmark and Evaluator for Audio
    Instruction Following'
  date: 2026-06
  url: https://arxiv.org/abs/2606.03116
  category: evaluation
  subcategory: audio
  abstract: The rapid advancement of instruction-guided audio generation has highlighted
    the critical need for robust alignment evaluation. Current automated evaluation
    methods heavily rely on holistic scoring from general-purpose large language models,
    which struggle to decouple complex instructions, lack interpretability, and fail
    to capture fine-grained attribute mismatches. To address this, we introduce a
    novel dynamic rubric-based evaluation paradigm that adaptively decomposes complex
    audio captions into a variable number of independent, verifiable binary rubric
    items. To rigorously benchmark this capability, we propose the AnyAudio-Judge
    Bench, a comprehensive, bilingual benchmark comprising 7,920 meticulously curated
    samples across four diverse audio domains (speech, sound, music, and mixed), featuring
    deliberately constructed hard negatives. Furthermore, we construct a large-scale
    corpus of 105K samples with explicit Chain-of-Thought (CoT) rationales to train
    our dedicated evaluator, the AnyAudio-Judge model. By employing a training pipeline
    that combines Supervised Fine-Tuning (SFT) and Group Relative Policy Optimization
    (GRPO), our model successfully aligns its reasoning paths with the rubric-based
    scoring mechanism. Extensive experiments demonstrate that AnyAudio-Judge not only
    significantly enhances zero-shot alignment detection compared to state-of-the-art
    baselines, but also provides precise and interpretable reward signals that substantially
    improve instruction alignment in downstream reinforcement learning for audio generation.
- title: 'AudioDER: A Deduplication-Enhanced Reasoning Dataset for Post-Training Large
    Audio-Language Models'
  date: 2026-06
  url: https://arxiv.org/abs/2606.14591
  category: analysis
  subcategory: audio
  abstract: Recent advances in pretrained large audio-language models (LALMs) have
    demonstrated strong capabilities across speech, sound, and music. To adapt these
    models to downstream tasks without the cost of pretraining from scratch, post-training
    has become a widely adopted paradigm. However, the effectiveness of post-training
    depends critically on the quality of the training corpus. We observe that existing
    post-training corpora, often constructed by aggregating public audio datasets,
    suffer from substantial acoustic redundancy, as many of these datasets are sourced
    from overlapping media platforms. Such redundancy leads to repeated exposure to
    similar acoustic patterns, causing diminishing returns in performance despite
    increased data volume. address this issue, we propose a three-stage data construction
    pipeline that performs acoustic redundancy filtering, converts retained samples
    into a unified multiple-choice question-answering format with chain-of-thought
    generation, and finally applies quality verification and filtering. Using this
    pipeline, we construct AudioRE, a post-training dataset of approximately 286k
    instances spanning sound, speech, and music. Supervised fine-tuning on AudioRE
    consistently improves the performance of Qwen2-Audio-7B-Instruct across diverse
    audio understanding and reasoning benchmarks, outperforming models trained on
    the unfiltered raw corpus with substantially more instances. These results validate
    the effectiveness of our redundancy-aware data construction pipeline and the resulting
    AudioRE dataset, and further highlight the importance of minimizing acoustic redundancy
    in audio-language post-training. To facilitate future research, we will release
    both the AudioRE and the fine-tuned Qwen2-AudioRE checkpoint.
- title: 'SpectCount: Spectrotemporal Counting via Synthetic Signals Improves Large
    Audio Language Models'
  date: 2026-06
  url: https://arxiv.org/abs/2606.06907
  category: analysis
  subcategory: audio
  abstract: Large audio language models (LALMs) extend large language models with
    an audio encoder and large-scale audio data. However, the scarcity of high-quality
    annotated audio data remains a fundamental bottleneck for scaling. Through probing
    signal detectability analysis, we identify fine-grained spectrotemporal perceptual
    weaknesses in a foundation LALM. To address these challenges, we propose Spectrotemporal
    Counting (SpectCount), a data-efficient fine-tuning approach based on fully synthetic
    audio signals generated on-the-fly, without relying on real-world audio, annotations,
    or pretrained generative models. SpectCount not only resolves the observed weaknesses
    but also improves performance on diverse auditory benchmarks spanning sound, music,
    and speech, unseen during fine-tuning. These results suggest that weakness-targeted
    synthetic signals provide a data-efficient path toward enhanced auditory understanding
    capabilities in LALMs.
- title: 'MixFake: Benchmarking and Enhancing Audio Deepfake Detection in Diverse
    Real-world Mixed Audio'
  date: 2026-05
  url: https://arxiv.org/abs/2605.23201
  category: evaluation
  subcategory: audio
  abstract: Speech deepfake detection has achieved remarkable success in clean environments
    but faces significant challenges in complex, real-world scenarios where speech
    is often mixed with background music or noise. Current state-of-the-art methods
    rely on semantic features from self-supervised learning (SSL) models, which often
    fail when processing non-speech or mixed-source audio. In this paper, we first
    introduce MixFake, a large-scale benchmark dataset designed to simulate diverse
    acoustic environments with varying SNR levels and mixed authenticity components.
    To address the "semantic-centric" limitation, we propose a Multi-stream Prompt
    Tuning framework that injects signal-level priors into SSL backbones. By integrating
    base, frequency, and texture streams through deep prompt injection, our model
    effectively captures acoustic artifacts. Experimental results demonstrate that
    our method significantly outperforms existing baselines, achieving a 0.95% EER
    in foreground detection and a substantial 7.72% absolute improvement in complex
    background detection tasks. Our dataset and code are available at https://github.com/saltfish233/MixFake.
- title: Benchmarking Language Modeling for Lossless Compression of Full-Fidelity
    Audio
  date: 2026-03
  url: https://arxiv.org/abs/2603.08683
  category: generation
  subcategory: audio
  abstract: Autoregressive "language" models (LMs) trained on raw waveforms can be
    repurposed for lossless audio compression, but prior work is limited to 8-bit
    audio, leaving open whether such approaches work for practical settings (16/24-bit)
    and can compete with existing codecs. We benchmark LM-based compression on full-fidelity
    audio across diverse domains (music, speech, bioacoustics), sampling rates (16kHz-48kHz),
    and bit depths (8, 16, 24-bit). Standard sample-level tokenization becomes intractable
    at higher bit depths due to vocabulary size (65K for 16-bit; 16.7M for 24-bit).
    We propose Trilobyte, a byte-level tokenization schema for full resolution audio,
    improving vocabulary scaling from O(2^{b}) to O(1) and enabling the first tractable
    24-bit LM-based lossless compression. While LMs consistently outperform FLAC and
    yield state-of-the-art compression at 8-bit and 16-bit, we observe that compression
    gains become more modest as bit depth increases beyond 8-bit.
- title: 'SonicWeave: Chunk-Routed Mixture-of-Experts for Unified Audio Scene Generation'
  date: 2026-08
  url: https://arxiv.org/abs/2608.09571
  category: generation
  subcategory: audio
  abstract: 'Text-conditioned general audio generation is moving beyond isolated speech,
    music, and sound-effect synthesis toward a single model that can compose them
    into controllable, coherent audio scenes. This unified setting is particularly
    challenging: heterogeneous components impose conflicting structural requirements
    on a shared backbone, while a complex mixed scene may contain locally distinct
    or overlapping content that demands fine-grained adaptation within the same clip.
    Existing audio mixture-of-experts (MoEs) mainly route at the domain level, while
    token-wise routing overlooks the local continuity inherent to acoustic signals.
    We propose SonicWeave, a flow-matching model for unified audio scene generation.
    At its core is a chunk-routed MoE with a conflict-gated prior-evidence routing
    mechanism (CPE-MoE). CPE-MoE routes contiguous acoustic chunks by combining a
    global prior that encodes the structured text condition and diffusion phase with
    local evidence from the evolving acoustic state. A learned conflict gate favors
    the prior when local states are unreliable, while allowing local evidence to influence
    routing when a region departs from the global scene context. SonicWeave supports
    speech, music, sound effects, singing, and their fine-grained mixtures with a
    single set of weights. Across TTS, TTA, and TTM benchmarks, SonicWeave consistently
    improves over controlled Dense and Base-MoE baselines. Complex-scene evaluation
    further demonstrates improved compositional quality, while routing analyses reveal
    content-dependent expert specialization across diffusion phases. These results
    suggest that temporally coherent, prior-evidence routing is an effective conditional-computation
    strategy for unified audio generation. Project page: https://caiyunrui.github.io/SonicWeave.'
- title: 'BEST-RQ-2: Contextualize-Then-Predict, a Two-Step Approach for Self-Supervised
    Audio Representations'
  date: 2026-06
  url: https://arxiv.org/abs/2606.30700
  category: generation
  subcategory: audio
  abstract: Self-supervised learning enables audio representations that transfer across
    domains and tasks. We present BEST-RQ-2, an evolution of BEST-RQ that retains
    frozen randomprojection-based discrete targets while introducing a two-step contextualize-then-predict
    pretraining scheme. A ViT context encoder processes only the unmasked spectrogram
    regions, and a lightweight predictor infers targets for the masked regions; the
    predictor is discarded after pretraining. Replacing the original Conformer encoder
    with a ViT shifts performance across domains, slightly reducing speech performance
    while improving music and environmental sounds, with comparable average scores.
    The main improvement comes from decomposing masked prediction into separate contextualization
    and prediction stages. On the X-ARES and XARES-LLM benchmarks, BEST-RQ-2 consistently
    outperforms one-stage baselines in overall transfer while keeping inference compute
    unchanged. Code and model checkpoints are publicly available.
- title: 'SketchSong: Hierarchical Song Generation with Sketch Planning and Fine-Grained
    Multi-Track Modeling'
  date: 2026-06
  url: https://arxiv.org/abs/2606.03169
  category: generation
  subcategory: multimodal
  abstract: Recent song generation systems can synthesize realistic audio, yet generating
    complete songs remains challenging for two reasons. First, explicit song-level
    arrangement planning remains limited in existing methods, so models often need
    to organize overall arrangement development while generating low-level audio details.
    This often leads to incoherence in arrangements, such as weak section transitions
    and limited dynamic progression. Second, coarse modeling of different musical
    parts obscures their distinct roles and interactions, limiting arrangement richness
    of generated songs. In this paper, we present SketchSong, a hierarchical song
    generation framework that addresses these issues through song-level sketch planning
    and fine-grained multi-track modeling. Along the temporal dimension, SketchSong
    first predicts a compact sequence of high-level sketch tokens derived from compressed
    audio representations, and then generates audio tokens conditioned on these sketches.
    This coarse-to-fine process gives the model an explicit arrangement plan before
    detailed audio generation. Along the track dimension, SketchSong explicitly models
    four tracks, i.e., vocals, bass, drums and other instruments. This enables the
    model to capture the roles and interactions of different musical parts more precisely.
    Experiments on song generation benchmarks show that SketchSong consistently outperforms
    our baseline on both objective metrics and human listening tests. Despite not
    employing additional post-training for preference optimization such as lyrics
    and text-prompt alignments, SketchSong achieves competitive results against strong,
    post-trained open-source systems, demonstrating the effectiveness of our overall
    design.
- title: 'From Sounds to Scenes: A Benchmark for Evaluating Context-Aware Auditory
    Scene Understanding in Large Audio Language Models'
  date: 2026-06
  url: https://arxiv.org/abs/2606.25391
  category: analysis
  subcategory: audio
  abstract: 'Recent Large Audio Language Models (LALMs) have achieved remarkable progress
    in audio perceptual tasks across individual acoustic layers, including speech,
    sound, and music. However, existing benchmarks predominantly evaluate these layers
    in isolation, overlooking the complex contextual relationships that arise when
    multiple acoustic sources co-occur in real-world auditory scenes. Real-world auditory
    interpretation requires Context-Aware Auditory Scene Understanding (CASU): the
    ability to comprehend the holistic scene by integrating sound layers. To evaluate
    this capability, we introduce the CASU benchmark, which assesses whether Audio
    LLMs can interpret auditory scenes composed of speech, acoustic events (e.g.,
    announcements), and background environments (e.g., traffic), and reason about
    the logical relationships between these layers. We propose a scalable pipeline
    for constructing time-accurate, semi-synthetic audio streams by composing real-world
    scene sounds with synthetic speech. Building on this data, we design four tasks
    that probe scene understanding: contextual question answering, entity extraction
    from the scene, speaker role inference, and counterfactual reasoning where scene
    is manipulated. Experiments across multiple LALMs demonstrate that effective auditory
    scene understanding requires integration over all auditory layers, rather than
    reliance on speech or sound alone, underscoring the necessity of CASU for advancing
    complex audio understanding in LALMs.'
- title: Is One Score Enough? Assessing Singing Quality of Songs with Temporal Score
    Curves
  date: 2026-07
  url: https://arxiv.org/abs/2607.16599
  category: evaluation
  subcategory: symbolic
  abstract: Singing Quality Assessment (SQA) has become increasingly important for
    practical multimedia applications and Music AI systems, yet existing studies predominantly
    focus on short singing clips and remain insufficient for full-length songs. Unlike
    clip-level assessment, full-length song SQA requires modeling how singing quality
    varies across different audio segments and how these local variations influence
    the overall evaluation of vocal performance. Moreover, the scarcity of segment-level
    annotations makes effective supervision challenging, as directly assigning a single
    overall score label to every segment tends to treat different segment qualities
    as equivalent. To address these challenges, we propose SongSQA, a two-stage framework
    for full-length song SQA. In the first stage, a Segment Score Predictor is trained
    with pseudo labels generated by a pre-trained teacher model, enabling segment-level
    singing quality prediction without requiring manual segment annotations. In the
    second stage, a Song Quality Aggregator integrates segment features and predicted
    segment scores into unified segment embeddings, and employs a learnable song embedding
    together with self-attention to capture the connection between segment-level vocal
    performance and overall song quality. In this way, SongSQA dynamically aggregates
    critical quality cues across the song to produce a holistic quality prediction,
    while also generating a temporal segment-level quality curve. Experimental results
    demonstrate the effectiveness of SongSQA for full-length song SQA, achieving up
    to a 13.95% relative improvement in KTAU over the strongest baseline, while consistently
    improving other evaluation metrics across all datasets.
- title: 'TORUS: A Test of Rendering-Understanding Self-Coherence for Unified Audio
    Models'
  date: 2026-07
  url: https://arxiv.org/abs/2607.28896
  category: generation
  subcategory: audio
  abstract: 'Unified audio models capable of audio understanding, audio generation
    and, increasingly, audio editing are proliferating rapidly. Yet a basic question
    about them remains unanswered: do the two heads of a unified model agree about
    the same audio? Current practice evaluates each capability in isolation on specialized
    benchmarks, and never asks whether a model can make sense of its own generations.
    We present TORUS, the first self-coherence test for audio-native unified models.
    TORUS comprises 48 three-stage self-coherence tests carrying 432 six-option questions
    spanning speech, sound and music across five task families. We holistically evaluate
    five open unified models alongside a Cascaded Baseline that combines state-of-the-art
    specialized generation, editing and understanding models. The best unified model
    answers 50.5% of questions against the Cascaded Baseline''s 63.2% and a 16.7%
    chance floor. Models struggle on audio editing. Among the evaluated audio models
    (specialized and unified), we observe limited self-coherence, and thus position
    self-coherence as an essential test for future audio systems.'
- title: Cinematic Audio Source Separation Using Visual Cues
  date: 2026-03
  url: https://arxiv.org/abs/2603.26113
  category: generation
  subcategory: audio
  abstract: Cinematic Audio Source Separation (CASS) aims to decompose mixed film
    audio into speech, music, and sound effects, enabling applications like dubbing
    and remastering. Existing CASS approaches are audio-only, overlooking the inherent
    audio-visual nature of films, where sounds often align with visual cues. We present
    the first framework for audio-visual CASS (AV-CASS), leveraging visual context
    to enhance separation quality. Our method formulates CASS as a conditional generative
    modeling problem using conditional flow matching, enabling multimodal audio source
    separation. To address the lack of cinematic datasets with isolated sound tracks,
    we introduce a training data synthesis pipeline that pairs in-the-wild audio and
    video streams (e.g., facial videos for speech, scene videos for effects) and design
    a dedicated visual encoder for this dual-stream setup. Trained entirely on synthetic
    data, our model generalizes effectively to real-world cinematic content and achieves
    strong performance on synthetic, real-world, and audio-only CASS benchmarks. Code
    and demo are available at \url{https://cass-flowmatching.github.io}.
- title: 'Audio Flamingo Next: Next-Generation Open Audio-Language Models for Speech,
    Sound, and Music'
  date: 2026-04
  url: https://arxiv.org/abs/2604.10905
  category: analysis
  subcategory: audio
  abstract: 'We present Audio Flamingo Next (AF-Next), the next-generation and most
    capable large audio-language model in the Audio Flamingo series, designed to advance
    understanding and reasoning over speech, environmental sounds and music. Compared
    to Audio Flamingo 3, AF-Next introduces: (i) a stronger foundational audio-language
    model that significantly improves accuracy across diverse audio understanding
    tasks; (ii) scalable strategies for constructing large-scale audio understanding
    and reasoning data beyond existing academic benchmarks; (iii) support for long
    and complex audio inputs up to 30 minutes; and (iv) Temporal Audio Chain-of-Thought,
    a new reasoning paradigm that explicitly grounds intermediate reasoning steps
    to timestamps in long audio, enabling fine-grained temporal alignment and improved
    interpretability. To enable these capabilities, we first conduct a systematic
    analysis of Audio Flamingo 3 to identify key gaps in audio understanding and reasoning.
    We then curate and scale new large-scale datasets totaling over 1 million hours
    to address these limitations and expand the existing AudioSkills-XL, LongAudio-XL,
    AF-Think and AF-Chat datasets. AF-Next is trained using a curriculum-based strategy
    spanning pre-training, mid-training and post-training stages. Extensive experiments
    across 20 audio understanding and reasoning benchmarks, including challenging
    long-audio tasks, show that AF-Next outperforms similarly sized open models by
    large margins and remains highly competitive with and sometimes surpasses, much
    larger open-weight and closed models. Beyond benchmark performance, AF-Next exhibits
    strong real-world utility and transfers well to unseen tasks, highlighting its
    robustness and generalization ability. In addition to all data, code and methods,
    we open-source 3 variants of AF-Next, including AF-Next-Instruct, AF-Next-Think
    and AF-Next-Captioner.'
- title: 'EchoHawk: A Reproducible Acoustic Pipeline for Drone Detection, Classification,
    and Direction-Finding, with a Cautionary Study of Session-Level Data Leakage'
  date: 2026-06
  url: https://arxiv.org/abs/2606.29589
  category: evaluation
  subcategory: audio
  abstract: 'Passive acoustic sensing is an attractive modality for counter-unmanned
    aerial system (counter-UAS) defence: it is covert, low-cost, and effective against
    drones with small radar cross-sections or minimal radio emissions. We present
    EchoHawk, an open and fully reproducible reference pipeline that detects a drone
    from its rotor harmonics, estimates its blade-passing frequency, and localises
    it with a microphone array via classical wideband beamforming (delay-and-sum,
    MVDR, MUSIC) and time-delay processing (GCC-PHAT, SRP-PHAT), followed by temporal
    tracking. We evaluate the system on a physically transparent synthetic benchmark
    that pits drones against hard low-frequency harmonic confusers, such as ground
    vehicles, and on real recorded audio. Our central methodological contribution
    is a documented case of session-level data leakage in a widely used public dataset:
    because its recordings are pre-segmented into short clips, naive clip-level splits
    place adjacent slices of the same continuous recording in both training and test
    sets, inflating reported performance. Enforcing recording-session-grouped cross-validation
    reduces, for example, a random-forest baseline''s detection probability at a 1%
    false-alarm rate from 0.796 to 0.745, yielding honest numbers. All code, figures,
    and a synthetic data generator are released so that every result runs without
    any download.'
- title: 'MMAE: A Massive Multitask Audio Editing Benchmark'
  date: 2026-06
  url: https://arxiv.org/abs/2606.07229
  category: evaluation
  subcategory: audio
  abstract: We introduce MMAE, a Massive Multitask Audio Editing benchmark, serving
    as the first comprehensive evaluation testbed designed for general-purpose instruction-based
    audio editing. Spurred by the shift toward intelligent creation, interactive editing
    has rapidly expanded from visual domains, pioneered by models like Nano-banana
    2 for images and Gemini-Omni for video, into audio. However, the current evaluation
    infrastructure lags severely, remaining highly fragmented and restricted to specific
    subdomains or basic operations. Unlike existing benchmarks that are limited in
    scope, MMAE extends to a broad spectrum of real-world scenarios, encompassing
    7 distinct audio modalities, including sound, speech, music, and their mixtures.
    Furthermore, we establish a comprehensive taxonomy spanning 6 levels of task complexity,
    from basic modifications to multi-hop reasoning and multi-round editing, 2 levels
    of granularity, and 8 distinct operation types. Meticulously curated through human-agent
    collaboration, MMAE comprises 2,000 high-fidelity samples paired with a pioneering
    rubric-based evaluation framework. By decomposing free-form tasks into 17,741
    verifiable criteria, this robust rubric-based paradigm enables a precise, multi-dimensional
    assessment of both instruction following and context consistency. Our extensive
    evaluation of leading models reveals that current systems remain far from achieving
    reliable edits. Strikingly, the Exact Match Rate (EMR) consistently falls below
    5% and plummets to an absolute 0% in complex, mixed-modality tasks, exposing critical
    bottlenecks in precise execution and structural robustness. We hope MMAE will
    serve as a catalyst for future advances in the intelligent creation community,
    providing a clear diagnostic roadmap and establishing a standardized, long-lasting
    evaluation paradigm for next-generation audio editing systems.
- title: 'OmniSonic: Towards Universal and Holistic Audio Generation from Video and
    Text'
  date: 2026-04
  url: https://arxiv.org/abs/2604.04348
  category: evaluation
  subcategory: audio
  abstract: 'In this paper, we propose Universal Holistic Audio Generation (UniHAGen),
    a task for synthesizing comprehensive auditory scenes that include both on-screen
    and off-screen sounds across diverse domains (e.g., ambient events, musical instruments,
    and human speech). Prior video-conditioned audio generation models typically focus
    on producing on-screen environmental sounds that correspond to visible sounding
    events, neglecting off-screen auditory events. While recent holistic joint text-video-to-audio
    generation models aim to produce auditory scenes with both on- and off-screen
    sound but they are limited to non-speech sounds, lacking the ability to generate
    or integrate human speech. To overcome these limitations, we introduce OmniSonic,
    a flow-matching-based diffusion framework jointly conditioned on video and text.
    It features a TriAttn-DiT architecture that performs three cross-attention operations
    to process on-screen environmental sound, off-screen environmental sound, and
    speech conditions simultaneously, with a Mixture-of-Experts (MoE) gating mechanism
    that adaptively balances their contributions during generation. Furthermore, we
    construct UniHAGen-Bench, a new benchmark with over one thousand samples covering
    three representative on/off-screen speech-environment scenarios. Extensive experiments
    show that OmniSonic consistently outperforms state-of-the-art approaches on both
    objective metrics and human evaluations, establishing a strong baseline for universal
    and holistic audio generation. Project page: https://weiguopian.github.io/OmniSonic_webpage/'
- title: 'MuseCritic: Learning Multi-Aspect Song Rewards through Natural-Language
    Aesthetic Critiques'
  date: 2026-08
  url: https://arxiv.org/abs/2608.11755
  category: evaluation
  subcategory: audio
  abstract: 'Long-form song generation models continue to improve in duration, structural
    integrity, and acoustic complexity, making reliable aesthetic rewards increasingly
    important for aligning these models with human preferences. However, reward models
    for complete songs remain limited, and existing evaluators typically predict scores
    in a single forward pass without providing readable explanations. We introduce
    MUSECRITIC, a semi-scalar reward model that generates a natural-language critique
    covering five aesthetic dimensions and uses it as an intermediate representation
    to predict continuous reward scores. MUSECRITIC follows a two-stage training pipeline:
    a teacher model first provides high-quality critiques for supervised fine-tuning,
    after which the fine-tuned model generates its own critiques for reward learning,
    mitigating distribution shift between training and inference. On an in-domain
    test set of 200 SongEval songs, MUSECRITIC reduces macro-averaged mean squared
    error from 0.2875 to 0.2316 and improves macro-averaged LCC, SRCC, and Kendall''s
    tau to 0.9068, 0.8838, and 0.7178, respectively. On the out-of-domain Music Arena
    benchmark with 733 preference pairs, it achieves the highest accuracy of 71.35%.
    Moreover, using MUSECRITIC with GRPO improves Muse-0.6B on all nine aesthetic
    metrics from SongEval and Audiobox Aesthetics. These results demonstrate that
    critique-conditioned reward modeling reduces scoring error and provides an effective
    optimization signal for song generation. The project repository is available at
    https://github.com/WuqnEl/MuseCritic.'
- title: 'Audio-Omni: Extending Multi-modal Understanding to Versatile Audio Generation
    and Editing'
  date: 2026-04
  url: https://arxiv.org/abs/2604.10708
  category: generation
  subcategory: audio
  abstract: Recent progress in multimodal models has spurred rapid advances in audio
    understanding, generation, and editing. However, these capabilities are typically
    addressed by specialized models, leaving the development of a truly unified framework
    that can seamlessly integrate all three tasks underexplored. While some pioneering
    works have explored unifying audio understanding and generation, they often remain
    confined to specific domains. To address this, we introduce Audio-Omni, the first
    end-to-end framework to unify generation and editing across general sound, music,
    and speech domains, with integrated multi-modal understanding capabilities. Our
    architecture synergizes a frozen Multimodal Large Language Model for high-level
    reasoning with a trainable Diffusion Transformer for high-fidelity synthesis.
    To overcome the critical data scarcity in audio editing, we construct AudioEdit,
    a new large-scale dataset comprising over one million meticulously curated editing
    pairs. Extensive experiments demonstrate that Audio-Omni achieves state-of-the-art
    performance across a suite of benchmarks, outperforming prior unified approaches
    while achieving performance on par with or superior to specialized expert models.
    Beyond its core capabilities, Audio-Omni exhibits remarkable inherited capabilities,
    including knowledge-augmented reasoning generation, in-context generation, and
    zero-shot cross-lingual control for audio generation, highlighting a promising
    direction toward universal generative audio intelligence. The code, model, and
    dataset will be publicly released on https://zeyuet.github.io/Audio-Omni.
- title: 'EntangleCodec: A Unified Discrete Audio Tokenizer via Semantic-Acoustic
    Entanglement'
  date: 2026-06
  url: https://arxiv.org/abs/2606.02739
  category: analysis
  subcategory: audio
  abstract: 'Audio tokenizers serve as the discrete interface between continuous audio
    and Audio Language Models (ALMs), but existing tokenizers often struggle to support
    both understanding and generation. Reconstruction-oriented codecs preserve acoustic
    fidelity but lack rich semantics, while semantic-aware tokenizers typically rely
    on separate semantic and acoustic streams, introducing redundancy or misalignment.
    We propose EntangleCodec, a unified discrete audio tokenizer that learns caption-aligned
    semantic-acoustic representations before quantization. By aligning audio with
    rich captions rather than ASR transcripts, EntangleCodec captures linguistic content,
    speaker identity, emotion, prosody, and acoustic scenes within a compact token
    stream. A flow-matching diffusion decoder further enables high-quality reconstruction
    across speech, music, and general audio. EntangleCodec achieves reconstruction
    quality competitive with specialized codecs, outperforms all codec-based baselines
    on audio understanding by up to +7.4\% on MMAR, and supports both TTS and TTA
    generation in a unified framework. Furthermore, EntangleCodec-based audio language
    models demonstrate strong scaling behavior: even at 0.6B parameters, the model
    surpasses specialized continuous-representation LLMs with over 13B parameters
    across three benchmarks using 22\times fewer parameters; scaling to 8B further
    establishes new state-of-the-art results on MMAR, highlighting that representation
    quality is as critical as model scale in audio language modeling. Code and model
    weights are available at https://github.com/luckyerr/EntangleCodec.'
- title: 'LaDA-Band: Language Diffusion Models for Vocal-to-Accompaniment Generation'
  date: 2026-04
  url: https://arxiv.org/abs/2604.11052
  category: generation
  subcategory: audio
  abstract: 'Vocal-to-accompaniment (V2A) generation, which aims to transform a raw
    vocal recording into a fully arranged accompaniment, inherently requires jointly
    addressing an accompaniment trilemma: preserving acoustic authenticity, maintaining
    global coherence with the vocal track, and producing dynamic orchestration across
    a full song. Existing open-source approaches typically make compromises among
    these goals. Continuous-latent generation models can capture long musical spans
    but often struggle to preserve fine-grained acoustic detail. In contrast, discrete
    autoregressive models retain local fidelity but suffer from unidirectional generation
    and error accumulation in extended contexts. We present LaDA-Band, an end-to-end
    framework that introduces Discrete Masked Diffusion to the V2A task. Our approach
    formulates V2A generation as Discrete Masked Diffusion, i.e., a global, non-autoregressive
    denoising formulation that combines the representational advantages of discrete
    audio codec tokens with full-sequence bidirectional context modeling. This design
    improves long-range structural consistency and temporal synchronization while
    preserving crisp acoustic details. Built on this formulation, LaDA-Band further
    introduces a dual-track prefix-conditioning architecture, an auxiliary replaced-token
    detection objective for weakly anchored accompaniment regions, and a two-stage
    progressive curriculum to scale Discrete Masked Diffusion to full-song vocal-to-accompaniment
    generation. Extensive experiments on both academic and real-world benchmarks show
    that LaDA-Band consistently improves acoustic authenticity, global coherence,
    and dynamic orchestration over existing baselines, while maintaining strong performance
    even without auxiliary reference audio. Codes and audio samples are available
    at https://github.com/Duoluoluos/TME-LaDA-Band .'
