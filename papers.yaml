    project_url: ""
    abstract: "Proposes the Compound Word Transformer for pop piano generation. By encoding musical events in a beat-based 'compound word' representation and training with masking on a large pop piano dataset, the model generates expressive compositions with consistent structure, surpassing prior Transformer and RNN baselines in both objective and human evaluations."
    tags: ["symbolic", "pop music", "compound word"]
  - title: "Museformer: Transformer with Fine- and Coarse-Grained Attention for Music Generation"
