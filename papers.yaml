    abstract: "Reviews music generation systems from the perspective of modalities, categorizing approaches as single-modal (score- or audio-only), cross-modal (text/image/video guidance) and multi-modal. Discusses datasets, methodologies and future directions for multimodal music generation, a fast-growing area with applications from film scoring to interactive creation."
