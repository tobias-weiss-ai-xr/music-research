      - "Antoine Caillon"
      - "Qingqing Huang"
      - "Aren Jansen"
    venue: ""
    code_url: ""
    project_url: ""
    abstract: "Introduces MusicLM, a model generating high-fidelity music from text descriptions such as 'a calming violin melody backed by a distorted guitar riff'. Casts conditional music generation as a hierarchical sequence-to-sequence task and produces 24 kHz music coherent over minutes, with new capabilities such as story-mode generation and text-conditioned melody control."
