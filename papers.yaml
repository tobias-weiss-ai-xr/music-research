      - "Fan Zhang"
      - "Kim-Hui Yap"
      - "Wei Hu"
    venue: ""
    code_url: ""
    project_url: ""
    abstract: "MuseAgent is a music-centric multimodal agent that augments language models with structured symbolic representations from sheet-music images and performance audio via optical music recognition and automatic transcription modules. Introduces MuseBench for music theory reasoning, score interpretation and performance-level analysis across text, image and audio, where MuseAgent substantially outperforms general-purpose MLLMs."
    tags: ["agents", "OMR", "transcription", "multimodal"]
  - title: "ABC-Eval: Benchmarking Large Language Models on Symbolic Music Understanding and Instruction Following"
    date: "2025-09"
    url: "https://arxiv.org/abs/2509.23350"
