  - title: "Simple and Controllable Music Generation"
    date: "2023-06"
    url: "https://arxiv.org/abs/2306.05284"
    category: "generation"
    subcategory: "audio"
    authors:
      - "Jade Copet"
      - "Felix Kreuk"
      - "Itai Gat"
      - "Tal Remez"
      - "David Kant"
      - "Gabriel Synnaeve"
      - "Yossi Adi"
      - "Alexandre Défossez"
    venue: "NeurIPS 2023"
    code_url: "https://github.com/facebookresearch/audiocraft"
    project_url: ""
    abstract: "Introduces MusicGen, a single language model operating over several streams of compressed discrete music representation (tokens). Unlike prior work, MusicGen uses a single-stage transformer LM with efficient token interleaving, supporting text- and melody-conditioned generation with state-of-the-art results and a small, open-sourced model."
    tags: ["text-to-music", "language model", "EnCodec"]
  # ── Generation · Symbolic ───────────────────────────────────────────────────
  - title: "Music Transformer"
    date: "2018-09"
    url: "https://arxiv.org/abs/1809.04281"
    category: "generation"
    subcategory: "symbolic"
    authors:
      - "Cheng-Zhi Anna Huang"
      - "Ashish Vaswani"
      - "Jakob Uszkoreit"
      - "Noam Shazeer"
      - "Ian Simon"
      - "Curtis Hawthorne"
      - "Andrew M. Dai"
      - "Matthew D. Hoffman"
    venue: "ICLR 2019"
    code_url: "https://github.com/magenta/music-transformer"
    project_url: ""
    abstract: "Adapts the Transformer to symbolic music by introducing relative attention, which lets the model exploit musical repetition and self-reference across timescales from motifs to full ABA sections. Demonstrates long, coherent generation of piano performance, addressing the quadratic memory cost of full attention for long sequences."
    tags: ["symbolic", "transformer", "relative attention"]
  - title: "Pop Music Transformer: Beat-based Modeling and Generation of Expressive Pop Piano Compositions"
    date: "2020-02"
    url: "https://arxiv.org/abs/2002.00212"
    category: "generation"
    subcategory: "symbolic"
    authors:
      - "Yu-Siang Huang"
      - "Yi-Hsuan Yang"
    venue: "ACM Multimedia 2020"
    code_url: "https://github.com/sander-wood/pop-music-transformer"
    project_url: ""
    abstract: "Proposes the Compound Word Transformer for pop piano generation. By encoding musical events in a beat-based 'compound word' representation and training with masking on a large pop piano dataset, the model generates expressive compositions with consistent structure, surpassing prior Transformer and RNN baselines in both objective and human evaluations."
    tags: ["symbolic", "pop music", "compound word"]
  - title: "Museformer: Transformer with Fine- and Coarse-Grained Attention for Music Generation"
    date: "2022-10"
    url: "https://arxiv.org/abs/2210.10349"
    category: "generation"
    subcategory: "symbolic"
    authors:
      - "Botao Yu"
      - "Peiling Lu"
      - "Rui Wang"
      - "Wei Hu"
      - "Xu Tan"
      - "Wei Ye"
      - "Shikun Zhang"
      - "Tao Qin"
    venue: "NeurIPS 2022"
    code_url: "https://github.com/microsoft/muzic/tree/main/museformer"
    project_url: ""
    abstract: "Presents Museformer, a Transformer with fine- and coarse-grained attention for symbolic music generation. The coarse-grained attention reduces complexity while preserving global structure, and an automatic pattern learning mechanism discovers which tokens benefit from which granularity, enabling efficient generation of sequences over 10,000 tokens with strong structure."
    tags: ["symbolic", "efficient attention", "long sequence"]
