      - "Victor Shea-Jay Huang"
      - "Yue Liao"
    venue: ""
    code_url: ""
    project_url: ""
    abstract: "A survey of vision-to-music generation (video-to-music and image-to-music), a significant branch of multimodal AI with applications in film scoring, short-video creation and dance music synthesis. Systematizes methods, datasets and evaluation protocols, and outlines open challenges for aligning visual content with music generation."
