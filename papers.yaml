  - title: "A Survey on Evaluation Metrics for Music Generation"
    date: "2025-08"
    url: "https://arxiv.org/abs/2509.00051"
    category: "survey"
    subcategory: "audio"
    authors:
      - "Faria Binte Kader"
      - "Santu Karmaker"
    venue: ""
    code_url: ""
    project_url: ""
    abstract: "Sheds light on the evaluation of generated music, which lags behind generation capabilities due to music's complex structure, coherence, creativity and emotional expressiveness. Reviews existing objective and subjective evaluation metrics, identifies gaps and offers directions for more comprehensive evaluation of music generation systems."
    tags: ["survey", "evaluation", "generation"]
