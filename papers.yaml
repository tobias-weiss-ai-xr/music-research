  - title: "MIDI-RAE-JEPA: Hierarchical Representation Learning and Generation for Symbolic Music"
    date: "2026-07"
    url: "https://arxiv.org/abs/2607.14537"
    category: "generation"
    subcategory: "symbolic"
    authors:
      - "Scott H. Hawley"
    venue: ""
    code_url: ""
    project_url: ""
    abstract: "MIDI-RAE-JEPA combines pitch- and time-shift equivariance objectives with LeJEPA and a Swin Transformer V2 encoder to learn hierarchical, self-supervised representations of symbolic music as piano-roll images. A flow-matching decoder conditioned on the embeddings generates music closely matching conditioning register and rhythm, with representations beating a Haar scattering baseline on emotion classification."
    tags: ["symbolic", "self-supervised", "JEPA"]
