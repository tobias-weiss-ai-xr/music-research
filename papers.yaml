  - title: "A Survey on Multimodal Music Emotion Recognition"
    date: "2025-04"
    url: "https://arxiv.org/abs/2504.18799"
    category: "survey"
    subcategory: "multimodal"
    authors:
      - "Rashini Liyanarachchi"
      - "Aditya Joshi"
      - "Erik Meijering"
    venue: ""
    code_url: ""
    project_url: ""
    abstract: "Comprehensive overview of multimodal music emotion recognition (MMER), an emerging discipline in music information retrieval. Discusses approaches combining audio, lyrics, video and contextual signals, datasets, feature representations, fusion strategies and open challenges toward robust, culturally-aware music emotion understanding."
